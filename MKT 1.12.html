<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Marketing Study Companion</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mkt Study">
<meta name="theme-color" content="#0a0c0f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg-page:#0a0c0f;
  --bg-side:#06070a;
  --bg-card:#151920;
  --bg-panel:#1c212a;
  --bg-panel-2:#232833;
  --text-primary:#f3ede2;
  --text-secondary:#98a2b3;
  --text-faint:#5f6774;
  --border:#262c37;
  --border-soft:#1c212a;
  --lo1:#5b8def; --lo1-tint:rgba(91,141,239,.15);
  --lo2:#e0964f; --lo2-tint:rgba(224,150,79,.15);
  --lo3:#4fbf94; --lo3-tint:rgba(79,191,148,.15);
  --lo4:#cf6fb4; --lo4-tint:rgba(207,111,180,.15);
  --lo5:#d3c24a; --lo5-tint:rgba(211,194,74,.15);
  --good:#49b57e; --good-bg:rgba(73,181,126,.14);
  --bad:#e2685f; --bad-bg:rgba(226,104,95,.14);
  --warn:#e0964f; --warn-bg:rgba(224,150,79,.14);
  --radius:12px;
  --font-serif:'Fraunces',Georgia,serif;
  --font-sans:'Public Sans',Arial,sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg-page);color:var(--text-primary);font-family:var(--font-sans);line-height:1.55;-webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:inherit}
button,input,select,textarea{font-family:inherit}
::selection{background:#3a5cad55}
h1,h2,h3,h4{font-family:var(--font-serif);font-weight:600;margin:0}
.mono{font-family:var(--font-mono)}

#app{display:flex;min-height:100vh}

/* ============ SIDEBAR ============ */
#sidebar{width:280px;flex-shrink:0;background:var(--bg-side);border-right:1px solid var(--border);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:40}
.brand{padding:20px 18px 14px;border-bottom:1px solid var(--border)}
.brand-name{font-family:var(--font-serif);font-size:1.28rem;font-weight:700;margin:0}
.brand-sub{font-size:.74rem;color:var(--text-faint);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.06em;margin-top:2px}

.mode-toggle{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:14px 14px 8px}
.mode-btn{padding:10px 6px;border-radius:9px;border:1px solid var(--border);background:var(--bg-card);
  color:var(--text-secondary);font-size:.8rem;font-weight:600;cursor:pointer;text-align:center}
.mode-btn.active{background:var(--lo1);color:#04070d;border-color:var(--lo1)}

.side-search{padding:6px 14px 10px}
.side-search input{width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--border);
  background:var(--bg-card);color:var(--text-primary);font-size:.85rem}
.side-search input::placeholder{color:var(--text-faint)}
#sideSearchResults{max-height:220px;overflow-y:auto;margin:0 14px 10px;border-radius:9px}
.sr-item{padding:8px 10px;border-radius:7px;cursor:pointer;font-size:.79rem;border-bottom:1px solid var(--border-soft)}
.sr-item:hover{background:var(--bg-panel)}
.sr-item .sr-kind{font-family:var(--font-mono);font-size:.64rem;color:var(--text-faint);text-transform:uppercase}

.chapter-tree{padding:4px 10px;flex:1}
.ct-chapter{margin-bottom:4px}
.ct-head{display:flex;justify-content:space-between;align-items:center;padding:9px 8px;border-radius:8px;
  cursor:pointer;font-size:.84rem;font-weight:600}
.ct-head:hover{background:var(--bg-card)}
.ct-chevron{transition:transform .15s;color:var(--text-faint);font-size:.7rem}
.ct-chevron.open{transform:rotate(90deg)}
.ct-los{list-style:none;margin:0;padding-left:6px;max-height:0;overflow:hidden;transition:max-height .2s}
.ct-los.open{max-height:400px}
.ct-los li{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;cursor:pointer;font-size:.78rem;color:var(--text-secondary)}
.ct-los li:hover{background:var(--bg-card);color:var(--text-primary)}
.ct-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}

.side-settings{margin:6px 14px;padding:9px 10px;border-radius:8px;border:1px solid var(--border);
  background:var(--bg-card);cursor:pointer;font-size:.8rem;color:var(--text-secondary);text-align:center}
.side-settings:hover{color:var(--text-primary)}

.side-footer{margin-top:auto;padding:14px;border-top:1px solid var(--border);display:flex;justify-content:space-between;
  font-family:var(--font-mono);font-size:.72rem;color:var(--text-secondary)}
.side-footer b{color:var(--text-primary)}

/* ============ TOPBAR (mobile) ============ */
#topbar{display:none;position:sticky;top:0;z-index:30;background:var(--bg-side);border-bottom:1px solid var(--border);
  padding:12px 14px;align-items:center;justify-content:space-between}
#menuBtn{background:var(--bg-card);border:1px solid var(--border);color:var(--text-primary);
  padding:8px 12px;border-radius:8px;font-size:.82rem;cursor:pointer}

/* ============ MAIN ============ */
#main{flex:1;min-width:0;padding:26px 34px 70px;max-width:1120px}
.panel{display:none}
.panel.active{display:block}

.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.stat-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px}
.stat-label{font-family:var(--font-mono);font-size:.68rem;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em}
.stat-value{font-family:var(--font-serif);font-size:1.9rem;font-weight:700;margin-top:6px}

.section-title{font-size:1.15rem;margin:26px 0 12px}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.chapter-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;cursor:pointer}
.chapter-card:hover{border-color:var(--lo1)}
.chapter-card h4{font-size:1.02rem;margin-bottom:6px}
.chapter-card .cc-meta{font-family:var(--font-mono);font-size:.7rem;color:var(--text-faint);margin-bottom:10px}
.mastery-bar{height:7px;border-radius:4px;background:var(--bg-panel);overflow:hidden}
.mastery-fill{height:100%;background:var(--lo3)}
.mastery-pct{font-family:var(--font-mono);font-size:.72rem;color:var(--text-secondary);margin-top:6px}

.dash-two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}
.info-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px}
.info-card h4{font-size:.98rem;margin-bottom:10px}
.weak-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border-soft);font-size:.84rem}
.weak-row:last-child{border-bottom:none}
.weak-acc{font-family:var(--font-mono);color:var(--bad);font-size:.76rem}
.reco-item{padding:8px 0;border-bottom:1px solid var(--border-soft);font-size:.85rem}
.reco-item:last-child{border-bottom:none}
.reco-item button{margin-top:5px}

.lo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:12px}
.lo-mini{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:12px 14px;cursor:pointer}
.lo-mini:hover{border-color:var(--text-faint)}
.lo-mini .lo-mini-code{font-family:var(--font-mono);font-size:.68rem;color:var(--text-faint)}
.lo-mini .lo-mini-text{font-size:.8rem;margin:5px 0 8px;color:var(--text-secondary);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.status-badge{font-family:var(--font-mono);font-size:.64rem;padding:3px 8px;border-radius:6px;text-transform:uppercase;letter-spacing:.03em}
.status-notstarted{background:var(--bg-panel);color:var(--text-faint)}
.status-learning{background:var(--lo1-tint);color:var(--lo1)}
.status-improving{background:var(--warn-bg);color:var(--warn)}
.status-mastered{background:var(--good-bg);color:var(--good)}

/* buttons */
.btn{padding:9px 16px;border-radius:9px;border:1px solid var(--border);background:var(--bg-panel);
  color:var(--text-primary);font-size:.83rem;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--text-faint)}
.btn.primary{background:var(--lo1);border-color:var(--lo1);color:#04070d}
.btn.good{background:var(--good);border-color:var(--good);color:#04150c}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#1a0605}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-row{display:flex;gap:9px;flex-wrap:wrap}

/* ============ STUDY MODE ============ */
.hl-toolbar{position:sticky;top:0;z-index:20;background:var(--bg-page);padding:10px 0 12px;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--border);margin-bottom:20px}
.hl-label{font-size:.76rem;color:var(--text-faint);font-family:var(--font-mono)}
.hl-swatch{padding:6px 12px;border-radius:999px;font-size:.75rem;font-weight:600;cursor:pointer;border:1px solid transparent}
.hl-swatch.active{outline:2px solid var(--text-primary);outline-offset:1px}
.hl-important{background:#5b8def33;color:#a9c4f5}
.hl-exam{background:#e2685f33;color:#f0aaa5}
.hl-definition{background:#4fbf9433;color:#a6e6cf}
.hl-confusing{background:#d3c24a33;color:#ecdf9f}
.hl-askprof{background:#cf6fb433;color:#eab8db}
.hl-clear{margin-left:auto;font-size:.76rem;padding:6px 12px;border-radius:8px;border:1px solid var(--border);
  background:var(--bg-card);cursor:pointer;color:var(--text-secondary)}
mark.hlx{cursor:pointer;padding:0 2px;border-radius:3px}
mark.hlx-important{background:#5b8def4d}
mark.hlx-exam{background:#e2685f4d}
mark.hlx-definition{background:#4fbf944d}
mark.hlx-confusing{background:#d3c24a4d}
mark.hlx-askprof{background:#cf6fb44d}

.study-chapter{margin-bottom:44px}
.study-chapter-title{font-size:1.9rem;margin-bottom:4px}
.study-chapter-kicker{font-family:var(--font-mono);font-size:.76rem;color:var(--text-faint);margin-bottom:22px}

.lo-section{scroll-margin-top:66px;margin-bottom:26px;border-radius:var(--radius);overflow:hidden;border:1px solid var(--border)}
.lo-banner{padding:14px 20px;color:#04070d;font-weight:700}
.lo-banner .lob-code{font-family:var(--font-mono);font-size:.72rem;opacity:.75;display:block;margin-bottom:3px;font-weight:600}
.lo-banner .lob-text{font-family:var(--font-serif);font-size:1.12rem}
.lo-card{background:var(--bg-card);padding:20px 22px}
.lo-card h4{font-size:1rem;margin:20px 0 8px}
.lo-card h4:first-child{margin-top:0}
.lo-card p{margin:0 0 12px;max-width:74ch;color:var(--text-primary)}
span.term{font-weight:700;color:inherit;border-bottom:1px dotted var(--text-faint)}
span.term.term-hit{cursor:pointer;color:#5fd4c4;border-bottom:1.5px solid #5fd4c4;padding:0 1px;border-radius:2px;transition:background .12s}
span.term.term-hit:hover{background:#5fd4c422}
span.term.term-hit.term-repeat{color:#5fd4c499;border-bottom-color:#5fd4c477}
.vocab-nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:18px;padding-top:14px;border-top:1px solid var(--border)}
.vocab-nav-row .vn-pos{font-family:var(--font-mono);font-size:.7rem;color:var(--text-faint)}

/* Ask the Book assistant */
#askBookBtn{position:fixed;bottom:22px;right:22px;z-index:60;background:#5fd4c4;color:#04211c;border:none;
  border-radius:999px;padding:13px 20px;font-weight:700;font-size:.85rem;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.4);
  display:flex;align-items:center;gap:8px}
#askBookBtn:hover{filter:brightness(1.06)}
#askBookPanel{position:fixed;bottom:0;right:0;z-index:70;width:380px;max-width:100vw;height:min(560px,80vh);
  background:var(--bg-card);border:1px solid var(--border);border-radius:16px 16px 0 0;display:none;flex-direction:column;
  box-shadow:0 -8px 30px rgba(0,0,0,.5)}
#askBookPanel.open{display:flex}
.ab-header{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.ab-header h4{font-size:.96rem}
.ab-header .ab-sub{font-family:var(--font-mono);font-size:.66rem;color:var(--text-faint);margin-top:2px}
.ab-close{background:none;border:none;color:var(--text-faint);font-size:1.2rem;cursor:pointer}
.ab-messages{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.ab-msg{max-width:88%;font-size:.85rem;line-height:1.5;padding:10px 13px;border-radius:12px}
.ab-msg.user{align-self:flex-end;background:#5fd4c4;color:#04211c;border-bottom-right-radius:3px}
.ab-msg.bot{align-self:flex-start;background:var(--bg-panel);color:var(--text-primary);border-bottom-left-radius:3px}
.ab-msg.bot .ab-term{font-weight:700;font-family:var(--font-serif);margin-bottom:4px;display:block}
.ab-msg.bot .ab-jump{margin-top:8px;background:none;border:1px solid var(--border);color:var(--text-secondary);
  border-radius:7px;padding:5px 10px;font-size:.72rem;cursor:pointer}
.ab-input-row{padding:12px 14px;border-top:1px solid var(--border);display:flex;gap:8px}
.ab-input-row input{flex:1;padding:10px 12px;border-radius:9px;border:1px solid var(--border);background:var(--bg-panel);color:var(--text-primary);font-size:.85rem}
.ab-input-row button{background:#5fd4c4;color:#04211c;border:none;border-radius:9px;padding:0 16px;font-weight:700;cursor:pointer}
@media (max-width:480px){ #askBookPanel{width:100vw;border-radius:14px 14px 0 0} }
.example{border:1px solid var(--border);background:var(--bg-panel);border-radius:9px;padding:12px 15px;margin:14px 0;max-width:74ch}
.example .ex-label{font-weight:700;font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;font-family:var(--font-mono);
  color:var(--lo3);margin-bottom:6px;display:block}
.formula{border:1px dashed var(--text-faint);background:var(--bg-panel-2);border-radius:9px;padding:12px 15px;margin:14px 0;max-width:74ch}
.formula .f-label{font-weight:700;font-size:.78rem;text-transform:uppercase;font-family:var(--font-mono);color:var(--lo2);margin-bottom:6px;display:block}
.chart-box{background:var(--bg-panel);border:1px solid var(--border);border-radius:10px;padding:14px;margin:16px 0;max-width:640px}
.chart-box svg{width:100%;height:auto;display:block}
.chart-caption{font-size:.74rem;color:var(--text-faint);margin-top:8px;font-family:var(--font-mono)}
.data-table{width:100%;border-collapse:collapse;font-size:.82rem;margin:12px 0}
.data-table th,.data-table td{border:1px solid var(--border);padding:7px 10px;text-align:left}
.data-table th{background:var(--bg-panel-2);font-family:var(--font-mono);font-size:.7rem;text-transform:uppercase}

.cs-block{background:var(--bg-panel);border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin:14px 0}
.cs-block h5{font-size:.94rem;margin-bottom:6px}
.cs-block .cs-why{margin-top:8px;padding-top:8px;border-top:1px solid var(--border);font-size:.82rem;color:var(--text-secondary)}
.cs-block .cs-why b{color:var(--text-primary)}

.glossary-table{width:100%;border-collapse:collapse;margin-top:12px;font-size:.85rem}
.glossary-table th,.glossary-table td{border:1px solid var(--border);padding:9px 12px;vertical-align:top;text-align:left}
.glossary-table th{background:var(--bg-panel-2);font-family:var(--font-mono);font-size:.72rem;text-transform:uppercase}
.glossary-table td.gterm{font-weight:700;cursor:pointer;white-space:nowrap}
.glossary-table td.gterm:hover{color:var(--lo1)}
.must-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--lo2);margin-right:6px}

.wrapup-box{margin-top:24px;padding:18px 20px;border:1px dashed var(--border);border-radius:var(--radius);background:var(--bg-card)}

/* ============ PRACTICE MODE ============ */
.tool-pills{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:22px}
.tool-pill{padding:8px 14px;border-radius:999px;border:1px solid var(--border);background:var(--bg-card);
  font-size:.79rem;font-weight:600;cursor:pointer;color:var(--text-secondary)}
.tool-pill.active{background:var(--text-primary);color:#0a0c0f;border-color:var(--text-primary)}

.scope-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.scope-row select,.scope-row input[type=number]{padding:8px 10px;border-radius:8px;border:1px solid var(--border);
  background:var(--bg-card);color:var(--text-primary);font-size:.82rem}
.chk-label{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--text-secondary)}

/* flashcards */
.flash-wrap{display:flex;flex-direction:column;align-items:center;gap:16px}
.flash-progress{font-family:var(--font-mono);font-size:.78rem;color:var(--text-faint)}
.flashcard{width:100%;max-width:540px;height:280px;perspective:1300px;cursor:pointer}
.flashcard-inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flashcard.flipped .flashcard-inner{transform:rotateY(180deg)}
.flash-face{position:absolute;inset:0;backface-visibility:hidden;border:1px solid var(--border);border-radius:14px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px;text-align:center;background:var(--bg-card)}
.flash-face.back{transform:rotateY(180deg)}
.flash-term{font-family:var(--font-serif);font-size:1.5rem;font-weight:700}
.flash-tier{font-family:var(--font-mono);font-size:.66rem;color:var(--text-faint);text-transform:uppercase;margin-top:10px}
.flash-def{font-size:1rem;line-height:1.6}

/* quiz */
.quiz-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:22px 24px;max-width:680px}
.quiz-top{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:.76rem;color:var(--text-faint);margin-bottom:12px}
.quiz-prompt{font-family:var(--font-serif);font-size:1.18rem;margin-bottom:16px;line-height:1.5}
.quiz-opt{display:block;width:100%;text-align:left;padding:12px 15px;margin-bottom:8px;border-radius:9px;
  border:1px solid var(--border);background:var(--bg-panel);color:var(--text-primary);cursor:pointer;font-size:.92rem}
.quiz-opt:hover:not(:disabled){border-color:var(--text-faint)}
.quiz-opt.correct{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.quiz-opt.incorrect{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.quiz-opt:disabled{cursor:default}
.quiz-input{width:100%;padding:11px 14px;border-radius:9px;border:1px solid var(--border);background:var(--bg-panel);
  color:var(--text-primary);font-size:.92rem;margin-bottom:10px}
.quiz-feedback{margin-top:12px;padding:13px 15px;border-radius:9px;background:var(--bg-panel);font-size:.87rem;line-height:1.55}
.quiz-feedback.correct{border-left:3px solid var(--good)}
.quiz-feedback.incorrect{border-left:3px solid var(--bad)}
.match-pair-row{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.timer-chip{font-family:var(--font-mono);font-size:.78rem;padding:4px 10px;border-radius:7px;background:var(--bg-panel);color:var(--text-secondary)}
.timer-chip.low{color:var(--bad)}

/* match game */
.mg-status{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:.76rem;color:var(--text-faint);margin-bottom:14px}
.mg-grid{display:flex;gap:20px}
.mg-col{flex:1;display:flex;flex-direction:column;gap:9px}
.mg-card{padding:13px 14px;border:1px solid var(--border);border-radius:9px;cursor:pointer;background:var(--bg-card);font-size:.85rem;line-height:1.4}
.mg-card.selected{border-color:var(--text-primary);background:var(--bg-panel)}
.mg-card.correct{background:var(--good-bg);border-color:var(--good);cursor:default}
.mg-card.wrong{background:var(--bad-bg);border-color:var(--bad)}
.mg-overlay{text-align:center;padding:50px 20px}

/* crossword */
.cw-controls{display:flex;gap:9px;margin-bottom:16px;flex-wrap:wrap}
.crossword-wrap{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-start}
.crossword-grid{display:grid;gap:2px;background:var(--border);border:2px solid var(--border);width:max-content}
.cw-cell{width:28px;height:28px;position:relative;background:var(--bg-card)}
.cw-cell.blocked{background:transparent}
.cw-cell input{width:100%;height:100%;border:none;background:transparent;color:var(--text-primary);text-align:center;
  font-weight:700;font-size:.9rem;text-transform:uppercase;padding:0}
.cw-cell input:focus{outline:2px solid var(--lo1);outline-offset:-2px}
.cw-cell input.correct{color:var(--good)}
.cw-cell input.incorrect{color:var(--bad)}
.cw-number{position:absolute;top:1px;left:2px;font-size:.5rem;color:var(--text-faint);pointer-events:none;font-family:var(--font-mono)}
.cw-clues{flex:1;min-width:220px}
.cw-clues h5{font-size:.92rem;margin:0 0 8px}
.cw-clues ol{padding-left:18px;margin:0 0 18px}
.cw-clues li{font-size:.8rem;margin-bottom:6px}

/* concept cards */
.concept-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.concept-card{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:13px 15px;cursor:pointer}
.concept-card:hover{border-color:var(--text-faint)}
.concept-card .cctier{font-family:var(--font-mono);font-size:.62rem;text-transform:uppercase;color:var(--text-faint)}
.concept-card h5{font-size:.92rem;margin:5px 0}
.concept-card p{font-size:.78rem;color:var(--text-secondary);margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* mini games menu */
.game-menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.game-tile{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:16px;cursor:pointer}
.game-tile:hover{border-color:var(--lo4)}
.game-tile h5{font-size:.95rem;margin-bottom:5px}
.game-tile p{font-size:.78rem;color:var(--text-secondary);margin:0}
.final-score{text-align:center;padding:40px 10px}
.final-score .fs-num{font-family:var(--font-serif);font-size:2.6rem;font-weight:700;margin:8px 0}

/* order it */
.orderit-list{display:flex;flex-direction:column;gap:8px;max-width:560px}
.orderit-item{padding:11px 14px;border:1px solid var(--border);border-radius:8px;background:var(--bg-card);cursor:pointer;font-size:.87rem;display:flex;gap:10px;align-items:center}
.orderit-item.picked{opacity:.4;cursor:default}
.orderit-slot{width:24px;height:24px;border-radius:50%;background:var(--bg-panel);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:.72rem;flex-shrink:0}

/* weak areas */
.weak-table{width:100%;border-collapse:collapse;font-size:.84rem}
.weak-table th,.weak-table td{border-bottom:1px solid var(--border);padding:9px 10px;text-align:left}
.weak-table th{font-family:var(--font-mono);font-size:.68rem;text-transform:uppercase;color:var(--text-faint)}

/* study session */
.session-step{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:14px}
.session-progress-track{height:8px;background:var(--bg-panel);border-radius:4px;overflow:hidden;margin-bottom:20px}
.session-progress-fill{height:100%;background:var(--lo1)}

/* progress mode */
.tab-row{display:flex;gap:6px;margin-bottom:20px;border-bottom:1px solid var(--border)}
.tab-btn{padding:10px 18px;border:none;background:none;color:var(--text-secondary);font-family:var(--font-serif);
  font-size:1rem;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab-btn.active{color:var(--text-primary);border-bottom-color:var(--lo1)}
.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.badge-item{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center;font-size:.78rem}
.badge-item.earned{border-color:var(--lo5);background:var(--lo5-tint)}
.badge-item .badge-icon{font-size:1.5rem;display:block;margin-bottom:6px}
.activity-feed{margin-top:10px}
.activity-item{padding:8px 0;border-bottom:1px solid var(--border-soft);font-size:.82rem;color:var(--text-secondary)}
.hl-list-item{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:9px}
.hl-list-item .hlq{font-style:italic;margin-bottom:6px}
.hl-list-item .hl-meta{display:flex;justify-content:space-between;align-items:center;font-family:var(--font-mono);font-size:.7rem;color:var(--text-faint)}

/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(4,5,7,.7);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal-overlay.open{display:flex}
.modal-box{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:26px 28px;max-width:560px;width:100%;max-height:86vh;overflow-y:auto}
.modal-close{float:right;background:none;border:none;color:var(--text-faint);font-size:1.3rem;cursor:pointer}
.modal-field{margin-bottom:14px}
.modal-field .mf-label{font-family:var(--font-mono);font-size:.68rem;text-transform:uppercase;color:var(--text-faint);margin-bottom:4px}
.modal-field .mf-body{font-size:.9rem;line-height:1.55}
.chip{display:inline-block;padding:4px 10px;border-radius:7px;font-size:.7rem;font-family:var(--font-mono);margin-right:6px}

@media (max-width:860px){
  #sidebar{position:fixed;left:-300px;top:0;height:100vh;transition:left .2s;box-shadow:0 0 30px rgba(0,0,0,.5)}
  #sidebar.open{left:0}
  #topbar{display:flex}
  #main{padding:20px 16px 60px}
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .dash-two-col{grid-template-columns:1fr}
  .mg-grid{flex-direction:column}
  #overlayBg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:39;display:none}
  #overlayBg.open{display:block}
}
</style>

    { id:'ch9-product', term:'Product', tier:'must_know', lo:'9.1', chapterId:'ch9', section:'9.1',

      examQuestion:'Explain the relationship between feature bloat and feature fatigue, and why consumers might say they want more features but end up dissatisfied after buying a feature-bloated product.',
      mnemonic:null },

    { id:'ch9-feature-fatigue', term:'Feature fatigue', tier:'must_know', lo:'9.4', chapterId:'ch9', section:'9.4',
      definition:'Consumer dissatisfaction that results from the actual usage experience of an overly complex, feature-bloated product, even though the added features seemed appealing before purchase.',
      plain:'The frustration and disappointment that sets in after you actually start using an overloaded, overly complicated product you thought you wanted.',
      why:'Feature fatigue is annoying and directly reduces the likelihood of repurchase and customer retention, so understanding it helps marketers avoid a common trap: thinking that a longer feature list always wins the sale and keeps the customer happy long-term.',
      example:'Someone who buys a smartwatch loaded with dozens of functions might find themselves frustrated within weeks because they can\u2019t quickly do the one or two things they actually wanted it for.',
      textbookExample:'University of Maryland researchers found that because "consumers give more weight to capability and less weight to usability before use...than after use," they tend to choose overly complex products that don\u2019t maximize their satisfaction once they actually use them \u2014 resulting in feature fatigue, observed in wearable technology, digital watches, smart glasses, and smartphones.',
      commonMistake:'Students sometimes think feature fatigue happens immediately at purchase. It specifically develops after the purchase, during actual usage \u2014 before the purchase, extra features tend to increase appeal, not decrease it.',
      examQuestion:'According to the featured Marketing Matters box, why do consumers give more weight to a product\u2019s capability before they buy it, but more weight to its usability after they buy it?',
      mnemonic:null },

    { id:'ch9-protocol', term:'Protocol', tier:'must_know', lo:'9.4', chapterId:'ch9', section:'9.4',
      definition:'A statement, developed before product development begins, that identifies a well-defined target market, specific customer needs, wants, and preferences, and what the product will be and do to satisfy them.',
      plain:'A clear, written game plan created before you start building a new product, spelling out exactly who it\u2019s for and what it needs to do for them.',
      why:'Firms that start developing a product without a clear protocol often chase a vague or nonexistent market, which is one of the leading reasons new products fail \u2014 having a protocol forces a company to define success before spending money building the product.',
      example:'Before designing a new backpack, a company might write a protocol stating it\u2019s for daily commuting cyclists who need a laptop compartment, waterproofing, and reflective safety strips.',
      textbookExample:'Kimberly-Clark\u2019s Avert Virucidal tissues, designed with vitamin C derivatives to kill cold and flu germs, failed in test marketing largely because of an incomplete protocol \u2014 the product\u2019s own name, containing the word "cidal," frightened people into associating it with suicide rather than communicating how it would satisfy their needs.',
      commonMistake:'Students sometimes think a protocol is the same as a marketing plan. A protocol is created before product development starts and defines the target market and what the product should do \u2014 it\u2019s the foundation the rest of development builds on, not the finished go-to-market plan.',
      examQuestion:'Explain how Avert Virucidal tissues illustrates the danger of developing a product without a well-defined protocol.',
      mnemonic:null },

    { id:'ch9-new-product-development-process', term:'New-product development process', tier:'must_know', lo:'9.5', chapterId:'ch9', section:'9.5',
      definition:'The seven-stage process \u2014 new-product strategy development, idea generation, screening and evaluation, business analysis, development, market testing, and commercialization \u2014 that organizations use to identify opportunities and convert them into salable products or services.',
      plain:'The full step-by-step pipeline a company follows to turn a raw idea into an actual product on store shelves, with checkpoints along the way to kill weak ideas before they waste more money.',
      why:'Many firms use a formal Stage-Gate process specifically so that if problems can\u2019t be corrected at any given stage, the project doesn\u2019t proceed \u2014 this structured, sequential approach is what increases the chances of new-product success compared to skipping steps.',
      example:'A snack company doesn\u2019t jump straight from an idea to store shelves \u2014 it might first check the idea fits company strategy, generate variations, screen out weak ones, project costs and profits, build a prototype, test it with real shoppers, and only then launch nationally.',
      textbookExample:'Companies such as General Mills and 3M use a specific seven-stage sequence to make new products ready for market, with each stage acting as a checkpoint \u2014 if a stage\u2019s results aren\u2019t successful enough, the project doesn\u2019t proceed to the next one and product development is killed.',
      commonMistake:'Students sometimes think the seven stages must always happen strictly one after another with no flexibility. In practice, the process exists specifically so that a project can be killed at any stage if it\u2019s not working \u2014 that\u2019s the whole point of the Stage-Gate structure.',
      examQuestion:'List the seven stages of the new-product development process in order, and explain the purpose of using a Stage-Gate approach.',
      mnemonic:'Strategy, Ideas, Screen, Analyze, Develop, Test, Commercialize.' },

    { id:'ch9-idea-generation', term:'Idea generation', tier:'must_know', lo:'9.5', chapterId:'ch9', section:'9.5',
      definition:'The second stage of the new-product development process, which involves developing a pool of concepts to serve as candidates for new products.',
      plain:'The brainstorming stage where a company gathers as many raw product concepts as possible, from both inside and outside the company, before narrowing anything down.',
      why:'The goal of idea generation is to move employees from asking "what is?" questions that just describe the current situation, to "what if?" questions that focus on new solutions and marketing actions \u2014 without a strong pool of ideas at this stage, there\u2019s nothing for the rest of the process to refine.',
      example:'A coffee shop might hold a team brainstorming session asking baristas and regular customers, "what if we offered a build-your-own cold brew bar?" to generate new menu ideas.',
      textbookExample:'A custodian at a Frito-Lay manufacturing plant asked himself, "What if I put chili on a Cheeto?" then tinkered with a spicy recipe at home and asked senior Frito-Lay executives to taste it \u2014 the result was Flamin\u2019 Hot Cheetos, one of the company\u2019s best-selling products ever, and the custodian, Richard Montanez, became a company executive vice president.',
      commonMistake:'Students sometimes think idea generation only happens inside a company\u2019s own R&D department. The textbook lists many external sources too \u2014 customers, suppliers, competitors, smaller firms, universities, and individual inventors \u2014 often through open innovation and crowdsourcing.',
      examQuestion:'Using the Flamin\u2019 Hot Cheetos example, explain how a company can generate valuable new-product ideas from unexpected internal sources.',
      mnemonic:null },

    { id:'ch9-business-analysis', term:'Business analysis', tier:'must_know', lo:'9.5', chapterId:'ch9', section:'9.5',
      definition:'The stage of the new-product development process that specifies the features of the product or service and the marketing strategy needed to bring it to market, and makes financial projections.',
      plain:'The stage where a company crunches the numbers to check whether a promising idea is actually worth building \u2014 projecting costs, revenue, and fit with the company\u2019s overall goals before committing real resources.',
      why:'Business analysis is the last checkpoint before significant resources are invested to create a prototype, so it\u2019s the company\u2019s chance to catch a bad idea before spending the money to actually build it.',
      example:'Before building a physical prototype of a new folding bike, a company would first estimate manufacturing costs, likely retail price, projected sales, and whether it might cannibalize sales of its existing bikes.',
      textbookExample:'Some companies now use big data, analytics, and artificial intelligence during the business analysis stage to make sales and profit projections for future products that haven\u2019t even been designed yet \u2014 as an IBM spokesperson put it, "it\u2019s about understanding what sold, why, where, and to whom...with a reasonable amount of accuracy."',
      commonMistake:'Students sometimes confuse business analysis with the earlier screening and evaluation stage. Screening and evaluation is a faster, more preliminary filter for whether an idea is worth pursuing at all; business analysis is a deeper financial and strategic assessment that happens afterward, right before a prototype gets built.',
      examQuestion:'Explain what kinds of questions a business analysis stage answers before a company invests in building a full prototype.',
      mnemonic:null },

    { id:'ch9-commercialization', term:'Commercialization', tier:'must_know', lo:'9.5', chapterId:'ch9', section:'9.5',
      definition:'The stage of the new-product development process that positions and launches a new product in full-scale production and sales.',
      plain:'The final launch stage \u2014 taking a fully tested product and actually rolling it out for real, full-scale sale to the public.',
      why:'Commercialization is the most expensive stage for most new products, and companies can face disasters here even after passing every earlier stage \u2014 so understanding what typically goes wrong at commercialization helps marketers avoid repeating the same mistakes.',
      example:'A local bakery deciding to finally sell its new pastry at all of its locations, after months of only testing it at one store, is entering commercialization.',
      textbookExample:'Boeing invested billions of dollars developing its 787 Dreamliner, promising it would burn 20 percent less fuel and cost 30 percent less to maintain \u2014 but at commercialization, its carbon-fiber wings proved difficult to produce, its new "high-tech skin" failed to dissipate lightning, and lithium-ion batteries caught fire on two aircraft, grounding every Dreamliner in service worldwide.',
      commonMistake:'Students sometimes think a product is safe from failure once it passes market testing and reaches commercialization. The Boeing 787 and Burger King\u2019s Satisfries both show a product can still fail dramatically at the most expensive, final stage \u2014 even after surviving every earlier stage of development.',
      examQuestion:'Using the Boeing 787 Dreamliner example, explain why "innovation can get messy" even at the commercialization stage of new-product development.',
      mnemonic:null },

    { id:'ch9-good', term:'Good', tier:'supporting', lo:'9.1', chapterId:'ch9', section:'9.1',
      definition:'A product with tangible attributes that a consumer\u2019s five senses can perceive, which may also have intangible attributes such as delivery, warranties, or associations with wealth or health.' },
    { id:'ch9-nondurable-good', term:'Nondurable goods', tier:'supporting', lo:'9.1', chapterId:'ch9', section:'9.1',
      definition:'Items consumed in one or a few uses, such as food products and fuel, which typically rely heavily on consumer advertising.' },
    { id:'ch9-durable-good', term:'Durable goods', tier:'supporting', lo:'9.1', chapterId:'ch9', section:'9.1',
      definition:'Items that usually last over many uses, such as appliances, cars, and smartphones, which typically emphasize personal selling.' },
    { id:'ch9-services', term:'Services', tier:'supporting', lo:'9.1', chapterId:'ch9', section:'9.1',
      definition:'Intangible activities or benefits that an organization provides to satisfy consumers\u2019 needs in exchange for money or something else of value.' },
    { id:'ch9-idea', term:'Idea', tier:'supporting', lo:'9.1', chapterId:'ch9', section:'9.1',
      definition:'A thought that leads to a product or action, such as a concept for a new invention or a message encouraging people to get out and vote.' },
    { id:'ch9-convenience-products', term:'Convenience products', tier:'supporting', lo:'9.2', chapterId:'ch9', section:'9.2',
      definition:'Items the consumer purchases frequently, conveniently, and with a minimum of shopping effort.' },
    { id:'ch9-shopping-products', term:'Shopping products', tier:'supporting', lo:'9.2', chapterId:'ch9', section:'9.2',
      definition:'Items for which the consumer compares several alternatives using criteria such as price, quality, or style.' },
    { id:'ch9-specialty-products', term:'Specialty products', tier:'supporting', lo:'9.2', chapterId:'ch9', section:'9.2',
      definition:'Items that the consumer makes a special effort to seek out and buy.' },
    { id:'ch9-unsought-products', term:'Unsought products', tier:'supporting', lo:'9.2', chapterId:'ch9', section:'9.2',
      definition:'Items that the consumer does not know about, or knows about but does not initially want.' },
    { id:'ch9-components', term:'Components', tier:'supporting', lo:'9.2', chapterId:'ch9', section:'9.2',
      definition:'Business products that become part of the final product, including raw materials and assemblies.' },
    { id:'ch9-support-products', term:'Support products', tier:'supporting', lo:'9.2', chapterId:'ch9', section:'9.2',
      definition:'Business products used to assist in producing other products and services, including installations, accessory equipment, supplies, and industrial services.' },
    { id:'ch9-installations', term:'Installations', tier:'supporting', lo:'9.2', chapterId:'ch9', section:'9.2',
      definition:'Support products such as buildings and fixed equipment.' },
    { id:'ch9-accessory-equipment', term:'Accessory equipment', tier:'supporting', lo:'9.2', chapterId:'ch9', section:'9.2',
      definition:'Support products such as tools and office equipment.' },
    { id:'ch9-supplies', term:'Supplies', tier:'supporting', lo:'9.2', chapterId:'ch9', section:'9.2',
      definition:'Support products such as stationery, paper clips, and brooms.' },
    { id:'ch9-industrial-services', term:'Industrial services', tier:'supporting', lo:'9.2', chapterId:'ch9', section:'9.2',
      definition:'Support products such as maintenance, repair, and legal services.' },
    { id:'ch9-gap-analysis', term:'Gap analysis', tier:'supporting', lo:'9.2', chapterId:'ch9', section:'9.2',
      definition:'An analysis of the differences between consumers\u2019 expectations about a service and their actual experience with it, used to evaluate and improve service quality.' },
    { id:'ch9-intangibility', term:'Intangibility', tier:'supporting', lo:'9.2', chapterId:'ch9', section:'9.2',
      definition:'The service quality element referring to the fact that services can\u2019t be touched or seen before the purchase decision, making them harder for consumers to evaluate than tangible goods.' },
    { id:'ch9-inconsistency', term:'Inconsistency', tier:'supporting', lo:'9.2', chapterId:'ch9', section:'9.2',
      definition:'The service quality element referring to the fact that a service\u2019s quality varies depending on the capabilities and day-to-day performance of the person who provides it.' },
    { id:'ch9-inseparability', term:'Inseparability', tier:'supporting', lo:'9.2', chapterId:'ch9', section:'9.2',
      definition:'The service quality element referring to the fact that a consumer cannot distinguish the service provider from the service itself.' },
    { id:'ch9-inventory-services', term:'Inventory', tier:'supporting', lo:'9.2', chapterId:'ch9', section:'9.2',
      definition:'The service quality element referring to the storage, perishability, and movement costs associated with services, related to idle production capacity.' },
    { id:'ch9-idle-production-capacity', term:'Idle production capacity', tier:'supporting', lo:'9.2', chapterId:'ch9', section:'9.2',
      definition:'The situation when a service provider is available but there is no demand for the service.' },
    { id:'ch9-product-class', term:'Product class', tier:'supporting', lo:'9.2', chapterId:'ch9', section:'9.2',
      definition:'The industry or broad category to which a product or service belongs, such as a tablet device.' },
    { id:'ch9-product-form', term:'Product form', tier:'supporting', lo:'9.2', chapterId:'ch9', section:'9.2',
      definition:'The subcategories within a product class that share a unique brand, size, or price.' },
    { id:'ch9-product-item', term:'Product item', tier:'supporting', lo:'9.2', chapterId:'ch9', section:'9.2',
      definition:'A specific product that has a unique brand, size, or price.' },
    { id:'ch9-sku', term:'Stock keeping unit (SKU)', tier:'supporting', lo:'9.2', chapterId:'ch9', section:'9.2',
      definition:'A unique identification number that defines an item for ordering or inventory purposes.' },
    { id:'ch9-product-line', term:'Product line', tier:'supporting', lo:'9.2', chapterId:'ch9', section:'9.2',
      definition:'A group of product or service items that are closely related because they satisfy a class of needs, are used together, are sold to the same customer group, or fall within a given price range.' },
    { id:'ch9-product-mix', term:'Product mix', tier:'supporting', lo:'9.2', chapterId:'ch9', section:'9.2',
      definition:'All of the product lines offered by an organization.' },
    { id:'ch9-dynamically-continuous-innovation', term:'Dynamically continuous innovation', tier:'supporting', lo:'9.3', chapterId:'ch9', section:'9.3',
      definition:'A new product that requires a moderate amount of new learning by consumers, typically involving only minor changes in consumer behavior.' },
    { id:'ch9-product-line-extension', term:'Product line extension', tier:'supporting', lo:'9.3', chapterId:'ch9', section:'9.3',
      definition:'The lowest level of newness and risk in new-product development, involving an incremental improvement of an existing product line.' },
    { id:'ch9-brand-extension', term:'Brand extension', tier:'supporting', lo:'9.3', chapterId:'ch9', section:'9.3',
      definition:'A significant jump in innovation or technology that involves putting an established brand name on a new product in an unfamiliar market.' },
    { id:'ch9-radical-invention', term:'Radical invention', tier:'supporting', lo:'9.3', chapterId:'ch9', section:'9.3',
      definition:'The highest level of new-product innovation, involving a truly revolutionary new product that creates value for the consumer.' },
    { id:'ch9-groupthink', term:'Groupthink', tier:'supporting', lo:'9.4', chapterId:'ch9', section:'9.4',
      definition:'A problem that occurs in new-product planning team meetings when someone suspects a product concept is a bad idea but is afraid to speak up for fear of being cast as a "negative thinker" or "not a team player."' },
    { id:'ch9-closed-innovation', term:'Closed innovation (NIH syndrome)', tier:'supporting', lo:'9.4', chapterId:'ch9', section:'9.4',
      definition:'The conviction that new products and consumer solutions can successfully emerge only from inside the organization, causing good ideas from outside to be rejected simply because of their outside origin \u2014 also called the "not-invented-here" (NIH) problem.' },
    { id:'ch9-open-innovation', term:'Open innovation', tier:'supporting', lo:'9.4', chapterId:'ch9', section:'9.4',
      definition:'Practices that encourage the use of both internal and external ideas and collaboration when conceiving, producing, and marketing new products and services.' },
    { id:'ch9-new-product-vitality-index', term:'New Product Vitality Index', tier:'supporting', lo:'9.4', chapterId:'ch9', section:'9.4',
      definition:'A measure, used by 62 percent of large U.S. companies, that tracks the percentage of total company sales that come from new products each year.',
      formula:'New Product Vitality Index = (Sales from new products in the past 3 years \u00f7 Total current-year sales) \u00d7 100  (20\u201330% is considered "good")' },
    { id:'ch9-new-product-strategy-development', term:'New-product strategy development', tier:'supporting', lo:'9.5', chapterId:'ch9', section:'9.5',
      definition:'The first stage of the new-product development process that defines the role for a new product in terms of the firm\u2019s overall objectives.' },
    { id:'ch9-screening-and-evaluation', term:'Screening and evaluation', tier:'supporting', lo:'9.5', chapterId:'ch9', section:'9.5',
      definition:'The stage of the new-product development process that internally and externally evaluates new-product ideas to eliminate those that warrant no further effort.' },
    { id:'ch9-concept-tests', term:'Concept tests', tier:'supporting', lo:'9.5', chapterId:'ch9', section:'9.5',
      definition:'External evaluations with consumers that consist of preliminary testing of a new-product idea, often using written descriptions, sketches, mockups, or promotional literature, rather than an actual finished product.' },
    { id:'ch9-cem', term:'Customer experience management (CEM)', tier:'supporting', lo:'9.5', chapterId:'ch9', section:'9.5',
      definition:'The process of managing the entire customer experience within a company, ensuring employee interactions with customers are consistently delivered and experienced, clearly differentiated, and relevant to the target market.' },
    { id:'ch9-crowdsourcing', term:'Crowdsourcing', tier:'supporting', lo:'9.5', chapterId:'ch9', section:'9.5',
      definition:'An open-innovation idea-generation method that involves generating insights and actions based on ideas from massive numbers of customers or suppliers.' },
    { id:'ch9-prototype', term:'Prototype', tier:'supporting', lo:'9.5', chapterId:'ch9', section:'9.5',
      definition:'A full-scale operating model of the product or service, built during the development stage to assess whether the new product will actually work and meet the standards established for it.' },
    { id:'ch9-development-stage', term:'Development', tier:'supporting', lo:'9.5', chapterId:'ch9', section:'9.5',
      definition:'The stage of the new-product development process that turns an idea on paper into a demonstrable, producible prototype through manufacturing and testing.' },
    { id:'ch9-market-testing', term:'Market testing', tier:'supporting', lo:'9.5', chapterId:'ch9', section:'9.5',
      definition:'The stage of the new-product development process that involves exposing actual products to prospective consumers under realistic purchase conditions to see if they will buy.' },
    { id:'ch9-test-marketing', term:'Test marketing', tier:'supporting', lo:'9.5', chapterId:'ch9', section:'9.5',
      definition:'Offering a product for sale on a limited basis in a defined geographic area for a specific period of time, to see how well it sells.' },
    { id:'ch9-standard-test-market', term:'Standard test market', tier:'supporting', lo:'9.5', chapterId:'ch9', section:'9.5',
      definition:'A test market in which a company develops a product and attempts to sell it through normal distribution channels in a number of test-market cities, just as it would for any other product.' },
    { id:'ch9-controlled-test-market', term:'Controlled test market', tier:'supporting', lo:'9.5', chapterId:'ch9', section:'9.5',
      definition:'A test market in which the entire test program is contracted to an outside service, which guarantees a specified percentage of a test product\u2019s potential distribution.' },
    { id:'ch9-simulated-test-market', term:'Simulated test market (STM)', tier:'supporting', lo:'9.5', chapterId:'ch9', section:'9.5',
      definition:'A technique that replicates a full-scale test market on a smaller scale, often run in shopping malls, to find consumers who use the product class being tested.' },
    { id:'ch9-regional-rollout', term:'Regional rollout', tier:'supporting', lo:'9.5', chapterId:'ch9', section:'9.5',
      definition:'A commercialization strategy in which a product is introduced sequentially into geographic areas over time, to allow production levels and marketing activities to build up gradually.' },

    { id:'ch1-marketing', term:'Marketing', tier:'must_know', lo:'1.1', chapterId:'ch1', section:'1.1',
      definition:'The activity, set of institutions, and processes for creating, communicating, delivering, and exchanging offerings that have value for customers, clients, partners, and society at large.',
      plain:'The whole process of figuring out what people need and then getting them a good, service, or idea that actually delivers on that need \u2014 not just advertising or selling.',
      why:'Marketing has two objectives: discovering what prospective customers need and want, then satisfying them \u2014 understanding this broad definition keeps you from thinking marketing is just ads or a sales pitch.',
      example:'A local coffee shop researching what flavors its neighborhood actually wants before adding a new drink to the menu, then pricing and promoting it well, is doing marketing \u2014 not just the ad campaign at the end.',
      textbookExample:'Bombas built its entire identity around discovering that socks were the most-requested item at homeless shelters, then designing a genuinely better sock, naming and branding it thoughtfully, and building a marketing program around a "One Purchased = One Donated" mission.',
      commonMistake:'Students often equate marketing with advertising or selling. The American Marketing Association\u2019s definition is much broader \u2014 it includes creating, delivering, and exchanging value, not just communicating about a product.',
      examQuestion:'Explain why Bombas is considered an example of good marketing beyond just its advertising campaigns.',
      mnemonic:null },

    { id:'ch1-exchange', term:'Exchange', tier:'must_know', lo:'1.1', chapterId:'ch1', section:'1.1',
      definition:'The trade of things of value between a buyer and a seller so that each party is better off after the trade than before it.',
      plain:'The actual trade at the heart of every marketing transaction \u2014 you give up money (or something else of value), and you get a product or service back that you value more.',
      why:'Exchange is the tool that makes marketing possible in the first place \u2014 without an actual trade of value, there\u2019s no transaction, no revenue, and no customer relationship to build on.',
      example:'Trading your money for a rideshare trip is an exchange: you value getting to your destination more than you value the cash, and the driver values the cash more than their time and gas.',
      textbookExample:'Ordering a pizza from Domino\u2019s is a straightforward exchange: you hand over $5.99 for a Mix & Match order, and Domino\u2019s hands over food \u2014 both sides are better off, whether the delivery is made by a human driver or Domino\u2019s self-driving robot, Nuro.',
      commonMistake:'Students sometimes think an exchange just means "a sale." The textbook is specific that both parties must be better off after the trade than before it \u2014 that mutual benefit is what defines an exchange, not just money changing hands.',
      examQuestion:'List and explain the four conditions that must exist for an exchange like buying a pizza from Domino\u2019s to actually occur.',
      mnemonic:null },

    { id:'ch1-want', term:'Want', tier:'must_know', lo:'1.2', chapterId:'ch1', section:'1.2',
      definition:'A need that has been shaped by a person\u2019s knowledge, culture, and personality.',
      plain:'The specific way a basic need shows up once your personal experience and preferences get involved \u2014 you don\u2019t just feel "hungry," you crave a specific food.',
      why:'Marketers can\u2019t create needs, which are basic to being human, but they can absolutely shape wants \u2014 by creating awareness of good products at fair prices in convenient locations, marketing turns a generic need into a want for a specific brand.',
      example:'Feeling thirsty is a need; specifically craving a particular brand of sparkling water because you\u2019ve had good experiences with it before is a want.',
      textbookExample:'Feeling hungry is a need, but wanting specifically a Chocolate Chip Clif Bar or a Peanut Butter Banana Clif Bar \u2014 because past experience taught you it satisfies that hunger well \u2014 is a want.',
      commonMistake:'Students often use "need" and "want" interchangeably. The textbook draws a specific distinction: a need is a basic felt deprivation, while a want is that same need after it\u2019s been shaped by personal knowledge, culture, and personality.',
      examQuestion:'Using the Clif Bar example, explain the difference between a consumer\u2019s need and a consumer\u2019s want.',
      mnemonic:null },

    { id:'ch1-marketing-mix', term:'Marketing mix', tier:'must_know', lo:'1.3', chapterId:'ch1', section:'1.3',
      definition:'The combination of four controllable elements \u2014 product, price, promotion, and place, often called the four Ps \u2014 that an organization uses to reach a target market.',
      plain:'The four levers a marketing manager can actually pull and adjust: what you\u2019re selling, what it costs, how you tell people about it, and how they get it.',
      why:'These are the factors a marketing manager directly controls, unlike environmental forces \u2014 building an effective, coordinated combination of all four is the core job of turning a target market into paying customers.',
      example:'A new food truck adjusts its marketing mix by deciding what to put on the menu (product), how much to charge (price), which social media posts to run (promotion), and which neighborhoods to park in (place).',
      textbookExample:'3M built two distinct marketing programs around the same underlying product platform: for college students, it priced the Post-it Flag Highlighter affordably and distributed it through campus bookstores, leaning on word of mouth; for office workers, it developed the companion Post-it Flag Pen at a different price point, distributed through office-supply wholesalers instead.',
      commonMistake:'Students sometimes forget that "place" means the whole set of activities in getting a product to the consumer (distribution), not just a physical store location.',
      examQuestion:'Using the 3M Post-it Flag Highlighter and Post-it Flag Pen example, explain how the same basic product idea led to two different marketing mixes for two different target markets.',
      mnemonic:'The Four Ps: Product, Price, Promotion, Place.' },

    { id:'ch1-target-market', term:'Target market', tier:'must_know', lo:'1.3', chapterId:'ch1', section:'1.3',
      definition:'One or more specific groups of potential consumers toward which an organization directs its marketing program.',
      plain:'The specific group of people or organizations a company has decided to focus its marketing efforts on, instead of trying to sell to literally everyone.',
      why:'No organization can satisfy every possible consumer, so choosing a clear target market is what allows a company to build one coherent marketing mix instead of a watered-down, unfocused one.',
      example:'A boutique fitness studio might target busy young professionals rather than trying to appeal to every possible type of gym-goer at once.',
      textbookExample:'3M identified college students as the target market for its Post-it Flag Highlighter and office workers as the target market for its companion Post-it Flag Pen \u2014 two distinct target markets served with two distinct marketing programs from the same underlying product idea.',
      commonMistake:'Students sometimes think a bigger target market is always better. In reality, an overly broad target market often means a company can\u2019t tailor its marketing mix well enough to truly satisfy any one group\u2019s specific needs.',
      examQuestion:'Why did 3M develop two separate marketing programs, rather than one, for its Post-it Flag Highlighter and Post-it Flag Pen products?',
      mnemonic:null },

    { id:'ch1-customer-value', term:'Customer value', tier:'must_know', lo:'1.4', chapterId:'ch1', section:'1.4',
      definition:'The unique combination of benefits received by targeted buyers that includes quality, convenience, on-time delivery, and both before- and after-sale service, at a specific price.',
      plain:'What a customer actually gets out of a purchase, weighed against what they had to pay \u2014 not just the product itself, but the whole bundle of quality and service around it.',
      why:'Because no single firm can be the best at everything, understanding customer value lets a company deliberately choose which value strategy \u2014 best price, best product, or best service \u2014 to compete on, rather than trying and failing to be the best at all three.',
      example:'A meal-kit service that emphasizes fast delivery, easy-to-follow recipes, and responsive customer support is competing on customer value beyond just the price of the ingredients.',
      textbookExample:'Target competes on best price ("Expect more, pay less"), Starbucks competes on best product ("inspire and nurture the human spirit" one cup at a time), and Nordstrom competes on best service (delivering the best possible shopping experience) \u2014 three different value strategies from three successful companies.',
      commonMistake:'Students often think customer value is only about low price. The textbook explicitly separates it into multiple components \u2014 quality, convenience, timing, and service \u2014 and shows a firm can win by emphasizing any one instead of price.',
      examQuestion:'Explain the three value strategies described in the chapter (best price, best product, best service), using Target, Starbucks, and Nordstrom as examples.',
      mnemonic:null },

    { id:'ch1-relationship-marketing', term:'Relationship marketing', tier:'must_know', lo:'1.4', chapterId:'ch1', section:'1.4',
      definition:'Linking the organization to its individual customers, employees, suppliers, and other partners for their mutual, long-term benefit.',
      plain:'Treating a customer relationship as an ongoing, evolving connection rather than a single one-time transaction \u2014 it starts before the sale and keeps developing after it.',
      why:'Intense competition in fast-paced global markets has made customer loyalty more valuable than ever, and relationship marketing is how firms turn a single satisfied purchase into years of repeat business and referrals.',
      example:'A hair salon that remembers a client\u2019s preferred stylist, past color formulas, and birthday, and reaches out with personalized offers, is practicing relationship marketing rather than just processing appointments.',
      textbookExample:'The Ritz-Carlton trains every employee to notice and record individual guest preferences in a guest recognition system, aiming, in the company\u2019s own words, to "build strong relationships and create Ritz-Carlton guests for life."',
      commonMistake:'Students sometimes think relationship marketing only applies to individual consumers. The definition explicitly includes employees, suppliers, and other partners \u2014 not just end customers.',
      examQuestion:'Explain how information technology and data analytics have made relationship marketing easier for companies like BMW and General Electric to practice at scale.',
      mnemonic:null },

    { id:'ch1-market-orientation', term:'Market orientation', tier:'must_know', lo:'1.5', chapterId:'ch1', section:'1.5',
      definition:'An organization-wide focus on continuously collecting information about customers\u2019 needs, sharing that information across departments, and using it to create customer value.',
      plain:'A company-wide habit of constantly listening to what customers want and making sure that information actually reaches every department, not just marketing.',
      why:'Research indicates that a market orientation has a positive influence on sales and profit in both the short and long run, which is why firms like Amazon, Charles Schwab, and Kaiser Permanente have invested heavily in building this organization-wide habit.',
      example:'A software company that routes customer support complaints directly to its product engineers every week, rather than letting them pile up in a separate department, is practicing market orientation.',
      textbookExample:'Trader Joe\u2019s keeps prices low through private-label products, stocks unusual and affordable items customers can\u2019t find elsewhere, and encourages employees to "engage" directly with shoppers \u2014 helping someone find an item rather than just pointing to "aisle five."',
      commonMistake:'Students sometimes think market orientation just means "doing customer surveys." It specifically requires all three steps together: continuously collecting information, sharing it across departments, and actually using it to create value.',
      examQuestion:'Using Trader Joe\u2019s as an example, explain the three things an organization with a strong market orientation does.',
      mnemonic:null },

    { id:'ch1-crm', term:'Customer relationship management (CRM)', tier:'must_know', lo:'1.5', chapterId:'ch1', section:'1.5',
      definition:'The process of identifying prospective buyers, understanding them intimately, and developing favorable long-term perceptions of the organization so that buyers choose it and become advocates after their purchase.',
      plain:'The company-wide system and process for finding the right customers, really getting to know them, and keeping them happy enough that they keep coming back and tell others.',
      why:'CRM requires the involvement and commitment of managers and employees throughout the entire organization, and it\u2019s increasingly powered by information, communication, and digital technology \u2014 making it central to how modern companies compete.',
      example:'A gym app that tracks a member\u2019s workout history and automatically suggests classes they\u2019re likely to enjoy is using CRM technology to deepen the relationship.',
      textbookExample:'BMW receives usage data transmitted by every new vehicle it sells, and General Electric collects data transmitted by the jet engines it builds \u2014 both using data analytics to understand how customers use their products and when service may be needed.',
      commonMistake:'Students sometimes think CRM is just a software tool. The textbook defines it as a process requiring commitment across the whole organization \u2014 the software is simply one tool that supports it.',
      examQuestion:'Explain how smart, connected products (like BMW\u2019s vehicles or GE\u2019s jet engines) support a company\u2019s customer relationship management efforts.',
      mnemonic:null },

    { id:'ch1-utility', term:'Utility', tier:'must_know', lo:'1.5', chapterId:'ch1', section:'1.5',
      definition:'The benefit or customer value received by users of a product, created through form, place, time, and possession utility.',
      plain:'The different specific ways a product actually delivers value to you \u2014 by existing in the right form, being in the right place, being available at the right time, and being easy to actually get your hands on.',
      why:'Breaking customer benefit down into these four distinct types helps marketers see exactly which part of the value chain they\u2019re improving \u2014 production, distribution, timing, or making purchase easier through things like credit.',
      example:'A 24-hour pharmacy provides time utility by being open when you need medicine at 2 a.m., while a vending machine in your office building provides place utility.',
      textbookExample:'The production of a product or service constitutes form utility; place utility means having the offering available where consumers need it; time utility means having it available when needed; and possession utility is the value of making an item easy to purchase, such as through credit card or financing arrangements.',
      commonMistake:'Students often think utility just means "usefulness" in a vague sense. The textbook defines four specific, distinct types \u2014 form, place, time, and possession \u2014 each created by a different part of the marketing process.',
      examQuestion:'Name the four types of utility and give an example of each using a 24-hour pharmacy.',
      mnemonic:'Form, Place, Time, Possession \u2014 F-P-T-P.' },

    { id:'ch1-environmental-forces', term:'Environmental forces', tier:'supporting', lo:'1.1', chapterId:'ch1', section:'1.1',
      definition:'Largely uncontrollable social, economic, technological, competitive, and regulatory factors that shape an organization\u2019s marketing decisions.' },
    { id:'ch1-market', term:'Market', tier:'supporting', lo:'1.1', chapterId:'ch1', section:'1.1',
      definition:'People who have both the desire and the ability to buy a specific offering.' },
    { id:'ch1-need', term:'Need', tier:'supporting', lo:'1.2', chapterId:'ch1', section:'1.2',
      definition:'A felt state of deprivation regarding basic necessities such as food, clothing, or shelter.' },
    { id:'ch1-market-segments', term:'Market segments', tier:'supporting', lo:'1.3', chapterId:'ch1', section:'1.3',
      definition:'Relatively homogeneous groups of prospective buyers who share common needs and will respond similarly to a marketing action.' },
    { id:'ch1-product', term:'Product', tier:'supporting', lo:'1.3', chapterId:'ch1', section:'1.3',
      definition:'A good, service, or idea consisting of a bundle of tangible and intangible attributes that satisfies consumers\u2019 needs.' },
    { id:'ch1-price', term:'Price', tier:'supporting', lo:'1.3', chapterId:'ch1', section:'1.3',
      definition:'What is exchanged, usually money, for a product.' },
    { id:'ch1-promotion', term:'Promotion', tier:'supporting', lo:'1.3', chapterId:'ch1', section:'1.3',
      definition:'A means of communication between the seller and the buyer.' },
    { id:'ch1-place', term:'Place', tier:'supporting', lo:'1.3', chapterId:'ch1', section:'1.3',
      definition:'The set of activities involved in getting a product to the consumer.' },
    { id:'ch1-marketing-program', term:'Marketing program', tier:'supporting', lo:'1.4', chapterId:'ch1', section:'1.4',
      definition:'A plan that integrates the marketing mix to provide a good, service, or idea to prospective buyers.' },
    { id:'ch1-marketing-concept', term:'Marketing concept', tier:'supporting', lo:'1.5', chapterId:'ch1', section:'1.5',
      definition:'The idea that an organization should try to satisfy the needs of consumers while also achieving its own goals.' },
    { id:'ch1-societal-marketing-concept', term:'Societal marketing concept', tier:'supporting', lo:'1.5', chapterId:'ch1', section:'1.5',
      definition:'The view that organizations should satisfy the needs of consumers in a way that also provides for society\u2019s well-being.' },
    { id:'ch1-social-responsibility', term:'Social responsibility', tier:'supporting', lo:'1.5', chapterId:'ch1', section:'1.5',
      definition:'The idea that organizations are accountable to a larger society, not just to their buyers and shareholders.' },
    { id:'ch1-ethics', term:'Ethics', tier:'supporting', lo:'1.5', chapterId:'ch1', section:'1.5',
      definition:'The moral standards and guidelines that help managers make decisions when the law doesn\u2019t specifically address a situation.' },
    { id:'ch1-ultimate-consumers', term:'Ultimate consumers', tier:'supporting', lo:'1.5', chapterId:'ch1', section:'1.5',
      definition:'People who buy products for their own or their household\u2019s use.' },
    { id:'ch1-organizational-buyers', term:'Organizational buyers', tier:'supporting', lo:'1.5', chapterId:'ch1', section:'1.5',
      definition:'Manufacturers, wholesalers, retailers, nonprofit organizations, and government agencies that buy products for their own use or for resale.' },
    { id:'ch1-customer-experience', term:'Customer experience', tier:'supporting', lo:'1.5', chapterId:'ch1', section:'1.5',
      definition:'The internal response customers have to all direct and indirect contacts with an organization and its offerings.' },

    { id:'ch4-purchase-decision-process', term:'Purchase decision process', tier:'must_know', lo:'4.1', chapterId:'ch4', section:'4.1',
      definition:'The five stages a buyer passes through in making choices about which products and services to buy: problem recognition, information search, alternative evaluation, purchase decision, and postpurchase behavior.',
      plain:'The mental journey someone goes through, from first noticing they need something to deciding whether they\u2019re happy with what they bought.',
      why:'Every stage is a place marketers can win or lose a customer, so understanding the whole path \u2014 not just the moment of sale \u2014 helps marketers show up at the right time with the right message.',
      example:'Noticing your laptop is too slow, asking friends for recommendations, comparing two models online, buying one, then deciding a month later whether you\u2019re happy with it walks through all five stages.',
      textbookExample:'A shopper comparing 5G smartphones scans reviews and a comparison chart (information search and alternative evaluation) before narrowing the field down to two brands based on price, camera quality, and battery life.',
      commonMistake:'Students often think the process ends at the purchase. Postpurchase behavior \u2014 whether the buyer is satisfied and would buy again \u2014 is just as important a stage as the purchase itself.',
      examQuestion:'List the five stages of the consumer purchase decision process in order, and briefly describe what happens at each one.',
      mnemonic:'Please Inform Alice\u2019s Purchase Party (Problem, Information, Alternatives, Purchase, Postpurchase).' },

    { id:'ch4-consideration-set', term:'Consideration set', tier:'must_know', lo:'4.1', chapterId:'ch4', section:'4.1',
      definition:'The group of brands a consumer views as acceptable alternatives, out of all the brands they are aware of in a product class.',
      plain:'The short list of options someone actually seriously considers buying, narrowed down from every brand out there.',
      why:'Getting into a consumer\u2019s consideration set is often the real marketing battle \u2014 if a brand isn\u2019t even being considered, price and quality don\u2019t matter.',
      example:'When choosing a pizza place for dinner, someone might only seriously weigh the two closest, highest-rated options even though a dozen pizzerias exist in town.',
      textbookExample:'A smartphone shopper who cares about price under $500, camera quality, and battery life might end up with just the Google Pixel 7 and the Motorola Moto G Power in their consideration set.',
      commonMistake:'Students sometimes confuse the consideration set with every brand a person has ever heard of. Awareness is broader; the consideration set is the smaller group actually judged acceptable for this purchase.',
      examQuestion:'Explain how evaluative criteria narrow a consumer\u2019s full set of known brands down to a consideration set.',
      mnemonic:null },

    { id:'ch4-cognitive-dissonance', term:'Cognitive dissonance', tier:'must_know', lo:'4.1', chapterId:'ch4', section:'4.1',
      definition:'The postpurchase psychological tension or anxiety a buyer feels, sometimes called buyer\u2019s remorse.',
      plain:'That nagging second-guessing feeling after you buy something, wondering if you picked the wrong option.',
      why:'Marketers actively work to reduce this tension after the sale, because a doubtful customer is more likely to return a product, complain, or avoid the brand next time.',
      example:'After buying a slightly pricier laptop over a cheaper one, someone might feel a twinge of doubt and start reading reviews to reassure themselves they made the right call.',
      textbookExample:'A shopper choosing between the Google Pixel 7 and the Motorola Moto G Power might think "should I have bought the other one?" after purchasing the Pixel 7, then look for favorable reviews to confirm their choice.',
      commonMistake:'Students sometimes think dissonance only happens with bad purchases. It\u2019s actually most common after choosing between two similarly attractive options \u2014 the harder the choice, the more the doubt.',
      examQuestion:'Why do car dealerships often follow up with a phone call or email shortly after a purchase, and what psychological concept does this address?',
      mnemonic:null },

    { id:'ch4-involvement', term:'Involvement', tier:'must_know', lo:'4.2', chapterId:'ch4', section:'4.2',
      definition:'The personal, social, and economic significance of a purchase to the consumer.',
      plain:'How much a purchase actually matters to you \u2014 how much time, money, or personal risk is riding on getting it right.',
      why:'How involved a consumer is determines how much of the five-stage decision process they\u2019ll actually use, which changes what kind of marketing works on them.',
      example:'Choosing a college is high involvement (expensive, long-term, socially significant); choosing a pack of gum is low involvement.',
      textbookExample:'High-involvement purchases are typically expensive, can have serious personal consequences, or could reflect on someone\u2019s social image \u2014 automobiles and audio systems are common examples.',
      commonMistake:'Students sometimes think involvement is about how much someone likes shopping. It\u2019s actually about the purchase\u2019s significance and risk, not the shopper\u2019s personality or enthusiasm.',
      examQuestion:'Explain why involvement level, not just price, determines whether a consumer engages in extended, limited, or routine problem solving.',
      mnemonic:null },

    { id:'ch4-extended-problem-solving', term:'Extended problem solving', tier:'must_know', lo:'4.2', chapterId:'ch4', section:'4.2',
      definition:'A high-involvement decision process that uses all five stages, with many brands and attributes evaluated over considerable time.',
      plain:'The full, careful, time-consuming version of the decision process \u2014 used when the stakes are high.',
      why:'Recognizing when a purchase calls for extended problem solving helps marketers know they need to supply lots of detailed information, since the buyer will be actively searching for it.',
      example:'Choosing a first apartment to rent typically involves visiting several listings, comparing rent and amenities, and asking multiple people for opinions.',
      textbookExample:'Extended problem solving is typical for automobiles and audio systems \u2014 high-involvement purchases where many brands, sellers, and attributes get evaluated over considerable time.',
      commonMistake:'Students sometimes think all expensive purchases are automatically extended problem solving. Repeat buyers of the same expensive brand may actually shift toward routine problem solving once they\u2019ve built brand loyalty.',
      examQuestion:'Contrast extended problem solving with routine problem solving using the same purchase example, such as buying a car for the first time versus leasing the same brand again.',
      mnemonic:null },

    { id:'ch4-motivation', term:'Motivation', tier:'must_know', lo:'4.3', chapterId:'ch4', section:'4.3',
      definition:'The energizing force that stimulates behavior to satisfy a need.',
      plain:'The internal push that gets someone to actually act on a need, whether it\u2019s hunger, safety, status, or self-fulfillment.',
      why:'Marketers design messages around specific needs, using tools like Maslow\u2019s hierarchy, because arousing the right need is often what triggers problem recognition in the first place.',
      example:'A gym ad showing a confident, toned person is designed to arouse a personal need for status and self-respect, not just a physical need for exercise.',
      textbookExample:'A Red Lobster ad featuring a seafood salad targets physiological needs, while the U.S. Army\u2019s "Be All You Can Be" campaign targets self-actualization needs \u2014 both drawing on Maslow\u2019s hierarchy.',
      commonMistake:'Students often think everyone is motivated by the same needs at the same time. Maslow\u2019s hierarchy suggests that once a lower need (like safety) is met, it stops motivating, and a higher-level need takes over.',
      examQuestion:'Using Maslow\u2019s hierarchy of needs, explain which need level a luxury watch brand\u2019s advertising is most likely targeting, and why.',
      mnemonic:'Maslow\u2019s order, bottom to top: Physiological, Safety, Social, Personal, Self-actualization.' },

    { id:'ch4-selective-perception', term:'Selective perception', tier:'must_know', lo:'4.3', chapterId:'ch4', section:'4.3',
