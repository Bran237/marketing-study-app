      summary:'Toro\u2019s small, lightweight snow removal product sold poorly under the name "Snow Pup" because shoppers\u2019 selective comprehension led them to assume it was a toy or too light for real snow removal. Sales increased sharply once the product was renamed "Snow Master."',
      whyItMatters:'It\u2019s the textbook\u2019s clearest example of how selective comprehension can sink a good product for a reason that has nothing to do with the product itself \u2014 just how its name gets interpreted.' },
    { id:'ch4-cs-harley-owners', title:'The Harley Owners Group', lo:'4.4', tier:'must_know', chapterId:'ch4',
      summary:'The Harley Owners Group (HOG), with over 1 million members, is a brand community whose members think of the Harley-Davidson brand name, the motorcycle product category, fellow riders, and the company itself as one connected identity, reinforced through organized group rides and events.',
      whyItMatters:'It shows how a brand can turn a single purchase into an ongoing relationship and identity, rather than a one-time transaction, by building structured community around the brand.' },
    { id:'ch4-cs-goya-vw', title:'Goya Foods and Volkswagen\u2019s Translation Lesson', lo:'4.4', tier:'supporting', chapterId:'ch4',
      summary:'Goya Foods markets different bean and soup recipes to appeal to Puerto Rican consumers on the East Coast versus Mexican consumers in the Southwest, while Volkswagen learned that its "Drivers Wanted" slogan translated into Spanish as "chauffeurs wanted" and had to change it to "Agarra Calle."',
      whyItMatters:'It illustrates that marketing to a subculture takes more than translation \u2014 it requires understanding that the Hispanic/Latino subculture itself is diverse, with different nationalities responding to different products and messages.' },

    { id:'ch5-cs-jcp-media', title:'JCP Media Purchases Publication Paper for JCPenney', lo:'5.1', tier:'must_know', chapterId:'ch5',
      summary:'JCP Media purchasing professionals buy over 100,000 tons of publication paper annually from about 10 suppliers worldwide, including Catalyst Paper Corporation in Canada and Norske Skog in Norway, formally evaluating supplier capabilities \u2014 including forestry-management and sustainability certifications \u2014 to serve JCPenney\u2019s newspaper inserts and direct-mail pieces.',
      whyItMatters:'It\u2019s the chapter\u2019s opening example of organizational buying: a purchase most consumers never think about, made through a rigorous, professional process with major revenue and expense consequences.' },
    { id:'ch5-cs-boeing-pricing', title:'Boeing\u2019s Commercial Jetliner Pricing', lo:'5.2', tier:'supporting', chapterId:'ch5',
      summary:'The Boeing Company charges about $115 million for its "average" 737 commercial jetliner, $373 million for its 777, and $293 million for its 787 \u2014 with orders this large typically requiring purchasing policies that mandate competitive bids and executive-level review and approval.',
      whyItMatters:'It illustrates how the sheer size of an organizational purchase changes who gets involved in the decision and how long it takes to close.' },
    { id:'ch5-cs-machine-vision', title:'Buying Criteria for Machine Vision Equipment', lo:'5.2', tier:'must_know', chapterId:'ch5',
      summary:'Surveyed organizational buyers of machine vision systems ranked performance (80%), technical support (68%), ease of use (67%), ease of setup (63%), and having a complete solution including software (60%) all above price, which only 48% of buyers mentioned as an important selection criterion.',
      whyItMatters:'It\u2019s concrete evidence that price is often not the top organizational buying criterion, contradicting a common assumption about how businesses choose suppliers.' },
    { id:'ch5-cs-earbud-headset', title:'Comparing a Consumer and an Organizational Purchase Process', lo:'5.3', tier:'must_know', chapterId:'ch5',
      summary:'A student replacing a smartphone moves through the five purchase decision stages informally and alone; a manufacturer buying earbud headsets for its own smartphones moves through the same five stages formally, with marketing research and sales teams, design and production engineers, and a purchasing department all involved, and a formal vendor-rating system used in the postpurchase evaluation.',
      whyItMatters:'It directly compares the same five-stage purchase decision process across a consumer and an organizational buyer, showing how much more formalized and multi-person the organizational version becomes.' },
    { id:'ch5-cs-bmw-ibm-newbuy', title:'BMW\u2019s New Buy from IBM', lo:'5.3', tier:'supporting', chapterId:'ch5',
      summary:'BMW\u2019s recent purchase of a multimillion-dollar cloud-based data management system from IBM represents a new buy: many people across the organization were involved, the decision took a long time, and the risk was substantial since BMW had never made this kind of purchase before.',
      whyItMatters:'It contrasts sharply with a straight rebuy, showing how a genuinely unprecedented purchase pulls in a much larger buying center than a routine reorder would.' },
    { id:'ch5-cs-ebay-b2b', title:'eBay Means Business for B2B Entrepreneurs, Too', lo:'5.4', tier:'supporting', chapterId:'ch5',
      summary:'eBay offers a trading platform for 6 million small businesses in the United States engaged in business-to-business marketing; according to an eBay-commissioned survey, 82 percent of small businesses using eBay report it helped their business grow, 78 percent say it reduced costs, and 79 percent say it helped their business become more profitable.',
      whyItMatters:'It shows that online B2B trading platforms aren\u2019t only for giant corporations \u2014 they can meaningfully grow small, entrepreneurial businesses too.' },

    { id:'ch7-cs-movie-titles', title:'Title Testing in Hollywood', lo:'7.1', tier:'must_know', chapterId:'ch7',
      summary:'Studios use marketing research, including title testing, to avoid box-office flops. "A Man Called Ove" became "A Man Called Otto" for U.S. audiences, "Birds of Prey"\u2019s overly complex full title was shortened, "Coldest City" became "Atomic Blonde" to match its star, and "Wind-Up Heroes" became "Toy Story."',
      whyItMatters:'It shows marketing research isn\u2019t just for physical products \u2014 it directly shapes creative decisions like a movie\u2019s title, which studios treat as seriously as a brand name.' },
    { id:'ch7-cs-lego-spike', title:'LEGO Group\u2019s SPIKE Prime Research', lo:'7.2', tier:'must_know', chapterId:'ch7',
      summary:'To decide which of two new SPIKE Prime robotics kit designs to launch, LEGO Group set a research objective (choose the kit that builds a working device fastest), a measure of success (total time to complete a simple trick), and constraints (5 weeks, 10 middle-school teams testing both kits).',
      whyItMatters:'It\u2019s a clean, complete walkthrough of Steps 1 and 2 of the five-step marketing research approach \u2014 defining the problem and building the research plan \u2014 using one real, ongoing product line.' },
    { id:'ch7-cs-nielsen-ratings', title:'Nielsen TV Ratings', lo:'7.4', tier:'must_know', chapterId:'ch7',
      summary:'Nielsen uses portable people meters worn by panelists in about 42,000 U.S. households to measure exactly which programs are being watched, converting results into ratings that determine how much networks can charge for a 30-second ad.',
      whyItMatters:'It shows how a single percentage-point change in a TV rating can shift tens of millions of dollars in advertising revenue, making accurate observational data extremely high-stakes.' },
    { id:'ch7-cs-diapers-beer', title:'The Diapers-and-Beer Discovery', lo:'7.5', tier:'must_know', chapterId:'ch7',
      summary:'By mining checkout scanner data, supermarkets discovered that men buying diapers in the evening often also bought a six-pack of beer. Retailers responded by placing diapers and beer near each other, with potato chips positioned between them, increasing sales of all three items.',
      whyItMatters:'It\u2019s the textbook\u2019s signature example of data mining: an unexpected, non-obvious pattern that no researcher would have thought to test for directly, but that data mining surfaced automatically.' },
    { id:'ch7-cs-tonys-pizza', title:'Tony\u2019s Pizza Sales Dashboard', lo:'7.4', tier:'supporting', chapterId:'ch7',
      summary:'Consultant analysis for Tony\u2019s Pizza found that while total annual sales were flat and the number of pizza-buying households was actually growing, average pizzas purchased per household had fallen from 3.4 to 3.1 since 2020 \u2014 driven mainly by declining consumption in households with children ages 6 to 12.',
      whyItMatters:'It shows how breaking one flat top-line sales number down into more specific dashboards (by household, household size, and children\u2019s age) can reveal the real underlying problem and point to a specific, targetable fix.' },
    { id:'ch7-cs-carmex-metrics', title:'Carmex Social Media Metrics', lo:'7.3', tier:'supporting', chapterId:'ch7',
      summary:'A marketing consultant assessed Carmex\u2019s social media programs using five metrics: conversation velocity, Facebook fans, X followers, share of voice, and sentiment \u2014 finding Carmex\u2019s share of voice at 35 percent (versus ChapStick\u2019s 48 percent) but climbing, and 80 percent of its mentions positive.',
      whyItMatters:'It\u2019s a real worked example of turning newer social-media data sources into specific, numeric marketing metrics that can actually be tracked over time and compared to competitors.' }
  ],

    { id:'ch9-q2', type:'multiple_choice', lo:'9.2', difficulty:'medium', chapterId:'ch9', concept:'ch9-consumer-products',

    { id:'ch9-q8', type:'multiple_choice', lo:'9.4', difficulty:'medium', chapterId:'ch9', concept:'ch9-protocol',

      options:['Involvement','Perceived risk','Selective retention','Reference group influence'],
      correctIndex:1, explanation:'Warranties, seals of approval, and free trials are all strategies companies use to reduce a shopper\u2019s perceived risk before buying.' },
    { id:'ch4-q9', type:'multiple_choice', lo:'4.3', difficulty:'easy', chapterId:'ch4', concept:'ch4-brand-loyalty',
      prompt:'Consistently buying the same brand of shampoo because it has always worked well, without comparing other options, is an example of:',
      options:['Cognitive dissonance','Extended problem solving','Brand loyalty','Selective exposure'],
      correctIndex:2, explanation:'Brand loyalty is a favorable attitude toward and consistent purchase of a single brand over time, often built through positive reinforcement.' },
    { id:'ch4-q10', type:'multiple_choice', lo:'4.4', difficulty:'easy', chapterId:'ch4', concept:'ch4-reference-groups',
      prompt:'People to whom an individual looks as a basis for self-appraisal or personal standards are called a consumer\u2019s:',
      options:['Social class','Reference group','Subculture','Family life cycle'],
      correctIndex:1, explanation:'Reference groups are people used as a basis for self-appraisal or as a source of personal standards.' },
    { id:'ch4-q11', type:'multiple_choice', lo:'4.4', difficulty:'medium', chapterId:'ch4', concept:'ch4-word-of-mouth',
      prompt:'Approximately what percentage of U.S. consumer product sales are directly linked to word-of-mouth activity, according to the chapter?',

      correctIndex:3, explanation:'Roughly 67 percent of U.S. consumer product sales are directly linked to word-of-mouth activity among friends, family, and colleagues.' },
    { id:'ch4-q12', type:'true_false', lo:'4.1', difficulty:'medium', chapterId:'ch4', concept:'ch4-postpurchase-behavior',
      prompt:'True or False: Satisfied buyers typically tell more people about their experience than dissatisfied buyers do.',
      options:['True','False'], correctIndex:1,
      explanation:'False \u2014 dissatisfied buyers tend to tell about 9.4 people (and more online), while satisfied buyers tell only about three others.' },
    { id:'ch4-q13', type:'true_false', lo:'4.4', difficulty:'easy', chapterId:'ch4', concept:'ch4-associative-group',
      prompt:'True or False: An aspiration group is a group that a person actually already belongs to.',
      options:['True','False'], correctIndex:1,
      explanation:'False \u2014 a group a person already belongs to is an associative group. An aspiration group is one a person wishes to join or be identified with.' },
    { id:'ch4-q14', type:'fill_blank', lo:'4.3', difficulty:'medium', chapterId:'ch4', concept:'ch4-vals',
      prompt:'A proprietary methodology that segments U.S. consumers into eight types \u2014 including Thinkers, Achievers, and Experiencers \u2014 based on motivation and resources is called ______.',
      correctAnswer:'VALS', acceptableAnswers:['vals'],
      explanation:'VALS identifies eight consumer segments based on a person\u2019s primary motivation (ideals, achievement, self-expression) and resources.' },
    { id:'ch4-q15', type:'matching', lo:'4.4', difficulty:'hard', chapterId:'ch4', concept:'ch4-reference-groups',
      prompt:'Match each reference group concept to its correct description.',
      pairs:[
        {left:'Associative group', right:'A group a person actually belongs to'},
        {left:'Dissociative group', right:'A group a person wants to distance from'},
        {left:'Aspiration group', right:'A group a person wants to join'},
        {left:'Brand community', right:'A structured group of consumers connected through a shared brand'}
      ],
      explanation:'Reference groups come in several forms: associative (belong to), dissociative (avoid), aspiration (want to join), plus the more structured brand community built around a specific brand.' },
    { id:'ch4-q16', type:'two_truths_trap', lo:'4.2', difficulty:'hard', chapterId:'ch4', concept:'ch4-situational-influences',
      prompt:'Which of these three statements about situational influences is FALSE?',
      options:['Consumers shopping with children along tend to buy about 40 percent more items than they would alone.','Antecedent states include a consumer\u2019s mood and how much cash they have on hand.','Situational influences only matter for high-involvement purchases like cars.'],
      correctIndex:2, explanation:'Situational influences \u2014 purchase task, social and physical surroundings, temporal effects, and antecedent states \u2014 can affect purchases at any involvement level, not just high-involvement ones.' },
    { id:'ch4-q17', type:'scenario', lo:'4.3', difficulty:'exam', chapterId:'ch4', concept:'ch4-selective-perception',
      prompt:'A skincare startup\u2019s product name accidentally makes shoppers think it\u2019s a children\u2019s toy rather than a serious skincare product, and sales are disappointing despite good reviews from those who try it. Which concept best explains this problem?',
      options:['Selective comprehension \u2014 shoppers misinterpret the product based on its name','Perceived risk \u2014 shoppers doubt the product\u2019s safety','Cognitive dissonance \u2014 shoppers regret trying it','Stimulus discrimination \u2014 shoppers can\u2019t tell it apart from competitors'],
      correctIndex:0, explanation:'This mirrors the Toro "Snow Pup" example \u2014 selective comprehension causes shoppers to interpret a product\u2019s name in a way that doesn\u2019t match its real purpose.' },

    { id:'ch5-q3', type:'multiple_choice', lo:'5.1', difficulty:'easy', chapterId:'ch5', concept:'ch5-naics',

    { id:'ch5-q4', type:'multiple_choice', lo:'5.2', difficulty:'medium', chapterId:'ch5', concept:'ch5-derived-demand',
      prompt:'Whirlpool buying parts for washers and dryers based on anticipated future consumer demand for those appliances is an example of:',

    { id:'ch5-q5', type:'multiple_choice', lo:'5.2', difficulty:'hard', chapterId:'ch5', concept:'ch5-organizational-buying-criteria',

    { id:'ch5-q7', type:'multiple_choice', lo:'5.3', difficulty:'easy', chapterId:'ch5', concept:'ch5-buying-center',

      correctIndex:0, explanation:'The buying center is the group of individuals who participate in and influence an organizational purchase decision.' },
    { id:'ch5-q8', type:'multiple_choice', lo:'5.3', difficulty:'medium', chapterId:'ch5', concept:'ch5-gatekeepers',
      prompt:'Which buying center role is responsible for controlling the flow of information to other members of the group?',
      options:['Users','Deciders','Gatekeepers','Influencers'],
      correctIndex:2, explanation:'Gatekeepers control the flow of information in the buying center and can keep salespeople or information from reaching the people performing the other roles.' },
    { id:'ch5-q9', type:'multiple_choice', lo:'5.3', difficulty:'medium', chapterId:'ch5', concept:'ch5-new-buy',

    { id:'ch7-q1', type:'multiple_choice', lo:'7.1', difficulty:'easy', chapterId:'ch7', concept:'ch7-marketing-research',
      prompt:'What is the primary purpose of conducting marketing research, according to the chapter?',

      correctIndex:1, explanation:'Marketing research doesn\u2019t guarantee correct decisions \u2014 it reduces the risk of making a bad one by grounding decisions in systematically collected and analyzed information.' },

      prompt:'Which of the following best describes the purpose of the five-step marketing research approach?',

  loProse: {
    '9.1': [
      { heading:'A Look at Goods, Services, and Ideas', html:'<p>The essence of marketing is developing products and services to meet buyer needs. A <span class="term">product</span> is a good, service, or idea consisting of a bundle of tangible and intangible attributes that satisfies consumers\u2019 needs and is received in exchange for money or something else of value.</p><p>A <span class="term">good</span> has tangible attributes that a consumer\u2019s five senses can perceive; a good may also have intangible attributes such as its delivery or warranties, or embody abstract concepts such as becoming healthier or wealthier. Goods can also be divided into <span class="term">nondurable goods</span>, items consumed in one or a few uses such as food products or fuel, and <span class="term">durable goods</span>, items that usually last over many uses, such as appliances, cars, and smartphones. This classification also guides marketing actions: nondurable goods like gum rely heavily on consumer advertising, while costly durable goods like cars generally emphasize personal selling.</p><p><span class="term">Services</span> are intangible activities or benefits that an organization provides to satisfy consumers\u2019 needs in exchange for money or something else of value, and they have become a significant part of the U.S. economy \u2014 Apple\u2019s iPhone is a good, while Verizon\u2019s wireless network service is a service that often augments that good.</p>' },
      { heading:'Throughout This Book: What "Product" Really Means', html:'<p>Finally, in marketing, an <span class="term">idea</span> is a thought that leads to a product or action, such as a concept for a new invention or a message encouraging people to get out and vote. Throughout this book, product generally includes not only physical goods but services and ideas as well; when "product" is used in its narrower meaning of "goods," that should be clear from the example or sentence.</p>' }
    ],

    '9.2': [
      { heading:'Classifying Consumer Products', html:'<p>Two broad categories of products relate to the type of user: <span class="term">consumer products</span> are products purchased by the ultimate consumer, whereas <span class="term">business products</span> (also called B2B products or industrial products) are products organizations buy that assist in providing other products for resale. Some products, like an Apple iMac, can be considered both, depending on whether they\u2019re bought for personal use or for a business office.</p><p>The four types of consumer products differ in terms of the effort the consumer spends on the decision, the attributes used in making the purchase decision, and the frequency of purchase. <span class="term">Convenience products</span> are items the consumer purchases frequently, conveniently, and with a minimum of shopping effort. <span class="term">Shopping products</span> are items for which the consumer compares several alternatives on criteria such as price, quality, or style. <span class="term">Specialty products</span> are items the consumer makes a special effort to seek out and buy. <span class="term">Unsought products</span> are items the consumer does not know about or knows about but does not initially want.</p><table class="data-table"><tr><th>Basis of comparison</th><th>Convenience</th><th>Shopping</th><th>Specialty</th><th>Unsought</th></tr><tr><td>Product</td><td>Toothpaste, cake mix, hand soap</td><td>Cameras, TVs, briefcases</td><td>Rolls-Royce cars, Rolex watches</td><td>Burial insurance, thesaurus</td></tr><tr><td>Price</td><td>Relatively inexpensive</td><td>Fairly expensive</td><td>Usually very expensive</td><td>Varies</td></tr><tr><td>Place (distribution)</td><td>Widespread; many outlets</td><td>Large number of selective outlets</td><td>Very limited</td><td>Often limited</td></tr><tr><td>Promotion</td><td>Price, availability, awareness stressed</td><td>Differentiation from competitors stressed</td><td>Uniqueness of brand and status stressed</td><td>Awareness is essential</td></tr><tr><td>Brand loyalty</td><td>Aware of brand but accept substitutes</td><td>Prefer specific brands but will accept substitutes</td><td>Very brand loyal; will not accept substitutes</td><td>Will accept substitutes</td></tr></table><div class="chart-caption">Recreated from Figure 9-1: how a consumer product is classified significantly affects which products consumers buy and the marketing strategies used.</div>' },
      { heading:'Classifying Business Products', html:'<p>A major characteristic of business products is that their sales often result from <span class="term">derived demand</span> \u2014 sales of business products frequently result from, or are derived from, the sale of consumer products. As consumer demand for Toyota cars increases, Toyota may increase its demand for paint spraying equipment.</p><p>Business products may be classified as <span class="term">components</span>, items that become part of the final product, including raw materials and assemblies, or as <span class="term">support products</span>, items used to assist in producing other products and services. Support products include <span class="term">installations</span> (buildings and fixed equipment), <span class="term">accessory equipment</span> (tools and office equipment), <span class="term">supplies</span> (stationery, paper clips, brooms), and <span class="term">industrial services</span> (maintenance, repair, and legal services). Strategies to market business products reflect both the complexity of the product involved (paper clips versus private jets) and the buy-class situations discussed in the organizational buying chapter.</p>' },
      { heading:'Classifying Services: People or Equipment', html:'<p>Services can be classified according to whether they are delivered by people or equipment, by business firms or nonprofit organizations, or by government agencies. Organizations in each category often use significantly different marketing mix strategies to promote their services.</p><div class="chart-box"><svg viewBox="0 0 1000 360" xmlns="http://www.w3.org/2000/svg"><g font-family="Public Sans, sans-serif" font-size="10"><rect x="420" y="10" width="140" height="44" rx="8" fill="#e2685f" opacity="0.85"/><text x="490" y="37" text-anchor="middle" fill="#1a0605" font-weight="700">Services</text><rect x="150" y="90" width="180" height="44" rx="8" fill="#5b8def" opacity="0.85"/><text x="240" y="117" text-anchor="middle" fill="#04070d" font-weight="700">Equipment-based</text><rect x="650" y="90" width="180" height="44" rx="8" fill="#cf6fb4" opacity="0.85"/><text x="740" y="117" text-anchor="middle" fill="#04070d" font-weight="700">People-based</text><rect x="20" y="170" width="150" height="80" rx="8" fill="#1c212a" stroke="#5b8def"/><text x="95" y="188" text-anchor="middle" fill="#f3ede2" font-weight="700">Automated</text><text x="95" y="204" text-anchor="middle" fill="#98a2b3" font-size="9">ATMs, online</text><text x="95" y="217" text-anchor="middle" fill="#98a2b3" font-size="9">brokerages,</text><text x="95" y="230" text-anchor="middle" fill="#98a2b3" font-size="9">car washes</text><rect x="185" y="170" width="150" height="80" rx="8" fill="#1c212a" stroke="#5b8def"/><text x="260" y="188" text-anchor="middle" fill="#f3ede2" font-weight="700" font-size="9">Unskilled operators</text><text x="260" y="204" text-anchor="middle" fill="#98a2b3" font-size="9">Movie theaters,</text><text x="260" y="217" text-anchor="middle" fill="#98a2b3" font-size="9">dry cleaners,</text><text x="260" y="230" text-anchor="middle" fill="#98a2b3" font-size="9">taxis</text><rect x="350" y="170" width="150" height="80" rx="8" fill="#1c212a" stroke="#5b8def"/><text x="425" y="188" text-anchor="middle" fill="#f3ede2" font-weight="700" font-size="9">Skilled operators</text><text x="425" y="204" text-anchor="middle" fill="#98a2b3" font-size="9">Utilities, airlines,</text><text x="425" y="217" text-anchor="middle" fill="#98a2b3" font-size="9">computer</text><text x="425" y="230" text-anchor="middle" fill="#98a2b3" font-size="9">networks</text><rect x="520" y="170" width="150" height="80" rx="8" fill="#1c212a" stroke="#cf6fb4"/><text x="595" y="188" text-anchor="middle" fill="#f3ede2" font-weight="700" font-size="9">Unskilled labor</text><text x="595" y="204" text-anchor="middle" fill="#98a2b3" font-size="9">Lawn care,</text><text x="595" y="217" text-anchor="middle" fill="#98a2b3" font-size="9">security guards,</text><text x="595" y="230" text-anchor="middle" fill="#98a2b3" font-size="9">janitorial</text><rect x="685" y="170" width="150" height="80" rx="8" fill="#1c212a" stroke="#cf6fb4"/><text x="760" y="188" text-anchor="middle" fill="#f3ede2" font-weight="700" font-size="9">Skilled labor</text><text x="760" y="204" text-anchor="middle" fill="#98a2b3" font-size="9">Appliance repair,</text><text x="760" y="217" text-anchor="middle" fill="#98a2b3" font-size="9">plumbers,</text><text x="760" y="230" text-anchor="middle" fill="#98a2b3" font-size="9">caterers</text><rect x="850" y="170" width="150" height="80" rx="8" fill="#1c212a" stroke="#cf6fb4"/><text x="925" y="188" text-anchor="middle" fill="#f3ede2" font-weight="700" font-size="9">Professionals</text><text x="925" y="204" text-anchor="middle" fill="#98a2b3" font-size="9">Consultants,</text><text x="925" y="217" text-anchor="middle" fill="#98a2b3" font-size="9">accountants,</text><text x="925" y="230" text-anchor="middle" fill="#98a2b3" font-size="9">lawyers</text><line x1="490" y1="54" x2="240" y2="88" stroke="#98a2b3" stroke-width="1.5"/><line x1="490" y1="54" x2="740" y2="88" stroke="#98a2b3" stroke-width="1.5"/><line x1="240" y1="134" x2="95" y2="168" stroke="#98a2b3" stroke-width="1.5"/><line x1="240" y1="134" x2="260" y2="168" stroke="#98a2b3" stroke-width="1.5"/><line x1="240" y1="134" x2="425" y2="168" stroke="#98a2b3" stroke-width="1.5"/><line x1="740" y1="134" x2="595" y2="168" stroke="#98a2b3" stroke-width="1.5"/><line x1="740" y1="134" x2="760" y2="168" stroke="#98a2b3" stroke-width="1.5"/><line x1="740" y1="134" x2="925" y2="168" stroke="#98a2b3" stroke-width="1.5"/></g></svg><div class="chart-caption">Recreated from Figure 9-2: services can be classified as equipment-based or people-based.</div></div><p>Equipment-based services do not have the marketing concern of inconsistent quality, because employees generally do not have direct contact when the service is delivered automatically \u2014 think self-checkout at American Airlines or Schwab\u2019s online stock trading platform.</p>' },
      { heading:'The Uniqueness of Services: The Four I\u2019s', html:'<p>Four unique elements distinguish services from goods, sometimes called the four I\u2019s of services. <span class="term">Intangibility</span> means services can\u2019t be touched or seen before the purchase decision, making it much harder for consumers to evaluate a service than to compare tangible products. <span class="term">Inconsistency</span> means a service\u2019s quality varies with each provider\u2019s capabilities and day-to-day job performance. <span class="term">Inseparability</span> means the consumer cannot distinguish the service provider from the service itself \u2014 if you don\u2019t get your questions answered or receive adequate library assistance, you may not separate that from your perception of the entire educational experience. <span class="term">Inventory</span> refers to the storage, perishability, and movement costs tied to services, related to <span class="term">idle production capacity</span>, when a service provider is available but there is no demand.</p><p>Once a consumer tries a service, how is it evaluated? Primarily through <span class="term">gap analysis</span>, comparing expectations about a service to the actual experience. The Detroit Institute of Arts used direct observation and interviews to discover visitors were confused by its gallery panels, so it moved panels closer to the art, cut the maximum word count from 250 to 150, and improved readability with bullet points and graphics \u2014 significantly increasing how many visitors actually read the panels.</p>' },
      { heading:'Product Classes, Forms, Items, Lines, and Mixes', html:'<p>Products can be categorized by their <span class="term">product class</span>, the industry to which they belong, like a tablet device, and further by <span class="term">product form</span>, subcategories within a class that share a unique brand, size, or price. A <span class="term">product item</span> is a specific product with a unique brand, size, or price, and each different item represents a separate <span class="term">stock keeping unit (SKU)</span>, a unique identification number used for ordering or inventory.</p><p>A <span class="term">product line</span> is a group of product or service items closely related because they satisfy a class of needs, are used together, are sold to the same customer group, or fall within a given price range. Many firms offer a <span class="term">product mix</span>, which consists of all the product lines an organization offers.</p><div class="example"><span class="ex-label">Textbook example</span>The Crapola! granola product line \u2014 started as a joke by owners Brian and Andrea Strom combining CRanberry and APple granOLA \u2014 has been extended into flavors like "Number Two" and "Colon-ial Times," sold at Walmart and online, letting the company gain retail efficiencies by offering more items through fewer suppliers.</div>' }
    ],

    '9.3': [
      { heading:'Newness Compared with Existing Products', html:'<p>The term new is difficult to define \u2014 was the Sony PlayStation 5 new when the PlayStation 4 already existed? A second way to define newness is in terms of its effects on consumption, classifying new products by the degree of learning required by the consumer.</p><table class="data-table"><tr><th></th><th>Continuous innovation</th><th>Dynamically continuous innovation</th><th>Discontinuous innovation</th></tr><tr><td>Definition</td><td>Requires no new learning by consumers</td><td>Disrupts normal routine but not total new learning</td><td>Requires new consumption patterns by consumers</td></tr><tr><td>Examples</td><td>New improved shower gel, detergent, toothpaste</td><td>Electric toothbrush, LED HDTV, smartphone</td><td>Wireless router, digital video recorder, electric car</td></tr><tr><td>Marketing strategy</td><td>Gain consumer awareness and wide distribution</td><td>Advertise points of difference and benefits</td><td>Educate consumers through product trial and personal selling</td></tr></table><div class="chart-caption">Recreated from Figure 9-3: the degree of "newness" in a new product affects the amount of learning effort consumers must exert, and the resulting marketing strategy.</div><p>With a <span class="term">continuous innovation</span>, consumers don\u2019t need to learn new behaviors. With a <span class="term">dynamically continuous innovation</span>, only minor changes in behavior are required \u2014 Procter &amp; Gamble\u2019s Swiffer WetJet eliminated the need to learn substantial new behavior, but did educate consumers on its benefits, generating over a billion dollars in annual sales. A <span class="term">discontinuous innovation</span> involves making the consumer learn entirely new consumption patterns, such as buying a "smart home" system that controls security, heating, and lighting.</p>' },
      { heading:'Newness in Legal Terms', html:'<p>The U.S. Federal Trade Commission advises that the term new be limited to use with a product for up to six months after it enters regular distribution. The difficulty with this suggestion lies in interpreting the term "regular distribution."</p>' },
      { heading:'Newness from the Organization\u2019s Perspective', html:'<p>Successful organizations view newness and innovation in their products at three levels. The lowest level, usually involving the least risk, is a <span class="term">product line extension</span>, an incremental improvement of an existing product line \u2014 Purina adding its "new" Elegant Medleys restaurant-inspired cat food to its existing Fancy Feast line has the potential benefit of new customers, but the twin dangers of increasing expense and cannibalizing existing products.</p><p>At the next level is either a significant jump in innovation or technology, or a <span class="term">brand extension</span>, putting an established brand name on a new product in an unfamiliar market \u2014 Colgate put its brand name on a line of frozen dinners called Colgate Kitchen Entrees, and the product died quickly, since the Colgate name, strongly linked to toothpaste, did not exactly get shoppers\u2019 "taste buds tingling."</p><p>The third and highest level of innovation is a <span class="term">radical invention</span>, a truly revolutionary new product that creates value for the consumer \u2014 the 3D printer, invented and commercialized by Chuck Hull, founder of 3D Systems, is an example.</p>' }
    ],

    '9.4': [
      { heading:'Too Much of a Good Thing: Feature Bloat and Feature Fatigue', html:'<p>Adding more features to satisfy more consumers seems like a no-brainer strategy for success \u2014 but most marketing research shows that while buyers say they want more features, they are actually overwhelmed by the mind-boggling complexity, or <span class="term">feature bloat</span>, of some new products. The addition of each feature lets developers claim a new product, and rightly so \u2014 today\u2019s smartphones function as a phone, game console, calculator, camera, MP3 player, and GPS system all at once.</p><div class="chart-box"><svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg"><g font-family="Public Sans, sans-serif" font-size="10"><line x1="60" y1="220" x2="600" y2="220" stroke="#5f6774"/><line x1="60" y1="220" x2="60" y2="20" stroke="#5f6774"/><text x="20" y="120" fill="#98a2b3" transform="rotate(-90 20 120)">Consumer satisfaction</text><text x="330" y="245" text-anchor="middle" fill="#98a2b3">Number of features</text><text x="60" y="235" fill="#98a2b3" font-size="9">Few</text><text x="580" y="235" text-anchor="middle" fill="#98a2b3" font-size="9">Many</text><path d="M60,190 C150,60 280,30 340,35 C420,42 520,110 600,195" fill="none" stroke="#e0964f" stroke-width="2.5"/><circle cx="340" cy="35" r="4" fill="#f3ede2"/><text x="340" y="20" text-anchor="middle" fill="#f3ede2" font-size="9">Bloat tipping point to fatigue</text><text x="130" y="150" fill="#98a2b3" font-size="8">"Just what I needed!"</text><text x="300" y="55" fill="#98a2b3" font-size="8">"Awesome!"</text><text x="420" y="75" fill="#98a2b3" font-size="8">"OK, but no big deal."</text><text x="480" y="150" fill="#98a2b3" font-size="8">"Whoa, I\u2019m overwhelmed."</text><text x="500" y="195" fill="#98a2b3" font-size="8">"Now I can\u2019t even do the one thing"</text></g></svg><div class="chart-caption">Recreated from the Marketing Matters box: the feature bloat to feature fatigue trajectory, from a consumer\u2019s point of view.</div></div><p>University of Maryland researchers found that because "consumers give more weight to capability and less weight to usability before use (of the product) than after use (of the product)," they tend to choose overly complex products that don\u2019t maximize their satisfaction when they actually use them, resulting in <span class="term">feature fatigue</span> \u2014 observed in wearable technology, digital watches, smart glasses, and smartphones, and linked to reduced repurchase and customer retention.</p>' },
      { heading:'Why Products and Services Succeed or Fail', html:'<p>Ideally, a new product needs a precise <span class="term">protocol</span> \u2014 a statement, developed before product development begins, that identifies a well-defined target market, specific customer needs and preferences, and what the product will be and do to satisfy them. Research reveals it\u2019s difficult to produce a single commercially successful new product: fewer than 3 percent of new consumer packaged goods exceed first-year sales of $50 million, a common benchmark for a successful launch.</p><p>Marketing and nonmarketing factors both contribute to new-product failures. An insignificant point of difference doomed General Mills\u2019 Fingos cereal flakes despite a $34 million budget; an incomplete protocol sank Kimberly-Clark\u2019s Avert Virucidal tissues, whose name frightened people into thinking of suicide; and a failure to satisfy customer needs on critical factors killed Keurig\u2019s Kold soda maker, which tasted great but was too large, too slow, and too expensive at $370 plus $1.25 per drink. Other classic failure reasons include bad timing (HP\u2019s TouchPad launched a generation behind the iPad 2), no economical access to buyers (Thirsty Dog! bottled water couldn\u2019t earn shelf space among 60,000 supermarket SKUs), poor execution of the marketing mix (Garlic Cake\u2019s confusing positioning), too little market attractiveness (a niche "Monster in My Room" spray), and poor product quality (self-balancing hoverboards that caught fire).</p>' },
      { heading:'Organizational Inertia: Groupthink and the NIH Problem', html:'<p>Organizational problems and attitudes can also cause new-product disasters. <span class="term">Groupthink</span> occurs in new-product planning meetings when someone suspects a concept is a bad idea but is afraid to speak up for fear of being cast as a "negative thinker" or "not a team player." A related problem, <span class="term">closed innovation</span> or the "not-invented-here" (NIH) problem, is based on the conviction that new products can successfully emerge only from inside the organization, causing good outside ideas to be rejected simply because of where they came from.</p><p><span class="term">Open innovation</span> instead consists of practices that encourage the use of both internal and external ideas and collaboration when conceiving, producing, and marketing new products. PepsiCo formed a group called "The Hive," a small entrepreneurial agile group including talent from both inside and outside the company, to identify new-product concepts that would otherwise be overlooked.</p>' },
      { heading:'Tracking New-Product Performance', html:'<p>Marketers monitor the impact of their new products on company sales to gauge the effectiveness of their new-product development effort. One measure, used by 62 percent of large U.S. companies, is the <span class="term">New Product Vitality Index</span>, which tracks the percentage of total company sales that come from new products each year.</p><div class="formula"><span class="f-label">Formula</span>New Product Vitality Index = (Company sales revenues due to new products released in the past three years \u00f7 Total current-year company sales revenue) \u00d7 100. An index between 20 and 30 percent is considered "good."</div><p>Most companies use a three-year period to define a "new" product; after three years, a product\u2019s sales are dropped from the calculation and more recent new-product sales replace them.</p>' }
    ],

    '9.5': [
      { heading:'Seven Stages, One Goal', html:'<p>To develop new products efficiently, companies such as General Mills and 3M use a specific sequence of steps to make their products ready for market. Many firms use a formal Stage-Gate process to evaluate whether the results at each stage are successful enough to warrant proceeding to the next stage; if problems can\u2019t be corrected, the project doesn\u2019t proceed and product development is killed.</p><div class="chart-box"><svg viewBox="0 0 940 260" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow9a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#98a2b3"/></marker></defs><g font-family="Public Sans, sans-serif" font-size="10"><rect x="20" y="20" width="200" height="70" rx="8" fill="#e0964f" opacity="0.85"/><text x="120" y="50" text-anchor="middle" fill="#04070d" font-weight="700" font-size="9">1. New-product</text><text x="120" y="64" text-anchor="middle" fill="#04070d" font-weight="700" font-size="9">strategy development</text><rect x="255" y="20" width="200" height="70" rx="8" fill="#cf6fb4" opacity="0.85"/><text x="355" y="60" text-anchor="middle" fill="#04070d" font-weight="700" font-size="10">2. Idea generation</text><rect x="490" y="20" width="200" height="70" rx="8" fill="#5b8def" opacity="0.85"/><text x="590" y="50" text-anchor="middle" fill="#04070d" font-weight="700" font-size="9">3. Screening &amp;</text><text x="590" y="64" text-anchor="middle" fill="#04070d" font-weight="700" font-size="9">evaluation</text><rect x="725" y="20" width="200" height="70" rx="8" fill="#4fbf94" opacity="0.85"/><text x="825" y="60" text-anchor="middle" fill="#04070d" font-weight="700" font-size="10">4. Business analysis</text><rect x="725" y="160" width="200" height="70" rx="8" fill="#d3c24a" opacity="0.85"/><text x="825" y="200" text-anchor="middle" fill="#04070d" font-weight="700" font-size="10">5. Development</text><rect x="490" y="160" width="200" height="70" rx="8" fill="#e0964f" opacity="0.85"/><text x="590" y="200" text-anchor="middle" fill="#04070d" font-weight="700" font-size="10">6. Market testing</text><rect x="255" y="160" width="200" height="70" rx="8" fill="#cf6fb4" opacity="0.85"/><text x="355" y="200" text-anchor="middle" fill="#04070d" font-weight="700" font-size="10">7. Commercialization</text><line x1="220" y1="55" x2="253" y2="55" stroke="#98a2b3" stroke-width="2" marker-end="url(#arrow9a)"/><line x1="455" y1="55" x2="488" y2="55" stroke="#98a2b3" stroke-width="2" marker-end="url(#arrow9a)"/><line x1="690" y1="55" x2="723" y2="55" stroke="#98a2b3" stroke-width="2" marker-end="url(#arrow9a)"/><path d="M825,90 L825,158" fill="none" stroke="#98a2b3" stroke-width="2" marker-end="url(#arrow9a)"/><line x1="723" y1="195" x2="692" y2="195" stroke="#98a2b3" stroke-width="2" marker-end="url(#arrow9a)"/><line x1="488" y1="195" x2="457" y2="195" stroke="#98a2b3" stroke-width="2" marker-end="url(#arrow9a)"/></g></svg><div class="chart-caption">Recreated from Figure 9-4: carefully using the seven stages in the new-product development process increases the chances of new-product success.</div></div>' },
      { heading:'Stage 1 &amp; 2: Strategy and Idea Generation', html:'<p><span class="term">New-product strategy development</span> defines the role for a new product in terms of the firm\u2019s overall objectives, using both a SWOT analysis and environmental scanning to assess strengths and weaknesses relative to opportunities and threats. Apple\u2019s new-product strategy reflects a closed innovation protocol, while PepsiCo\u2019s reflects an open innovation protocol through "The Hive."</p><p><span class="term">Idea generation</span>, the second stage, involves developing a pool of concepts to serve as candidates for new products. Ideas come from customer and supplier suggestions, a firm\u2019s own research and development laboratories, professional outside R&amp;D and innovation firms that use "design thinking" like IDEO, analysis of competitive products, and smaller firms, universities, and individual inventors. <span class="term">Crowdsourcing</span> is another creative idea-generation method, generating insights from ideas submitted by massive numbers of customers or suppliers \u2014 Dell Technologies used crowdsourcing to generate 13,464 new-product ideas, of which 402 were implemented.</p>' },
      { heading:'Stage 3: Screening and Evaluation', html:'<p><span class="term">Screening and evaluation</span> internally and externally evaluates new-product ideas to eliminate those that warrant no further effort. Internally, a firm\u2019s employees evaluate the technical feasibility of a proposed idea; organizations that develop service-dominated offerings also need <span class="term">customer experience management (CEM)</span>, the process of managing the entire customer experience so interactions are consistently delivered, differentiated, and relevant to the target market.</p><p>Externally, firms use <span class="term">concept tests</span>, evaluations with consumers that use written descriptions, sketches, mockups, or promotional literature rather than an actual finished product. Google Glass\u2019s incomplete concept testing meant Google never fully understood how consumers would perceive the device before it was released to 8,000 "Glass Explorers" \u2014 wearers were soon derided as "Glassholes" and banned from clubs and theaters over privacy concerns.</p>' },
      { heading:'Stages 4\u20137: Business Analysis Through Commercialization', html:'<p><span class="term">Business analysis</span> specifies the product\u2019s features and marketing strategy and makes financial projections \u2014 the last checkpoint before significant resources are invested to create a <span class="term">prototype</span>, a full-scale operating model of the product. The <span class="term">development</span> stage turns the idea on paper into a demonstrable, producible product; Apple tested and rejected over 25 prototypes of its computer mouse before settling on the one used today.</p><p><span class="term">Market testing</span> exposes actual products to prospective consumers under realistic purchase conditions to see if they will buy, often through <span class="term">test marketing</span> \u2014 offering a product for sale on a limited basis in a defined area for a specific time. A <span class="term">standard test market</span> sells the product through normal distribution channels in test-market cities; a <span class="term">controlled test market</span> contracts the entire test program to an outside service that guarantees shelf space; a <span class="term">simulated test market (STM)</span> replicates a test market on a smaller scale, often in a shopping mall.</p><p>Finally, <span class="term">commercialization</span> positions and launches the new product in full-scale production and sales, sometimes through a <span class="term">regional rollout</span> that introduces the product sequentially into geographic areas. Even at this final, most expensive stage, disaster can strike: the Boeing 787 Dreamliner\u2019s lithium-ion batteries caught fire on two aircraft, grounding the fleet worldwide, and Burger King discontinued its Satisfries after failing to communicate a meaningful point of difference to customers.</p>' }
    ],

    '1.1': [
      { heading:'Marketing Is More Than Advertising', html:'<p>The American Marketing Association defines <span class="term">marketing</span> as the activity, set of institutions, and processes for creating, communicating, delivering, and exchanging offerings that have value for customers, clients, partners, and society at large. This is far broader than just running ads or making a sale \u2014 it\u2019s about genuinely delivering value, meant to reach not just the buyer but the organization\u2019s partners and society too. To serve both buyers and sellers, marketing has two objectives: discovering the needs and wants of prospective customers, and then satisfying them. The tool that makes this possible is <span class="term">exchange</span> \u2014 the trade of things of value between a buyer and a seller so that each person is better off after the trade than before it.</p>' },
      { heading:'A Web of Relationships, Not a Solo Act', html:'<p>A marketing department never operates in isolation. Inside the organization, it works alongside research and development, human resources, manufacturing, information technology, and finance, all coordinated by senior management. Outside the organization, marketing is the department most responsible for the firm\u2019s relationships with customers, its partnerships with suppliers, its alliances with other organizations, and its ownership ties to shareholders.</p><div class="chart-box"><svg viewBox="0 0 820 400" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow1a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#98a2b3"/></marker></defs><g font-family="Public Sans, sans-serif" font-size="11"><rect x="40" y="55" width="150" height="55" rx="8" fill="#1c212a" stroke="#98a2b3"/><text x="115" y="87" text-anchor="middle" fill="#f3ede2" font-size="10">Other organizations</text><rect x="630" y="55" width="150" height="55" rx="8" fill="#1c212a" stroke="#98a2b3"/><text x="705" y="87" text-anchor="middle" fill="#f3ede2" font-size="10">Shareholders</text><rect x="40" y="150" width="150" height="55" rx="8" fill="#1c212a" stroke="#98a2b3"/><text x="115" y="182" text-anchor="middle" fill="#f3ede2" font-size="10">Suppliers</text><rect x="630" y="150" width="150" height="55" rx="8" fill="#1c212a" stroke="#98a2b3"/><text x="705" y="182" text-anchor="middle" fill="#f3ede2" font-size="10">Customers</text><rect x="250" y="45" width="120" height="65" rx="8" fill="#4fbf94" opacity="0.85"/><text x="310" y="82" text-anchor="middle" fill="#04070d" font-weight="700" font-size="11">R&amp;D</text><rect x="390" y="45" width="120" height="65" rx="8" fill="#d3c24a" opacity="0.85"/><text x="450" y="82" text-anchor="middle" fill="#04070d" font-weight="700" font-size="11">HR</text><rect x="530" y="45" width="120" height="65" rx="8" fill="#e0964f" opacity="0.85"/><text x="590" y="82" text-anchor="middle" fill="#04070d" font-weight="700" font-size="11">IT</text><rect x="250" y="135" width="120" height="65" rx="8" fill="#5b8def" opacity="0.85"/><text x="310" y="163" text-anchor="middle" fill="#04070d" font-weight="700" font-size="10">Manufacturing</text><rect x="390" y="135" width="120" height="65" rx="8" fill="#f3ede2"/><text x="450" y="163" text-anchor="middle" fill="#04070d" font-weight="700" font-size="9">Senior</text><text x="450" y="177" text-anchor="middle" fill="#04070d" font-weight="700" font-size="9">management</text><rect x="530" y="135" width="120" height="65" rx="8" fill="#e2685f" opacity="0.85"/><text x="590" y="172" text-anchor="middle" fill="#1a0605" font-weight="700" font-size="11">Finance</text><rect x="390" y="225" width="120" height="65" rx="8" fill="#cf6fb4" opacity="0.85"/><text x="450" y="262" text-anchor="middle" fill="#04070d" font-weight="700" font-size="10">Marketing</text><line x1="190" y1="82" x2="248" y2="78" stroke="#98a2b3" stroke-width="1.5" marker-end="url(#arrow1a)"/><text x="215" y="65" fill="#98a2b3" font-size="8">Alliances</text><line x1="630" y1="82" x2="652" y2="78" stroke="#98a2b3" stroke-width="1.5" marker-end="url(#arrow1a)"/><text x="600" y="65" fill="#98a2b3" font-size="8">Ownership</text><line x1="190" y1="177" x2="248" y2="167" stroke="#98a2b3" stroke-width="1.5" marker-end="url(#arrow1a)"/><text x="200" y="200" fill="#98a2b3" font-size="8">Partnerships</text><line x1="630" y1="177" x2="652" y2="167" stroke="#98a2b3" stroke-width="1.5" marker-end="url(#arrow1a)"/><text x="595" y="200" fill="#98a2b3" font-size="8">Relationships</text><rect x="40" y="335" width="740" height="45" rx="8" fill="#1c212a" stroke="#98a2b3" stroke-dasharray="4,3"/><text x="410" y="362" text-anchor="middle" fill="#98a2b3" font-size="10">Environmental forces: Social \u00b7 Economic \u00b7 Technological \u00b7 Competitive \u00b7 Regulatory</text><line x1="450" y1="335" x2="450" y2="292" stroke="#98a2b3" stroke-width="1.5" marker-end="url(#arrow1a)"/></g></svg><div class="chart-caption">Recreated from Figure 1-1: a marketing department relates to many people, organizations, and forces, and both shapes and is shaped by them.</div></div>' },
      { heading:'What Has to Be True for Marketing to Happen at All', html:'<p>Before any transaction can occur, four things must line up: (1) two or more parties each have an unsatisfied need, (2) each party has both the desire and the ability to satisfy that need, (3) the parties have a way to communicate with each other, and (4) each party has something to exchange with the other.</p><div class="example"><span class="ex-label">Textbook example</span>A late-night craving for pizza after studying is an unmet need, and your local Domino\u2019s owner has an unmet need too (a desire to sell pizza). You both have the ability to act \u2014 money and time on your side, ingredients and staff on theirs. You discover the store through an app or a coupon (communication), and you hand over money for food (the exchange) \u2014 sometimes completed by Domino\u2019s self-driving delivery robot, Nuro.</div>' }
    ],

    '1.2': [
      { heading:'Finding Out What Consumers Actually Want', html:'<p>The first job of marketing is discovering what prospective customers need. Firms rely on customer surveys, concept tests, and other marketing research, and increasingly on crowdsourcing \u2014 inviting customers themselves to submit and vote on new product ideas. LEGO Group, for instance, lets fans submit set ideas through its Ideas website; concepts that gather enough votes may become real products, including its Big Bang Theory model and a model based on Winnie-the-Pooh.</p>' },
      { heading:'Why So Many New Products Fail', html:'<p>Turning discovery into a successful product is harder than it sounds. Experts estimate it takes roughly 3,000 raw ideas to produce a single commercial success, and studies of more than 110,000 new-product launches estimate that about 40 percent of new products fail. Two lessons stand out: find out what consumers truly need and want, and just as important, don\u2019t produce what they don\u2019t need or want.</p><div class="example"><span class="ex-label">Spotting "showstoppers" before launch</span>Ray-Ban Stories smart glasses risk the same price and "nerdy look" showstoppers that doomed Google Glass; Zevia\u2019s stevia-sweetened soda risks an aftertaste complaint; and Stitch Fix\u2019s styling subscription faces 400 to 600 rival subscription services and subscriber fatigue. In each case, the underlying benefit is real \u2014 the question is whether the showstopper outweighs it.</div>' },
      { heading:'Needs and Wants Are Not the Same Thing', html:'<p>A <span class="term">need</span> is a felt state of deprivation \u2014 hunger, thirst, the desire for shelter. A <span class="term">want</span> is a need that has been shaped by a person\u2019s knowledge, culture, and personality. Feeling hungry is a need; reaching specifically for a Chocolate Chip Clif Bar because past experience taught you it satisfies that hunger well is a want. Effective marketing \u2014 creating awareness of good products at fair prices in convenient locations \u2014 is exactly what shapes wants out of needs.</p>' }
    ],

    '1.3': [
      { heading:'You Can\u2019t Satisfy Everyone, So Pick a Target', html:'<p>A <span class="term">market</span> is people who have both the desire and the ability to buy a specific offering. Because no organization can satisfy every possible consumer, marketers concentrate on a <span class="term">target market</span> \u2014 one or more specific groups of potential consumers toward which the organization directs its marketing program.</p>' },
      { heading:'The Four Ps You Control', html:'<p>Once a target market is chosen, the organization builds a <span class="term">marketing mix</span> \u2014 the combination of four controllable elements, often shorthanded as the four Ps, first published by Professor E. Jerome McCarthy. <span class="term">Product</span> is the good, service, or idea meant to satisfy the consumer\u2019s need. <span class="term">Price</span> is what is exchanged for that product. <span class="term">Promotion</span> is the means of communication between seller and buyer. <span class="term">Place</span> is how the product actually gets to the consumer.</p><div class="chart-box"><svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow1b" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#98a2b3"/></marker></defs><g font-family="Public Sans, sans-serif" font-size="11"><rect x="40" y="30" width="280" height="100" rx="10" fill="#5b8def" opacity="0.85"/><text x="180" y="70" text-anchor="middle" fill="#04070d" font-weight="700">Discover consumer</text><text x="180" y="88" text-anchor="middle" fill="#04070d" font-weight="700">needs by researching</text><rect x="380" y="30" width="280" height="100" rx="10" fill="#4fbf94" opacity="0.85"/><text x="520" y="60" text-anchor="middle" fill="#04070d" font-weight="700">Satisfy needs with the</text><text x="520" y="78" text-anchor="middle" fill="#04070d" font-weight="700">right marketing mix:</text><text x="520" y="98" text-anchor="middle" fill="#04070d" font-size="10">Product \u00b7 Price \u00b7 Promotion \u00b7 Place</text><line x1="320" y1="80" x2="376" y2="80" stroke="#98a2b3" stroke-width="2" marker-end="url(#arrow1b)"/><text x="348" y="65" text-anchor="middle" fill="#98a2b3" font-size="8">Concepts</text><rect x="40" y="200" width="280" height="45" rx="8" fill="#1c212a" stroke="#98a2b3"/><text x="180" y="227" text-anchor="middle" fill="#f3ede2" font-size="10">Information about needs</text><rect x="380" y="200" width="280" height="45" rx="8" fill="#1c212a" stroke="#98a2b3"/><text x="520" y="227" text-anchor="middle" fill="#f3ede2" font-size="10">Products, services, ideas</text><line x1="180" y1="198" x2="180" y2="142" stroke="#98a2b3" stroke-width="2" marker-end="url(#arrow1b)"/><line x1="520" y1="142" x2="520" y2="198" stroke="#98a2b3" stroke-width="2" marker-end="url(#arrow1b)"/><rect x="40" y="270" width="620" height="40" rx="8" fill="#e0964f" opacity="0.85"/><text x="350" y="295" text-anchor="middle" fill="#04070d" font-weight="700">Potential consumers: The market</text><line x1="180" y1="268" x2="180" y2="247" stroke="#98a2b3" stroke-width="2" marker-end="url(#arrow1b)"/><line x1="520" y1="247" x2="520" y2="268" stroke="#98a2b3" stroke-width="2" marker-end="url(#arrow1b)"/></g></svg><div class="chart-caption">Recreated from Figure 1-2: marketing seeks first to discover consumer needs, then satisfy them with the right marketing mix \u2014 a continuous loop back to the market.</div></div>' },
      { heading:'The Forces You Don\u2019t Control', html:'<p>Unlike the four Ps, <span class="term">environmental forces</span> sit outside the marketing department\u2019s direct control. What consumers themselves want, how technology is changing, whether the economy is expanding or contracting, what competitors are doing, and what regulators require can all act as either an accelerator or a brake on a company\u2019s marketing plans \u2014 often at the same time. The COVID-19 pandemic reshaped marketing mixes almost overnight, forcing many retailers to add curbside pickup and delivery options, and accelerating adoption of technologies like customer-service robots.</p>' }
    ],

    '1.4': [
      { heading:'What Counts as Value, and Who Delivers It Best', html:'<p><span class="term">Customer value</span> is the unique combination of benefits a targeted buyer receives \u2014 quality, convenience, on-time delivery, and both before- and after-sale service \u2014 measured against a specific price. Because no firm can be the best at everything, most successful companies pick one of three value strategies.</p><div class="example"><span class="ex-label">Textbook example</span>Target competes on best price ("expect more, pay less"), Starbucks competes on best product (aiming to "inspire and nurture the human spirit" one cup at a time), and Nordstrom competes on best service, built around delivering the best possible shopping experience.</div>' },
      { heading:'Turning a One-Time Sale into a Relationship', html:'<p><span class="term">Relationship marketing</span> links the organization to its individual customers, employees, suppliers, and other partners for their mutual, long-term benefit. It\u2019s a personal, ongoing connection that begins before the sale and can keep evolving long after it. Information technology has made this easier: smart, connected products feed data back to companies \u2014 BMW receives usage data from every new vehicle it sells, and General Electric collects data transmitted by the jet engines it builds. The Ritz-Carlton trains every employee to notice and record individual guest preferences, aiming to "build strong relationships and create Ritz-Carlton guests for life."</p>' },
      { heading:'Packaging Strategy into an Actual Marketing Program', html:'<p>A <span class="term">marketing program</span> is the plan that integrates the marketing mix to reach a specific group of prospective buyers. Ideally, those buyers form <span class="term">market segments</span> \u2014 relatively homogeneous groups of prospective buyers who share common needs and will respond similarly to a given marketing action.</p><table class="data-table"><tr><th>Marketing mix element</th><th>College student segment</th><th>Office worker segment</th></tr><tr><td>Product strategy</td><td>Post-it Flag Highlighter</td><td>Post-it Flag Pen</td></tr><tr><td>Price strategy</td><td>$2.99\u2013$3.99 single; $7.99\u2013$10.99 three-pack</td><td>$5.99\u2013$7.99 two-pack; lower wholesale price</td></tr><tr><td>Promotion strategy</td><td>Print ads, word-of-mouth messages</td><td>Limited promotion to distributors</td></tr><tr><td>Place strategy</td><td>College bookstores, office supply stores</td><td>Office wholesalers and retailers</td></tr></table><div class="chart-caption">Recreated from Figure 1-3: 3M built two marketing programs for the launch of two Post-it brand products, targeted at two different market segments.</div>' }
    ],

    '1.5': [
      { heading:'From Selling Whatever You Make to Listening First', html:'<p>Marketing became a driving force among American firms in the 1950s, giving rise to the <span class="term">marketing concept</span> \u2014 the idea that an organization should strive to satisfy the needs of consumers while also achieving its own goals. General Electric\u2019s 1952 annual report described putting marketing at the beginning of the production cycle rather than the end. Firms that have put real effort into living out the marketing concept \u2014 Amazon, Charles Schwab, Kaiser Permanente, and LG among them \u2014 are described as having a <span class="term">market orientation</span>: they continuously collect information about customers\u2019 needs, share it across departments, and use it to create customer value.</p>' },
      { heading:'Owning the Whole Relationship', html:'<p>A closely related focus is <span class="term">customer relationship management (CRM)</span>, the ongoing process of identifying prospective buyers, understanding them intimately, and developing favorable long-term perceptions of the organization so that buyers choose it \u2014 and keep advocating for it after the purchase. The foundation of CRM is really <span class="term">customer experience</span>: the customer\u2019s internal response to every direct contact (buying, using, or getting service) and every indirect contact (word of mouth, reviews, news coverage) with the company.</p>' },
      { heading:'Balancing Consumer, Company, and Society', html:'<p>Not every marketing question has a clear-cut legal answer, which is why <span class="term">ethics</span> \u2014 the moral standards and guidelines that help managers navigate situations the law doesn\u2019t specifically address \u2014 matters so much in practice. A related, broader idea is <span class="term">social responsibility</span>: the notion that organizations are accountable to society at large, not just to their buyers and shareholders. Some firms go further and adopt the <span class="term">societal marketing concept</span>, the view that an organization should satisfy consumers\u2019 needs in a way that also provides for society\u2019s well-being.</p><div class="example"><span class="ex-label">Textbook example</span>Patagonia\u2019s Worn Wear program encourages customers to repair, trade, and eventually recycle all of its products, arguing that making high-quality stuff that lasts for years is one of the most responsible things a company can do.</div>' },
      { heading:'Just How Big Is Marketing, Really?', html:'<p>Marketing\u2019s reach is broader than most people assume. Businesses, nonprofits, and even individual political candidates all market something. What gets marketed stretches beyond physical goods to include services and ideas \u2014 all of which count as products in the broad sense used throughout this field. On the buying side, <span class="term">ultimate consumers</span> are people who buy products for their own or their household\u2019s use, while <span class="term">organizational buyers</span> are the manufacturers, wholesalers, retailers, nonprofits, and government agencies that buy products for their own use or for resale. However consumers ultimately benefit, that benefit is called <span class="term">utility</span> \u2014 form utility (making the product), place utility (having it where it\u2019s needed), time utility (having it available when needed), and possession utility (making it easy to acquire, such as through credit).</p>' }
    ],

    '4.1': [
      { heading:'Five Stages Behind Every Purchase', html:'<p>Behind the visible act of buying something lies an important decision process and consumer experience that marketers work hard to understand. The <span class="term">purchase decision process</span> is the stages a buyer passes through in making choices about which products and services to buy, unfolding in five stages: problem recognition, information search, alternative evaluation, purchase decision, and postpurchase behavior. How a consumer experiences each stage \u2014 whether it feels rewarding or frustrating \u2014 often determines whether that person keeps buying from a company at all.</p><div class="chart-box"><svg viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow4a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#98a2b3"/></marker></defs><g font-family="Public Sans, sans-serif"><rect x="10" y="40" width="150" height="110" rx="10" fill="#e0964f" opacity="0.85"/><text x="85" y="80" text-anchor="middle" fill="#04070d" font-size="12" font-weight="700">Problem</text><text x="85" y="96" text-anchor="middle" fill="#04070d" font-size="12" font-weight="700">recognition</text><text x="85" y="120" text-anchor="middle" fill="#04070d" font-size="9">Perceiving a need</text><rect x="190" y="40" width="150" height="110" rx="10" fill="#5b8def" opacity="0.85"/><text x="265" y="80" text-anchor="middle" fill="#04070d" font-size="12" font-weight="700">Information</text><text x="265" y="96" text-anchor="middle" fill="#04070d" font-size="12" font-weight="700">search</text><text x="265" y="120" text-anchor="middle" fill="#04070d" font-size="9">Seeking value</text><rect x="370" y="40" width="150" height="110" rx="10" fill="#4fbf94" opacity="0.85"/><text x="445" y="80" text-anchor="middle" fill="#04070d" font-size="12" font-weight="700">Alternative</text><text x="445" y="96" text-anchor="middle" fill="#04070d" font-size="12" font-weight="700">evaluation</text><text x="445" y="120" text-anchor="middle" fill="#04070d" font-size="9">Assessing value</text><rect x="550" y="40" width="150" height="110" rx="10" fill="#cf6fb4" opacity="0.85"/><text x="625" y="80" text-anchor="middle" fill="#04070d" font-size="12" font-weight="700">Purchase</text><text x="625" y="96" text-anchor="middle" fill="#04070d" font-size="12" font-weight="700">decision</text><text x="625" y="120" text-anchor="middle" fill="#04070d" font-size="9">Buying value</text><rect x="730" y="40" width="150" height="110" rx="10" fill="#d3c24a" opacity="0.85"/><text x="805" y="80" text-anchor="middle" fill="#04070d" font-size="12" font-weight="700">Postpurchase</text><text x="805" y="96" text-anchor="middle" fill="#04070d" font-size="12" font-weight="700">behavior</text><text x="805" y="120" text-anchor="middle" fill="#04070d" font-size="9">Realizing value</text><line x1="163" y1="95" x2="187" y2="95" stroke="#98a2b3" stroke-width="2" marker-end="url(#arrow4a)"/><line x1="343" y1="95" x2="367" y2="95" stroke="#98a2b3" stroke-width="2" marker-end="url(#arrow4a)"/><line x1="523" y1="95" x2="547" y2="95" stroke="#98a2b3" stroke-width="2" marker-end="url(#arrow4a)"/><line x1="703" y1="95" x2="727" y2="95" stroke="#98a2b3" stroke-width="2" marker-end="url(#arrow4a)"/></g></svg><div class="chart-caption">Recreated from Figure 4-1: the purchase decision process consists of five stages.</div></div>' },
      { heading:'Problem Recognition and Information Search', html:'<p><span class="term">Problem recognition</span> is the initial step: perceiving a difference between a person\u2019s ideal and actual situation big enough to trigger a decision \u2014 as simple as finding an empty milk carton, or as personal as a first-year student realizing their wardrobe doesn\u2019t match campus style. Marketers can deliberately activate this stage, such as an ad for the newest 5G smartphone emphasizing "maximum use from one device."</p><p>Once a need is recognized, the consumer begins an information search. First comes an <span class="term">internal search</span> \u2014 scanning memory for relevant past experience, often enough for a routinely purchased item like shampoo. When memory isn\u2019t enough, consumers turn to an <span class="term">external search</span> instead, drawing on <span class="term">personal sources</span> (friends and relatives), <span class="term">public sources</span> (Consumer Reports, government agencies), and <span class="term">marketer-dominated sources</span> (ads, company websites, salespeople).</p>' },
      { heading:'Weighing the Alternatives', html:'<p>The alternative evaluation stage clarifies gathered information by suggesting <span class="term">evaluative criteria</span> \u2014 objective attributes (like price) and subjective ones (like prestige) used to compare brands \u2014 which narrow the full universe of brands down to a <span class="term">consideration set</span>, the group of brands a consumer views as realistic candidates.</p><div class="example"><span class="ex-label">Textbook example</span>A smartphone shopper who cares most about price under $500, camera quality, and battery life might end up considering only the Google Pixel 7 and the Motorola Moto G Power out of every brand on the market.</div>' },
      { heading:'Buying and Living With the Decision', html:'<p>Two choices remain at the purchase decision stage: from whom to buy, and when to buy. After the purchase, <span class="term">postpurchase behavior</span> begins: the consumer compares the product against expectations, arriving at satisfaction or dissatisfaction. About 90 percent of dissatisfied buyers won\u2019t purchase the product again and will complain to about 9.4 people, while satisfied buyers tell only about three others. Choosing between two equally attractive options often produces <span class="term">cognitive dissonance</span>, resolved by seeking reassurance through reviews, ads, or friends\u2019 opinions.</p><div class="chart-box"><svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg"><g font-family="Public Sans, sans-serif" font-size="11"><circle cx="230" cy="150" r="120" fill="#5b8def" opacity="0.28"/><circle cx="400" cy="150" r="120" fill="#4fbf94" opacity="0.28"/><circle cx="315" cy="150" r="120" fill="#cf6fb4" opacity="0.22"/><text x="165" y="90" fill="#f3ede2" font-weight="700">Prepurchase</text><text x="150" y="108" fill="#98a2b3" font-size="9">Ads, reviews, social media,</text><text x="150" y="120" fill="#98a2b3" font-size="9">referrals</text><text x="440" y="90" fill="#f3ede2" font-weight="700">Postpurchase</text><text x="425" y="108" fill="#98a2b3" font-size="9">Loyalty program,</text><text x="425" y="120" fill="#98a2b3" font-size="9">customer service, support</text><text x="280" y="220" fill="#f3ede2" font-weight="700">Purchase</text><text x="255" y="238" fill="#98a2b3" font-size="9">Website, salespeople,</text><text x="255" y="250" fill="#98a2b3" font-size="9">store design</text></g></svg><div class="chart-caption">Recreated from Figure 4-4: a consumer journey map showing touchpoints across the prepurchase, purchase, and postpurchase phases.</div></div><p>Marketers track a brand\u2019s <span class="term">consumer touchpoints</span> \u2014 its points of contact with a consumer from start to finish \u2014 using a <span class="term">consumer journey map</span> like the one above, which can reveal "pain points" such as a hard-to-navigate website.</p>' }
    ],

    '4.2': [
      { heading:'Not Every Purchase Gets the Full Five Stages', html:'<p>Consumers don\u2019t always work through all five stages \u2014 they skip or minimize stages depending on <span class="term">involvement</span>, the personal, social, and economic significance a purchase holds. High-involvement purchase occasions typically share at least one trait: the item is expensive, has serious personal consequences, or could reflect on the buyer\u2019s social image.</p>' },
      { heading:'Extended, Limited, and Routine Problem Solving', html:'<p>In <span class="term">extended problem solving</span>, a buyer uses all five stages and devotes considerable time to external search \u2014 many brands are evaluated on many attributes over considerable time, typical of cars or audio systems. <span class="term">Limited problem solving</span> calls for less: some information sought, a moderate number of attributes evaluated \u2014 choosing a toaster or a lunch restaurant. <span class="term">Routine problem solving</span> is essentially habit \u2014 little effort, typical of table salt or milk.</p><table class="data-table"><tr><th>Characteristic</th><th>Extended</th><th>Limited</th><th>Routine</th></tr><tr><td>Brands examined</td><td>Many</td><td>Several</td><td>One</td></tr><tr><td>Sellers considered</td><td>Many</td><td>Several</td><td>Few</td></tr><tr><td>Attributes evaluated</td><td>Many</td><td>Moderate</td><td>One</td></tr><tr><td>External info sources</td><td>Many</td><td>Few</td><td>None</td></tr><tr><td>Time spent searching</td><td>Considerable</td><td>Little</td><td>Minimal</td></tr></table><div class="chart-caption">Recreated from Figure 4-3: comparison of problem-solving variations.</div>' },
      { heading:'What This Means for Marketing Strategy', html:'<p>Market leaders of low-involvement products focus on maintaining product quality, avoiding stockouts, and using repetitive advertising that reassures buyers. Market challengers face the harder task of breaking existing habits through free samples, coupons, and rebates \u2014 Campbell\u2019s long-running "Could\u2019ve Had a V8" campaign targeted people who habitually reached for other juices instead.</p>' },
      { heading:'The Situation Can Change Everything', html:'<p>Five <span class="term">situational influences</span> can reshape the purchase decision process regardless of involvement: the purchase task itself, social surroundings (shoppers with children buy about 40 percent more items), physical surroundings, temporal effects, and <span class="term">antecedent states</span> \u2014 a consumer\u2019s mood, cash on hand, or circumstances at the moment of decision.</p>' }
    ],

    '4.3': [
      { heading:'Motivation and Personality', html:'<p><span class="term">Motivation</span> is the energizing force that stimulates behavior to satisfy a need. Psychologists arrange needs into a hierarchy: physiological needs must be satisfied first, followed by safety, social, personal, and finally self-actualization needs.</p><div class="chart-box"><svg viewBox="0 0 500 300" xmlns="http://www.w3.org/2000/svg"><g font-family="Public Sans, sans-serif" font-size="11"><polygon points="250,15 300,80 200,80" fill="#d3c24a"/><text x="250" y="55" text-anchor="middle" fill="#04070d" font-size="9" font-weight="700">Self-actualization</text><polygon points="200,80 300,80 335,140 165,140" fill="#cf6fb4"/><text x="250" y="115" text-anchor="middle" fill="#04070d" font-size="9" font-weight="700">Personal needs</text><polygon points="165,140 335,140 370,200 130,200" fill="#4fbf94"/><text x="250" y="175" text-anchor="middle" fill="#04070d" font-size="9" font-weight="700">Social needs</text><polygon points="130,200 370,200 405,255 95,255" fill="#5b8def"/><text x="250" y="232" text-anchor="middle" fill="#04070d" font-size="9" font-weight="700">Safety needs</text><polygon points="95,255 405,255 430,290 70,290" fill="#e0964f"/><text x="250" y="277" text-anchor="middle" fill="#04070d" font-size="9" font-weight="700">Physiological needs</text></g></svg><div class="chart-caption">Recreated from Figure 4-6: Maslow\u2019s hierarchy of needs, from physiological (bottom) to self-actualization (top).</div></div><p>Where motivation supplies the energy, <span class="term">personality</span> \u2014 a person\u2019s consistent behaviors or responses to recurring situations \u2014 supplies the direction, shaping a consumer\u2019s <span class="term">self-concept</span>: how people see themselves versus how they\u2019d like to be seen.</p>' },
