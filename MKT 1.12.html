const flashState = { order: [], pos:0, flipped:false, filter:'all', chapter: null };
function flashDeck(){
  let list = allConcepts();
  if (flashState.chapter && flashState.chapter !== 'all') list = list.filter(c=>c.chapterId===flashState.chapter);
  if (flashState.filter==='must') list = list.filter(c=>c.tier==='must_know');
  else if (flashState.filter==='difficult') list = list.filter(c=>PROGRESS.flashcardStatus[c.id]==='difficult');
  else if (flashState.filter==='starred') list = list.filter(c=>PROGRESS.flashcardStatus[c.id]==='starred');
  return list;
}
function renderFlashcardsTool(holder){
  if (flashState.chapter === null) flashState.chapter = allChapters()[0].id;
  if (!flashState.order.length) flashState.order = shuffle(flashDeck().map(c=>c.id));
  const filters = [['all','All'],['must','Must Know'],['difficult','Difficult'],['starred','Starred']];
  let html = '<div class="scope-row">';
  html += '<select id="fcChapterSelect"><option value="all">All chapters (cumulative)</option>'+
    allChapters().map(ch=>'<option value="'+ch.id+'"'+(flashState.chapter===ch.id?' selected':'')+'>Chapter '+ch.number+': '+escapeHtml(ch.title)+' ('+conceptsForChapter(ch.id).length+')</option>').join('')+
    '</select></div>';
  html += '<div class="scope-row">';
  filters.forEach(([k,l])=> html += '<button class="tool-pill'+(flashState.filter===k?' active':'')+'" data-ff="'+k+'">'+l+'</button>');
  html += '</div><div class="flash-wrap">';
  const deck = flashState.order.filter(id=> flashDeck().some(c=>c.id===id));
  if (!deck.length){
    html += '<p style="color:var(--text-faint)">No cards match this filter yet.</p></div>';
    holder.innerHTML = html;
    wireFlashFilters(holder);
    return;
  }
  if (flashState.pos >= deck.length) flashState.pos = 0;
  const c = getConcept(deck[flashState.pos]);
  html += '<div class="flash-progress">'+(flashState.pos+1)+' / '+deck.length+'</div>';
  html += '<div class="flashcard'+(flashState.flipped?' flipped':'')+'" id="flashcardEl"><div class="flashcard-inner">'+
    '<div class="flash-face front"><div class="flash-term">'+escapeHtml(c.term)+'</div><div class="flash-tier">'+c.tier.replace('_',' ')+'</div></div>'+
    '<div class="flash-face back"><div class="flash-def">'+escapeHtml(c.definition)+'</div></div></div></div>';
  html += '<div class="btn-row">'+
    '<button class="btn" id="fcPrev">\u2190 Previous</button>'+
    '<button class="btn" id="fcShuffle">Shuffle</button>'+
    '<button class="btn" id="fcNext">Next \u2192</button>'+
    '<button class="btn" id="fcInfo">Info</button></div>';
  html += '<div class="btn-row">'+
    '<button class="btn good" id="fcKnow">Know It</button>'+
    '<button class="btn bad" id="fcDifficult">Mark Difficult</button>'+
    '<button class="btn" id="fcStar">'+(PROGRESS.flashcardStatus[c.id]==='starred'?'\u2605 Starred':'\u2606 Star')+'</button></div>';
  html += '</div>';
  holder.innerHTML = html;
  wireFlashFilters(holder);
  document.getElementById('fcChapterSelect').onchange = (e)=>{
    flashState.chapter = e.target.value; flashState.order = shuffle(flashDeck().map(x=>x.id)); flashState.pos=0; flashState.flipped=false;
    renderFlashcardsTool(holder);
  };
  document.getElementById('flashcardEl').onclick = ()=>{ flashState.flipped = !flashState.flipped; renderFlashcardsTool(holder); };
  document.getElementById('fcPrev').onclick = ()=>{ flashState.pos = (flashState.pos-1+deck.length)%deck.length; flashState.flipped=false; renderFlashcardsTool(holder); };
  document.getElementById('fcNext').onclick = ()=>{ flashState.pos = (flashState.pos+1)%deck.length; flashState.flipped=false; renderFlashcardsTool(holder); };
  document.getElementById('fcShuffle').onclick = ()=>{ flashState.order = shuffle(flashDeck().map(x=>x.id)); flashState.pos=0; flashState.flipped=false; renderFlashcardsTool(holder); };
  document.getElementById('fcInfo').onclick = ()=> openConceptModal(c.id);
  document.getElementById('fcKnow').onclick = ()=>{ setFlashcardStatus(c.id,'know'); flashState.pos=(flashState.pos+1)%deck.length; flashState.flipped=false; renderFlashcardsTool(holder); };
  document.getElementById('fcDifficult').onclick = ()=>{ setFlashcardStatus(c.id,'difficult'); flashState.pos=(flashState.pos+1)%deck.length; flashState.flipped=false; renderFlashcardsTool(holder); };
  document.getElementById('fcStar').onclick = ()=>{ setFlashcardStatus(c.id, PROGRESS.flashcardStatus[c.id]==='starred'?null:'starred'); renderFlashcardsTool(holder); };

function wireFlashFilters(holder){
  holder.querySelectorAll('[data-ff]').forEach(b=> b.onclick = ()=>{
    flashState.filter = b.dataset.ff; flashState.order = shuffle(flashDeck().map(c=>c.id)); flashState.pos=0; flashState.flipped=false;

}

/* =========================================================================
   GENERIC QUIZ ENGINE (used by Quiz, Exam Prep, Weak Areas, Speed Round,
   Boss Battle, Scenario Challenge, Two Truths and a Trap, Personalized Review)
   ========================================================================= */
function runQuizEngine(holder, questions, opts){
  opts = Object.assign({ mode:'practice', onComplete:null, logMode:'quiz', title:null, timeLimitTotal:null, perQuestionTimer:null }, opts);
  const state = { idx:0, score:0, answers:[], answered:false, selectedIndex:null, textVal:'', matchLeft:null, matchLocked:[], matchOrder:null, timeLeft: opts.timeLimitTotal, qTimeLeft: opts.perQuestionTimer, mainTimer:null, qTimer:null };

  function clearTimers(){ clearInterval(state.mainTimer); clearInterval(state.qTimer); }

  function checkAnswer(q, ansPayload){
    if (q.type==='fill_blank'){
      const val = (ansPayload||'').trim().toLowerCase();
      const accept = [q.correctAnswer.toLowerCase()].concat((q.acceptableAnswers||[]).map(s=>s.toLowerCase()));
      return accept.some(a=> val === a);
    }
    if (q.type==='matching') return true;
    return ansPayload === q.correctIndex;
  }

  function submitAnswer(q, ansPayload, isCorrect){
    if (state.answered) return;
    state.answered = true;
    state.answers[state.idx] = { correct: isCorrect, payload: ansPayload };
    if (isCorrect) state.score++;
    recordQuizAttempt({ concept:q.concept, correct:isCorrect, difficulty:q.difficulty, lo:q.lo, mode:opts.logMode });
    clearInterval(state.qTimer);
    if (opts.mode==='exam'){
      goNext();
    } else {
      render();
    }
  }

  function goNext(){
    state.answered = false; state.selectedIndex=null; state.textVal=''; state.matchLeft=null; state.matchLocked=[]; state.matchOrder=null;
    state.qTimeLeft = opts.perQuestionTimer;
    if (state.idx < questions.length-1){ state.idx++; render(); }
    else finish();
  }

  function finish(){
    clearTimers();
    const byLO = {};
    questions.forEach((q,i)=>{
      byLO[q.lo] = byLO[q.lo] || {correct:0,total:0};
      byLO[q.lo].total++;
      if (state.answers[i] && state.answers[i].correct) byLO[q.lo].correct++;
    });
    if (opts.mode==='exam'){
      PROGRESS.examHistory.push({ date: Date.now(), correct: state.score, total: questions.length, byLO });
      persistProgress();
    }
    renderResults(byLO);
  }

  function renderResults(byLO){
    const total = questions.length;
    const missed = state.answers.map((a,i)=>({a,q:questions[i]})).filter(x=>x.a && !x.a.correct);
    let html = '<div class="quiz-card"><div class="final-score"><div class="mono" style="color:var(--text-faint)">'+(opts.title||'Results')+'</div><div class="fs-num">'+state.score+' / '+total+'</div></div>';
    html += '<h4 style="margin-top:6px">By Learning Objective</h4>';
    Object.keys(byLO).forEach(lo=> html += '<div class="weak-row"><span>LO '+lo+'</span><span>'+byLO[lo].correct+' / '+byLO[lo].total+'</span></div>');
    if (opts.mode==='exam'){
      html += '<h4 style="margin-top:16px">Answer Review</h4>';
      questions.forEach((q,i)=>{
        const a = state.answers[i];
        html += '<div class="quiz-feedback '+(a&&a.correct?'correct':'incorrect')+'" style="margin-bottom:8px"><b>'+escapeHtml(q.prompt)+'</b><br>'+escapeHtml(q.explanation)+'</div>';
      });
    }
    if (missed.length){
      html += '<div class="btn-row" style="margin-top:16px"><button class="btn primary" id="reviewMistakesBtn">Personalized Review of Mistakes</button></div>';
    }
    holder.innerHTML = html;
    const rb = document.getElementById('reviewMistakesBtn');
    if (rb) rb.onclick = ()=> runQuizEngine(holder, missed.map(x=>x.q), { mode:'practice', logMode:'review', title:'Review of Mistakes' });
    if (opts.onComplete) opts.onComplete({ score: state.score, total, byLO });
  }

  function renderTimerChip(){
    let chip = '';
    if (opts.timeLimitTotal){
      chip += '<span class="timer-chip'+(state.timeLeft<=10?' low':'')+'">'+state.timeLeft+'s left</span>';
    }
    if (opts.perQuestionTimer){
      chip += ' <span class="timer-chip'+(state.qTimeLeft<=3?' low':'')+'">Q: '+state.qTimeLeft+'s</span>';
    }
    return chip;
  }

  function render(){
    if (state.idx >= questions.length){ finish(); return; }
    const q = questions[state.idx];
    let html = '<div class="quiz-card">';
    html += '<div class="quiz-top"><span>Question '+(state.idx+1)+' of '+questions.length+' \u00b7 LO '+q.lo+' \u00b7 '+q.difficulty+'</span><span>'+renderTimerChip()+' Score: '+state.score+'</span></div>';
    html += '<div class="quiz-prompt">'+escapeHtml(q.prompt)+'</div>';

    if (q.type==='fill_blank'){
      html += '<input type="text" class="quiz-input" id="qFillInput" placeholder="Type your answer" '+(state.answered?'disabled':'')+' value="'+escapeHtml(state.textVal)+'">';
      if (!state.answered) html += '<button class="btn primary" id="qSubmitBtn">Submit</button>';
    } else if (q.type==='matching'){
      if (!state.matchOrder) state.matchOrder = shuffle(q.pairs.map((_,i)=>i));
      html += '<div class="mg-grid"><div class="mg-col">';
      q.pairs.forEach((p,i)=> html += '<div class="mg-card'+(state.matchLeft===i?' selected':'')+(state.matchLocked.includes(i)?' correct':'')+'" data-mleft="'+i+'">'+escapeHtml(p.left)+'</div>');
      html += '</div><div class="mg-col">';
      state.matchOrder.forEach(i=> html += '<div class="mg-card'+(state.matchLocked.includes(i)?' correct':'')+'" data-mright="'+i+'">'+escapeHtml(q.pairs[i].right)+'</div>');
      html += '</div></div>';
      if (state.matchLocked.length === q.pairs.length && !state.answered){
        setTimeout(()=> submitAnswer(q, null, true), 200);
      }
    } else {
      q.options.forEach((opt,i)=>{
        let cls = 'quiz-opt';
        if (state.answered && opts.mode!=='exam'){
          if (i===q.correctIndex) cls += ' correct';
          else if (i===state.selectedIndex) cls += ' incorrect';
        }
        html += '<button class="'+cls+'" data-opt="'+i+'" '+((state.answered && opts.mode!=='exam')?'disabled':'')+'>'+escapeHtml(opt)+'</button>';
      });
    }

    if (state.answered && opts.mode!=='exam'){
      const a = state.answers[state.idx];
      html += '<div class="quiz-feedback '+(a.correct?'correct':'incorrect')+'"><b>'+(a.correct?'Correct.':'Not quite.')+'</b> '+escapeHtml(q.explanation)+'</div>';
      html += '<div class="btn-row" style="margin-top:12px"><button class="btn primary" id="qNextBtn">'+(state.idx===questions.length-1?'See results':'Next question \u2192')+'</button></div>';
    } else if (opts.mode==='exam'){
      html += '<div class="btn-row" style="margin-top:14px"><button class="btn primary" id="qExamNextBtn">'+(state.idx===questions.length-1?'Submit exam':'Next \u2192')+'</button></div>';
    }
    html += '</div>';
    holder.innerHTML = html;
    wireQuestion(q);
    clearInterval(state.qTimer);
    if (opts.perQuestionTimer && !state.answered && !(opts.mode==='exam' && state.answers[state.idx])){
      state.qTimer = setInterval(()=>{
        state.qTimeLeft--;
        if (state.qTimeLeft <= 0){
          clearInterval(state.qTimer);
          if (opts.mode==='exam'){
            if (!state.answers[state.idx]) state.answers[state.idx] = { correct:false, payload:null };
            goNext();
          } else {
            submitAnswer(q, null, false);
          }
        } else {
          const chip = holder.querySelector('.timer-chip:last-child');
          if (chip){ chip.textContent = 'Q: '+state.qTimeLeft+'s'; chip.classList.toggle('low', state.qTimeLeft<=3); }
        }
      }, 1000);
    }
  }

  function wireQuestion(q){
    if (q.type==='fill_blank'){
      const input = document.getElementById('qFillInput');
      if (input) input.oninput = (e)=> state.textVal = e.target.value;
      const sb = document.getElementById('qSubmitBtn');
      if (sb) sb.onclick = ()=>{
        if (!state.textVal.trim()) return;
        submitAnswer(q, state.textVal, checkAnswer(q, state.textVal));
      };
    } else if (q.type==='matching'){
      document.querySelectorAll('[data-mleft]').forEach(b=> b.onclick = ()=>{
        const i = parseInt(b.dataset.mleft,10);
        if (state.matchLocked.includes(i)) return;
        state.matchLeft = i; render();
      });
      document.querySelectorAll('[data-mright]').forEach(b=> b.onclick = ()=>{
        const i = parseInt(b.dataset.mright,10);
        if (state.matchLocked.includes(i) || state.matchLeft===null) return;
        if (state.matchLeft === i){ state.matchLocked.push(i); state.matchLeft=null; render(); }
        else {
          b.classList.add('wrong');
          setTimeout(()=>{ state.matchLeft=null; render(); }, 500);
        }
      });
    } else {
      document.querySelectorAll('[data-opt]').forEach(b=> b.onclick = ()=>{
        const i = parseInt(b.dataset.opt,10);
        state.selectedIndex = i;
        if (opts.mode==='exam'){ state.answers[state.idx] = { correct: checkAnswer(q,i), payload:i }; render(); }
        else submitAnswer(q, i, checkAnswer(q,i));
      });
    }
    const nb = document.getElementById('qNextBtn'); if (nb) nb.onclick = goNext;
    const enb = document.getElementById('qExamNextBtn'); if (enb) enb.onclick = ()=>{
      if (!state.answers[state.idx]) state.answers[state.idx] = { correct:false, payload:null };
      if (state.answers[state.idx].correct) { /* already scored below at finish */ }
      goNext();
    };
  }

  if (opts.timeLimitTotal){
    state.mainTimer = setInterval(()=>{
      state.timeLeft--;
      if (state.timeLeft <= 0){ finish(); }
      else { const chipEls = holder.querySelectorAll('.timer-chip'); if (chipEls[0]) chipEls[0].outerHTML = renderTimerChip(); }
    }, 1000);
  }

  // recompute exam score at finish based on answers[].correct already tracked in exam branch
  const origFinish = finish;
  finish = function(){
    if (opts.mode==='exam'){
      state.score = state.answers.filter(a=>a && a.correct).length;
    }
    origFinish();
  };

  render();
}

/* =========================================================================
   GENERIC MATCH ENGINE (Match Game + Mini "Matching Game")
   ========================================================================= */
function runMatchEngine(holder, conceptIds, roundSize, opts){
  opts = opts || {};
  const rounds = [];
  for (let i=0;i<conceptIds.length;i+=roundSize){
    const chunk = conceptIds.slice(i, i+roundSize).map(getConcept).filter(Boolean);
    if (chunk.length) rounds.push(chunk);
  }
  const state = { round:0, termOrder:null, defOrder:null, lockedTerm:[], lockedDef:[], selTerm:null, selDef:null, busy:false };

  function setupRound(){
    const pairs = rounds[state.round];
    state.termOrder = shuffle(pairs.map((_,i)=>i));
    state.defOrder = shuffle(pairs.map((_,i)=>i));
    state.lockedTerm = []; state.lockedDef = []; state.selTerm=null; state.selDef=null;
  }
  setupRound();

  function render(){
    if (state.round >= rounds.length){
      holder.innerHTML = '<div class="mg-overlay"><h3>All matched!</h3><p>You cleared all '+rounds.length+' round(s).</p><button class="btn primary" id="mgRestart">Restart</button></div>';
      document.getElementById('mgRestart').onclick = ()=>{ state.round=0; setupRound(); render(); };
      if (opts.onComplete) opts.onComplete();
      return;
    }
    const pairs = rounds[state.round];
    if (state.lockedTerm.length === pairs.length){
      holder.innerHTML = '<div class="mg-overlay"><h3>Round complete!</h3><p>Round '+(state.round+1)+' of '+rounds.length+' done.</p><button class="btn primary" id="mgNextRound">Next round \u2192</button></div>';
      document.getElementById('mgNextRound').onclick = ()=>{ state.round++; setupRound(); render(); };
      return;
    }
    let html = '<div class="mg-status"><span>Round '+(state.round+1)+' of '+rounds.length+'</span><span>Matched: '+state.lockedTerm.length+' / '+pairs.length+'</span></div>';
    html += '<div class="mg-grid"><div class="mg-col">';
    state.termOrder.forEach(i=>{
      let cls='mg-card'+(state.lockedTerm.includes(i)?' correct':'')+(state.selTerm===i?' selected':'');
      html += '<div class="'+cls+'" data-term="'+i+'">'+escapeHtml(pairs[i].term)+'</div>';
    });
    html += '</div><div class="mg-col">';
    state.defOrder.forEach(i=>{
      let cls='mg-card'+(state.lockedDef.includes(i)?' correct':'')+(state.selDef===i?' selected':'');
      html += '<div class="'+cls+'" data-def="'+i+'">'+escapeHtml(pairs[i].definition)+'</div>';
    });
    html += '</div></div>';
    holder.innerHTML = html;
    holder.querySelectorAll('[data-term]').forEach(b=> b.onclick = ()=> handleClick('term', parseInt(b.dataset.term,10)));
    holder.querySelectorAll('[data-def]').forEach(b=> b.onclick = ()=> handleClick('def', parseInt(b.dataset.def,10)));
  }

  function handleClick(kind, i){
    if (state.busy) return;
    const pairs = rounds[state.round];
    if (kind==='term'){ if (state.lockedTerm.includes(i)) return; state.selTerm = i; }
    else { if (state.lockedDef.includes(i)) return; state.selDef = i; }
    render();
    if (state.selTerm!==null && state.selDef!==null){
      if (state.selTerm === state.selDef){
        state.lockedTerm.push(state.selTerm); state.lockedDef.push(state.selDef);
        state.selTerm=null; state.selDef=null;
        render();
      } else {
        state.busy = true;
        const termEl = holder.querySelector('[data-term="'+state.selTerm+'"]');
        const defEl = holder.querySelector('[data-def="'+state.selDef+'"]');
        if (termEl) termEl.classList.add('wrong');
        if (defEl) defEl.classList.add('wrong');
        setTimeout(()=>{ state.selTerm=null; state.selDef=null; state.busy=false; render(); }, 650);
      }
    }
  }
  render();
}

/* =========================================================================
   CROSSWORD
   ========================================================================= */
function generateCrossword(wordList){
  const SIZE = 26, CENTER = 13;
  let best = null;
  for (let attempt=0; attempt<70; attempt++){
    const order = shuffle(wordList.slice()).sort((a,b)=>b.answer.length-a.answer.length);
    const grid = Array.from({length:SIZE},()=>Array(SIZE).fill(null));
    const placed = [];
    function canPlace(word,row,col,dir){
      let inter=0;
      for (let k=0;k<word.length;k++){
        const r = dir==='across'?row:row+k, c = dir==='across'?col+k:col;
        if (r<0||c<0||r>=SIZE||c>=SIZE) return null;
        const ex = grid[r][c];
        if (ex){ if (ex!==word[k]) return null; inter++; }
        else {
          if (dir==='across'){ if ((grid[r-1]&&grid[r-1][c])||(grid[r+1]&&grid[r+1][c])) return null; }
          else { if (grid[r][c-1]||grid[r][c+1]) return null; }
        }
      }
      if (dir==='across'){ if (grid[row][col-1]||grid[row][col+word.length]) return null; }
      else { if ((grid[row-1]&&grid[row-1][col])||(grid[row+word.length]&&grid[row+word.length][col])) return null; }
      return inter;
    }
    function place(word,row,col,dir){
      for (let k=0;k<word.length;k++){ const r=dir==='across'?row:row+k, c=dir==='across'?col+k:col; grid[r][c]=word[k]; }
      placed.push({word,row,col,dir});
    }
    const first = order[0];
    place(first.answer, CENTER, CENTER-Math.floor(first.answer.length/2), 'across');
    let unplaced = order.slice(1);
    let progressed = true;
    while (progressed && unplaced.length){
      progressed = false;
      for (let idx=0; idx<unplaced.length; idx++){
        const w = unplaced[idx];
        let candidates = [];
        for (const p of placed){
          for (let i=0;i<w.answer.length;i++){
            for (let j=0;j<p.word.length;j++){
              if (w.answer[i]!==p.word[j]) continue;
              let row,col,dir;
              if (p.dir==='across'){ dir='down'; row=p.row-i; col=p.col+j; }
              else { dir='across'; row=p.row+j; col=p.col-i; }
              const score = canPlace(w.answer,row,col,dir);
              if (score!==null) candidates.push({row,col,dir,score});
            }
          }
        }
        if (candidates.length){
          candidates.sort((a,b)=>b.score-a.score);
          const top = candidates.filter(c=>c.score===candidates[0].score);
          const choice = top[Math.floor(Math.random()*top.length)];
          place(w.answer, choice.row, choice.col, choice.dir);
          unplaced.splice(idx,1); idx--; progressed=true;
        }
      }
    }
    placed.forEach(p=>{ p.clue = (wordList.find(w=>w.answer===p.word)||{}).clue || ''; });
    const score = placed.length*1000 - unplaced.length*500;
    if (!best || score>best.score) best = { grid, placed, unplaced, score };
    if (!unplaced.length) break;
  }
  let minR=99,maxR=-1,minC=99,maxC=-1;
  best.placed.forEach(p=>{
    for (let k=0;k<p.word.length;k++){
      const r=p.dir==='across'?p.row:p.row+k, c=p.dir==='across'?p.col+k:p.col;
      minR=Math.min(minR,r); maxR=Math.max(maxR,r); minC=Math.min(minC,c); maxC=Math.max(maxC,c);
    }
  });
  const rows=maxR-minR+1, cols=maxC-minC+1;
  const cellLetter = {};
  best.placed.forEach(p=>{
    p.row-=minR; p.col-=minC;
    for (let k=0;k<p.word.length;k++){
      const r=p.dir==='across'?p.row:p.row+k, c=p.dir==='across'?p.col+k:p.col;
      cellLetter[r+','+c]=p.word[k];
    }
  });
  let num=1; const numberOf={};
  for (let r=0;r<rows;r++) for (let c=0;c<cols;c++){
    if (!cellLetter[r+','+c]) continue;
    const sa = !cellLetter[r+','+(c-1)] && cellLetter[r+','+(c+1)];
    const sd = !cellLetter[(r-1)+','+c] && cellLetter[(r+1)+','+c];
    if (sa||sd) numberOf[r+','+c] = num++;
  }
  best.placed.forEach(p=> p.number = numberOf[p.row+','+p.col]);
  return { rows, cols, cellLetter, placed: best.placed, numberOf };
}

let cwLayout = null, cwInputs = {};
function renderCrosswordTool(holder){
  const chapters = allChapters();

    cwInputs = {};
    for (let r=0;r<cwLayout.rows;r++) for (let c=0;c<cwLayout.cols;c++){
      const key=r+','+c, letter=cwLayout.cellLetter[key];
      if (!letter) g += '<div class="cw-cell blocked"></div>';
      else {
        g += '<div class="cw-cell">'+(cwLayout.numberOf[key]?'<span class="cw-number">'+cwLayout.numberOf[key]+'</span>':'')+'<input maxlength="1" data-r="'+r+'" data-c="'+c+'"></div>';
      }
    }
    g += '</div><div class="cw-clues">';
    const across = cwLayout.placed.filter(p=>p.dir==='across').sort((a,b)=>a.number-b.number);
    const down = cwLayout.placed.filter(p=>p.dir==='down').sort((a,b)=>a.number-b.number);
    g += '<h5>Across</h5><ol>'+across.map(p=>'<li>'+p.number+'. '+escapeHtml(p.clue)+'</li>').join('')+'</ol>';

    area.innerHTML = g;
    area.querySelectorAll('input').forEach(inp=>{
      cwInputs[inp.dataset.r+','+inp.dataset.c] = inp;
      inp.addEventListener('input', (e)=>{
        e.target.value = e.target.value.toUpperCase().replace(/[^A-Z]/g,'');
        e.target.classList.remove('correct','incorrect');
        if (e.target.value){
          const r=parseInt(inp.dataset.r,10), c=parseInt(inp.dataset.c,10);
          const nr = cwInputs[r+','+(c+1)] || cwInputs[(r+1)+','+c];
          if (nr) nr.focus();
        }
      });
    });
  }
  document.getElementById('cwChapterSelect').onchange = build;
  document.getElementById('cwNew').onclick = build;
  document.getElementById('cwCheck').onclick = ()=>{
    Object.keys(cwInputs).forEach(key=>{
      const inp = cwInputs[key]; const correct = cwLayout.cellLetter[key];
      inp.classList.remove('correct','incorrect');
      if (!inp.value) return;
      inp.classList.add(inp.value===correct?'correct':'incorrect');
    });
  };
  document.getElementById('cwReveal').onclick = ()=>{
    Object.keys(cwInputs).forEach(key=>{ cwInputs[key].value = cwLayout.cellLetter[key]; cwInputs[key].classList.remove('incorrect'); cwInputs[key].classList.add('correct'); });
  };
  build();
}

function launchMiniGame(key, area){
  area.innerHTML = '<button class="btn" id="backToGames" style="margin-bottom:14px">\u2190 Back to games</button><div id="gameInner"></div>';
  document.getElementById('backToGames').onclick = ()=>{ area.innerHTML=''; };

  if (key==='matching') runMatchEngine(inner, shuffle(allConcepts().filter(c=>c.tier==='must_know').map(c=>c.id)).slice(0,6), 6);
  else if (key==='speedround') runQuizEngine(inner, shuffle(SEED_CONTENT.quiz), { mode:'practice', logMode:'speedround', title:'Speed Round Results', timeLimitTotal:60 });
  else if (key==='whoami') runWhoAmI(inner);
  else if (key==='fillgap') runFillTheGap(inner);
  else if (key==='orderit') runOrderIt(inner);
  else if (key==='twotruths'){
    const qs = SEED_CONTENT.quiz.filter(q=>q.type==='two_truths_trap');
    runQuizEngine(inner, qs.length?qs:SEED_CONTENT.quiz.slice(0,3), { mode:'practice', logMode:'twotruths', title:'Two Truths and a Trap' });
  }
  else if (key==='conceptsort') runConceptSort(inner);
  else if (key==='connections') runConceptConnections(inner);
  else if (key==='scenario'){
    const qs = SEED_CONTENT.quiz.filter(q=>q.type==='scenario');
    runQuizEngine(inner, qs.length?qs:SEED_CONTENT.quiz.slice(0,3), { mode:'practice', logMode:'scenario', title:'Scenario Challenge' });
  }
  else if (key==='bossbattle'){
    const pool = SEED_CONTENT.quiz.filter(q=>q.difficulty==='hard'||q.difficulty==='exam');
    runQuizEngine(inner, shuffle(pool.length?pool:SEED_CONTENT.quiz), { mode:'practice', logMode:'bossbattle', title:'Boss Battle Results' });
  }
}

function runWhoAmI(holder){
  const items = shuffle(SEED_CONTENT.miniGames.whoAmI);
  const state = { idx:0, clueIdx:0, score:0 };
  function render(){
    if (state.idx>=items.length){ holder.innerHTML = finalScoreHtml(state.score, items.length); return; }
    const item = items[state.idx];
    const correct = getConcept(item.concept);
    const distractors = shuffle(allConcepts().filter(c=>c.id!==correct.id)).slice(0,3);
    const options = shuffle([correct].concat(distractors));
    let html = '<div class="quiz-card"><div class="quiz-top"><span>Item '+(state.idx+1)+' of '+items.length+'</span><span>Score: '+state.score+'</span></div>';
    html += '<div class="quiz-prompt">Who am I?</div>';
    for (let i=0;i<=state.clueIdx;i++) html += '<p style="font-size:.9rem;color:var(--text-secondary)">Clue '+(i+1)+': '+escapeHtml(item.clues[i])+'</p>';
    if (state.clueIdx < item.clues.length-1) html += '<button class="btn" id="nextClueBtn">Show next clue</button>';
    html += '<div style="margin-top:14px">';
    options.forEach(o=> html += '<button class="quiz-opt" data-g="'+o.id+'">'+escapeHtml(o.term)+'</button>');
    html += '</div></div>';
    holder.innerHTML = html;
    const ncb = document.getElementById('nextClueBtn'); if (ncb) ncb.onclick = ()=>{ state.clueIdx++; render(); };
    holder.querySelectorAll('[data-g]').forEach(b=> b.onclick = ()=>{
      const isCorrect = b.dataset.g === correct.id;
      if (isCorrect) state.score++;
      recordQuizAttempt({ concept:correct.id, correct:isCorrect, difficulty:'medium', lo:correct.lo, mode:'whoami' });
      holder.querySelectorAll('[data-g]').forEach(x=>{ x.disabled=true; if (x.dataset.g===correct.id) x.classList.add('correct'); else if (x===b) x.classList.add('incorrect'); });
      setTimeout(()=>{ state.idx++; state.clueIdx=0; render(); }, 900);
    });
  }
  render();
}

function runFillTheGap(holder){
  const items = shuffle(SEED_CONTENT.miniGames.fillTheGap);
  const state = { idx:0, score:0 };
  function render(){
    if (state.idx>=items.length){ holder.innerHTML = finalScoreHtml(state.score, items.length); return; }
    const item = items[state.idx];
    let html = '<div class="quiz-card"><div class="quiz-top"><span>Item '+(state.idx+1)+' of '+items.length+'</span><span>Score: '+state.score+'</span></div>';
    html += '<div class="quiz-prompt">'+escapeHtml(item.text)+'</div>';
    html += '<input type="text" class="quiz-input" id="gapInput" placeholder="Type the missing word">';
    html += '<button class="btn primary" id="gapSubmit">Submit</button><div id="gapFeedback"></div></div>';
    holder.innerHTML = html;
    document.getElementById('gapSubmit').onclick = ()=>{
      const val = document.getElementById('gapInput').value.trim().toLowerCase();
      const isCorrect = val === item.answer.toLowerCase();
      if (isCorrect) state.score++;
      recordQuizAttempt({ concept:item.concept, correct:isCorrect, difficulty:'medium', lo:getConcept(item.concept).lo, mode:'fillgap' });
      document.getElementById('gapFeedback').innerHTML = '<div class="quiz-feedback '+(isCorrect?'correct':'incorrect')+'">'+(isCorrect?'Correct!':'The answer was: '+escapeHtml(item.answer))+'</div><button class="btn primary" id="gapNext" style="margin-top:10px">Next \u2192</button>';
      document.getElementById('gapNext').onclick = ()=>{ state.idx++; render(); };
    };
  }
  render();
}

function runOrderIt(holder){
  const sequences = shuffle(SEED_CONTENT.miniGames.orderIt);
  const state = { idx:0, picked:[], remaining:[] };
  function setup(){ state.picked=[]; state.remaining = shuffle(sequences[state.idx].steps.map((s,i)=>({step:s, correctPos:i}))); }
  setup();
  function render(){
    if (state.idx>=sequences.length){ holder.innerHTML = '<p style="color:var(--text-faint)">Nice work \u2014 you\u2019ve been through all the sequences.</p>'; return; }
    const seq = sequences[state.idx];
    let html = '<div class="quiz-card"><div class="quiz-prompt">'+escapeHtml(seq.name)+'</div><p style="font-size:.82rem;color:var(--text-faint)">Click steps in the correct order.</p>';
    html += '<div class="orderit-list">';
    state.picked.forEach((p,i)=> html += '<div class="orderit-item picked"><span class="orderit-slot">'+(i+1)+'</span>'+escapeHtml(p.step)+'</div>');
    state.remaining.forEach(r=> html += '<div class="orderit-item" data-step="'+r.correctPos+'"><span class="orderit-slot">?</span>'+escapeHtml(r.step)+'</div>');
    html += '</div>';
    if (state.remaining.length===0){
      const correctOrder = state.picked.every((p,i)=> p.correctPos===i);
      html += '<div class="quiz-feedback '+(correctOrder?'correct':'incorrect')+'" style="margin-top:14px">'+(correctOrder?'Correct order!':'Not quite the right order \u2014 review the sequence and try the next one.')+'</div>';
      html += '<button class="btn primary" id="oiNext" style="margin-top:10px">Next sequence \u2192</button>';
    }
    html += '</div>';
    holder.innerHTML = html;
    holder.querySelectorAll('[data-step]').forEach(el=> el.onclick = ()=>{
      const pos = parseInt(el.dataset.step,10);
      const item = state.remaining.find(r=>r.correctPos===pos);
      state.remaining = state.remaining.filter(r=>r!==item);
      state.picked.push(item);
      render();
    });
    const nb = document.getElementById('oiNext'); if (nb) nb.onclick = ()=>{ state.idx++; setup(); render(); };
  }
  render();
}

function runConceptSort(holder){
  let cats;
  if (allChapters().length >= 2){
    cats = allChapters().map(ch=>({ id:ch.id, label:'Ch. '+ch.number+': '+ch.title, concepts: conceptsForChapter(ch.id).map(c=>c.id) }));
  } else {
    cats = SEED_CONTENT.miniGames.conceptSortCategories;
  }
  const items = shuffle(cats.flatMap(cat=> cat.concepts.map(cid=>({cid, catId:cat.id}))));
  const state = { idx:0, score:0 };
  function render(){
    if (state.idx>=items.length){ holder.innerHTML = finalScoreHtml(state.score, items.length); return; }
    const item = items[state.idx];
    const concept = getConcept(item.cid);
    if (!concept){ state.idx++; render(); return; }
    let html = '<div class="quiz-card"><div class="quiz-top"><span>Item '+(state.idx+1)+' of '+items.length+'</span><span>Score: '+state.score+'</span></div>';
    html += '<div class="quiz-prompt">Which category does <b>'+escapeHtml(concept.term)+'</b> belong to?</div>';
    cats.forEach(cat=> html += '<button class="quiz-opt" data-cat="'+cat.id+'">'+escapeHtml(cat.label)+'</button>');
    html += '</div>';
    holder.innerHTML = html;
    holder.querySelectorAll('[data-cat]').forEach(b=> b.onclick = ()=>{
      const isCorrect = b.dataset.cat === item.catId;
      if (isCorrect) state.score++;
      recordQuizAttempt({ concept:concept.id, correct:isCorrect, difficulty:'medium', lo:concept.lo, mode:'conceptsort' });
      holder.querySelectorAll('[data-cat]').forEach(x=>{ x.disabled=true; if (x.dataset.cat===item.catId) x.classList.add('correct'); else if (x===b) x.classList.add('incorrect'); });
      setTimeout(()=>{ state.idx++; render(); }, 700);
    });
  }
  render();
}

function runConceptConnections(holder){
  const items = shuffle(SEED_CONTENT.miniGames.conceptConnections);
  const state = { idx:0, score:0 };
  function render(){
    if (state.idx>=items.length){ holder.innerHTML = finalScoreHtml(state.score, items.length); return; }
    const item = items[state.idx];
    const promptC = getConcept(item.prompt), correctC = getConcept(item.correct);
    const options = shuffle([correctC].concat(item.distractors.map(getConcept)));
    let html = '<div class="quiz-card"><div class="quiz-top"><span>Item '+(state.idx+1)+' of '+items.length+'</span><span>Score: '+state.score+'</span></div>';
    html += '<div class="quiz-prompt">Which concept is most closely related to <b>'+escapeHtml(promptC.term)+'</b>?</div>';
    html += '<p style="font-size:.82rem;color:var(--text-secondary)">'+escapeHtml(promptC.definition)+'</p>';
    options.forEach(o=> html += '<button class="quiz-opt" data-cc="'+o.id+'">'+escapeHtml(o.term)+'</button>');
    html += '</div>';
    holder.innerHTML = html;
    holder.querySelectorAll('[data-cc]').forEach(b=> b.onclick = ()=>{
      const isCorrect = b.dataset.cc === correctC.id;
      if (isCorrect) state.score++;
      recordQuizAttempt({ concept:promptC.id, correct:isCorrect, difficulty:'hard', lo:promptC.lo, mode:'connections' });
      holder.querySelectorAll('[data-cc]').forEach(x=>{ x.disabled=true; if (x.dataset.cc===correctC.id) x.classList.add('correct'); else if (x===b) x.classList.add('incorrect'); });
      setTimeout(()=>{ state.idx++; render(); }, 900);
    });
  }
  render();
}

function finalScoreHtml(score,total){
  return '<div class="quiz-card"><div class="final-score"><div class="mono" style="color:var(--text-faint)">Final score</div><div class="fs-num">'+score+' / '+total+'</div></div></div>';
}

   ========================================================================= */
function renderStudySessionTool(holder){
  const state = { budget:null, plan:[], stepIdx:0 };
  function pickScreen(){
    let html = '<p style="color:var(--text-faint);font-size:.85rem;margin-bottom:12px">Pick a time budget and we\u2019ll build a mixed study plan.</p><div class="btn-row">';
    [10,20,30,45,60].forEach(m=> html += '<button class="btn" data-budget="'+m+'">'+m+' min</button>');
    html += '</div>';
    holder.innerHTML = html;
    holder.querySelectorAll('[data-budget]').forEach(b=> b.onclick = ()=>{ state.budget = parseInt(b.dataset.budget,10); buildPlan(); stepScreen(); });
  }
  function buildPlan(){
    const b = state.budget;
    state.plan = [
      { type:'weak', label:'Weak Review', minutes: Math.round(b*0.2) || 2 },
      { type:'flashcards', label:'Flashcards', minutes: Math.round(b*0.3) || 3 },
      { type:'quiz', label:'Quiz', minutes: Math.round(b*0.3) || 3 },
      { type:'minigame', label:'Mini Game', minutes: Math.round(b*0.1) || 1 },
      { type:'activerecall', label:'Active Recall', minutes: Math.round(b*0.1) || 1 }
    ];
    state.stepIdx = 0;
  }
  function stepScreen(){
    if (state.stepIdx >= state.plan.length){
      const totalMins = state.plan.reduce((s,p)=>s+p.minutes,0);
      logStudyMinutes(totalMins);
      holder.innerHTML = '<div class="final-score"><div class="mono" style="color:var(--text-faint)">Session complete</div><div class="fs-num">'+totalMins+' min</div><p>Logged toward your streak. Nice work.</p></div>';
      return;
    }
    const step = state.plan[state.stepIdx];
    const track = state.plan.map((p,i)=> (i<=state.stepIdx?'session-progress-fill':'')).length;
    let html = '<div class="session-progress-track"><div class="session-progress-fill" style="width:'+Math.round((state.stepIdx/state.plan.length)*100)+'%"></div></div>';
    html += '<div class="session-step"><h4>Step '+(state.stepIdx+1)+' of '+state.plan.length+': '+step.label+' (~'+step.minutes+' min)</h4><div id="sessionInner"></div>';
    html += '<div class="btn-row" style="margin-top:14px"><button class="btn primary" id="sessionDoneBtn">Done, Next Step \u2192</button></div></div>';
    holder.innerHTML = html;
    const inner = document.getElementById('sessionInner');
    if (step.type==='weak'){
      const w = weakConcepts(1).slice(0,5);
      inner.innerHTML = w.length ? ('<div class="concept-grid">'+w.map(x=>'<div class="concept-card"><h5>'+escapeHtml(x.concept.term)+'</h5><p>'+escapeHtml(x.concept.definition)+'</p></div>').join('')+'</div>') : '<p style="color:var(--text-faint)">No weak areas yet \u2014 skip ahead.</p>';
    } else if (step.type==='flashcards'){
      flashState.filter='all'; flashState.chapter='all'; flashState.order = shuffle(flashDeck().map(c=>c.id)); flashState.pos=0; flashState.flipped=false;
      renderFlashcardsTool(inner);
    } else if (step.type==='quiz'){
      runQuizEngine(inner, shuffle(SEED_CONTENT.quiz).slice(0,5), { mode:'practice', logMode:'session', title:'Session Quiz' });
    } else if (step.type==='minigame'){
      runWhoAmI(inner);
    } else if (step.type==='activerecall'){
      renderActiveRecallTool(inner);
    }
    document.getElementById('sessionDoneBtn').onclick = ()=>{ state.stepIdx++; stepScreen(); };
  }
  pickScreen();
}

function chapterVocabList(chapterId){
  return conceptsForChapter(chapterId).slice().sort((a,b)=>a.term.localeCompare(b.term));
}
function openConceptModal(conceptId){
  const c = getConcept(conceptId);
  if (!c) return;
  const acc = conceptAccuracy(c.id);
  const vocabList = chapterVocabList(c.chapterId);
  const idx = vocabList.findIndex(v=>v.id===c.id);
  let html = '<button class="modal-close" id="closeConceptModal">\u00d7</button>';
  html += '<div style="margin-bottom:10px"><span class="chip" style="background:var(--bg-panel);color:var(--text-secondary)">'+c.tier.replace('_',' ')+'</span>';
  html += '<span class="chip" style="background:'+loTintVar(c.lo)+';color:'+loColorVar(c.lo)+'">LO '+c.lo+'</span>';
  if (acc) html += '<span class="chip" style="background:var(--bg-panel);color:var(--text-secondary)">Your accuracy: '+acc.pct+'% ('+acc.correct+'/'+acc.total+')</span>';
  html += '</div><h3 style="margin-bottom:14px">'+escapeHtml(c.term)+'</h3>';
  if (c.formula) html += '<div class="formula"><span class="f-label">Formula</span>'+escapeHtml(c.formula)+'</div>';
  const fields = [
    ['Definition', c.definition], ['Plain-English Explanation', c.plain], ['Why It Matters', c.why],
    ['Easy-to-Remember Example', c.example], ['Textbook Example', c.textbookExample],
    ['Common Mistake/Confusion', c.commonMistake], ['Memory Trick', c.mnemonic], ['Possible Exam Question', c.examQuestion]
  ];
  fields.forEach(([label,val])=>{
    if (val) html += '<div class="modal-field"><div class="mf-label">'+label+'</div><div class="mf-body">'+escapeHtml(val)+'</div></div>';
  });
  html += '<div class="btn-row" style="margin-top:16px">'+
    '<button class="btn good" id="cmKnow">Know It</button>'+
    '<button class="btn bad" id="cmDifficult">Mark Difficult</button>'+
    '<button class="btn" id="cmStar">'+(PROGRESS.flashcardStatus[c.id]==='starred'?'\u2605 Starred':'\u2606 Star')+'</button>'+
    '<button class="btn primary" id="cmGoto">Go to this section</button></div>';
  if (vocabList.length > 1){
    const chLabel = getChapter(c.chapterId).number;
    html += '<div class="vocab-nav-row"><button class="btn" id="cmPrev">\u2190 Previous term</button>'+
      '<span class="vn-pos">Ch. '+chLabel+' vocab \u00b7 '+(idx+1)+' / '+vocabList.length+'</span>'+
      '<button class="btn" id="cmNext">Next term \u2192</button></div>';
  }
  document.getElementById('conceptModalBox').innerHTML = html;
  document.getElementById('conceptModalOverlay').classList.add('open');
  document.getElementById('closeConceptModal').onclick = closeConceptModal;
  document.getElementById('cmKnow').onclick = ()=>{ setFlashcardStatus(c.id,'know'); closeConceptModal(); };
  document.getElementById('cmDifficult').onclick = ()=>{ setFlashcardStatus(c.id,'difficult'); closeConceptModal(); };
  document.getElementById('cmStar').onclick = ()=>{ setFlashcardStatus(c.id, PROGRESS.flashcardStatus[c.id]==='starred'?null:'starred'); openConceptModal(c.id); };
  document.getElementById('cmGoto').onclick = ()=>{ closeConceptModal(); switchMode('study'); setTimeout(()=>jumpToLO(c.lo),40); };
  const pb = document.getElementById('cmPrev');
  const nb = document.getElementById('cmNext');
  if (pb) pb.onclick = ()=> openConceptModal(vocabList[(idx-1+vocabList.length)%vocabList.length].id);
  if (nb) nb.onclick = ()=> openConceptModal(vocabList[(idx+1)%vocabList.length].id);
}

document.getElementById('openSettings').addEventListener('click', openSettingsModal);

/* =========================================================================
   ASK THE BOOK (local textbook search assistant — no external AI)
   ========================================================================= */
const STOPWORDS = new Set(['a','an','the','is','are','was','were','be','been','to','of','in','on','for','and','or',
  'what','whats',"what's",'why','how','who','does','do','did','it','this','that','these','those','with','as','at',
  'by','from','about','tell','me','explain','define','definition','describe','can','you','please','mean','means']);
function tokenize(text){
  return (text||'').toLowerCase().replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(t=>t.length>1 && !STOPWORDS.has(t));
}
function stripHtmlTags(html){ return (html||'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim(); }

let ASK_CORPUS = null;
function buildAskCorpus(){
  const items = [];
  allConcepts().forEach(c=>{
    const text = [c.term,c.definition,c.plain,c.why,c.example,c.textbookExample].filter(Boolean).join(' ');
    items.push({ type:'concept', id:c.id, chapterId:c.chapterId, lo:c.lo, label:c.term, tokens:tokenize(text), termTokens:tokenize(c.term) });
  });
  Object.keys(SEED_CONTENT.loProse).forEach(loCode=>{
    const concept0 = SEED_CONTENT.concepts.find(c=>c.lo===loCode);
    const chapterId = concept0 ? concept0.chapterId : null;
    SEED_CONTENT.loProse[loCode].forEach(sec=>{
      const text = sec.heading+' '+stripHtmlTags(sec.html);
      items.push({ type:'section', chapterId, lo:loCode, label:sec.heading, excerpt:stripHtmlTags(sec.html).slice(0,220), tokens:tokenize(text), termTokens:tokenize(sec.heading) });
    });
  });
  return items;
}
function askTheBook(query){
  if (!ASK_CORPUS) ASK_CORPUS = buildAskCorpus();
  if (!TERM_INDEX) TERM_INDEX = buildTermIndex();

  let cleaned = query.toLowerCase().replace(/[?.!]/g,'').trim();
  const stripPatterns = [/^what is (a |an |the )?/,/^what are (a |an |the )?/,/^what does (a |an |the )?/,
    /^define /,/^explain /,/^who (is|are) /,/^tell me about /,/^describe /];
  for (const p of stripPatterns){ if (p.test(cleaned)){ cleaned = cleaned.replace(p,'').trim(); break; } }
  const directId = TERM_INDEX[normalizeTermKey(cleaned)];
  if (directId){
    const c = getConcept(directId);
    return { kind:'concept', concept:c };
  }

  const qTokens = tokenize(query);
  if (!qTokens.length) return { kind:'none' };
  let best = null, bestScore = 0;
  ASK_CORPUS.forEach(item=>{
    let score = 0;
    qTokens.forEach(t=>{
      if (item.termTokens.includes(t)) score += 3;
      else if (item.tokens.includes(t)) score += 1;
    });
    if (score > bestScore){ bestScore = score; best = item; }
  });
  if (!best || bestScore < 2) return { kind:'none' };
  if (best.type === 'concept') return { kind:'concept', concept:getConcept(best.id) };
  return { kind:'section', chapterId:best.chapterId, lo:best.lo, label:best.label, excerpt:best.excerpt };
}

function abAppendMessage(role, html){
  const box = document.getElementById('abMessages');
  const div = document.createElement('div');
  div.className = 'ab-msg '+role;
  div.innerHTML = html;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
  return div;
}
function abAnswer(query){
  const result = askTheBook(query);
  if (result.kind === 'concept'){
    const c = result.concept;
    let html = '<span class="ab-term">'+escapeHtml(c.term)+'</span>'+escapeHtml(c.definition);
    if (c.plain) html += '<br><br><i>In plain terms:</i> '+escapeHtml(c.plain);
    html += '<br><button class="ab-jump" data-jump-lo="'+c.lo+'" data-jump-concept="'+c.id+'">Open full details \u2192</button>';
    const msgEl = abAppendMessage('bot', html);
    msgEl.querySelector('[data-jump-concept]').onclick = ()=>{ openConceptModal(c.id); };
  } else if (result.kind === 'section'){
    let html = '<span class="ab-term">'+escapeHtml(result.label)+'</span>'+escapeHtml(result.excerpt)+'\u2026';
    html += '<br><button class="ab-jump" data-jump-lo="'+result.lo+'">Read this section \u2192</button>';
    const msgEl = abAppendMessage('bot', html);
    msgEl.querySelector('[data-jump-lo]').onclick = ()=>{
      document.getElementById('askBookPanel').classList.remove('open');
      switchMode('study'); setTimeout(()=>jumpToLO(result.lo), 40);
    };
  } else {
    abAppendMessage('bot', 'I couldn\u2019t find a confident match for that in this course\u2019s content. Try rephrasing with a specific term (e.g. "what is derived demand?"), or use the sidebar search / glossary tables to browse.');
  }
}
function initAskBook(){
  const btn = document.getElementById('askBookBtn');
  const panel = document.getElementById('askBookPanel');
  const input = document.getElementById('abInput');
  btn.onclick = ()=>{
    panel.classList.toggle('open');
    if (panel.classList.contains('open') && !document.getElementById('abMessages').children.length){
      abAppendMessage('bot', 'Ask me about any term or concept from your chapters \u2014 I\u2019ll search the actual textbook content in this app and point you to the right spot. I only know what\u2019s in this course, not the open web.');
    }
    if (panel.classList.contains('open')) setTimeout(()=>input.focus(), 50);
  };
  document.getElementById('abClose').onclick = ()=> panel.classList.remove('open');
  function submit(){
    const q = input.value.trim();
    if (!q) return;
    abAppendMessage('user', escapeHtml(q));
    input.value = '';
    setTimeout(()=> abAnswer(q), 150);
  }
  document.getElementById('abSend').onclick = submit;
  input.addEventListener('keydown', (e)=>{ if (e.key==='Enter') submit(); });
}

async function init(){
  await loadProgress();
  renderModeToggle();
  renderChapterTree();
  initSearch();
  initAskBook();
  refreshFooter();
  switchMode('dashboard');
}
init();
