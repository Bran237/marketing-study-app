      { heading:'Perception: Making Sense of a Crowded World', html:'<p><span class="term">Perception</span> is the process of selecting, organizing, and interpreting information into a meaningful picture of the world. <span class="term">Selective perception</span> filters this via <span class="term">selective exposure</span> (attending only to consistent messages), <span class="term">selective comprehension</span> (interpreting info to match existing beliefs), and <span class="term">selective retention</span> (forgetting most information soon after exposure). <span class="term">Subliminal perception</span> refers to messages received without conscious awareness \u2014 its effects on behavior remain scientifically debated.</p><div class="example"><span class="ex-label">Textbook example</span>Toro\u2019s "Snow Pup" was seen as a toy until renamed "Snow Master" \u2014 a textbook case of selective comprehension.</div><p><span class="term">Perceived risk</span> is the anxiety felt because a consumer can\u2019t anticipate a purchase\u2019s outcome but believes negative consequences might occur. Companies reduce it through seals of approval, endorsements, free trials, and warranties like Kia\u2019s 10-year powertrain warranty.</p>' },
      { heading:'Learning and Brand Loyalty', html:'<p><span class="term">Learning</span> results from repeated experience and reasoning. <span class="term">Behavioral learning</span> builds automatic responses through drive, cue, response, and reinforcement. <span class="term">Stimulus generalization</span> extends a response across similar stimuli (Tylenol Cold & Flu, Tylenol PM under one brand name); <span class="term">stimulus discrimination</span> is telling stimuli apart. <span class="term">Cognitive learning</span> happens through thinking and observing outcomes without direct experience.</p><p><span class="term">Brand loyalty</span> \u2014 a favorable attitude toward and consistent purchase of one brand over time \u2014 results from this learning and underlies routine problem solving.</p>' },
      { heading:'Attitudes, Beliefs, and Lifestyle', html:'<p>An <span class="term">attitude</span> is a learned predisposition to respond favorably or unfavorably to something, shaped by values and <span class="term">beliefs</span> \u2014 a consumer\u2019s subjective perception of how a brand performs on an attribute. <span class="term">Lifestyle</span> is a mode of living defined by how people spend time and resources; <span class="term">psychographics</span> combines psychology, lifestyle, and demographics, and <span class="term">VALS</span> segments consumers into eight types \u2014 Thinkers, Believers, Achievers, Strivers, Experiencers, Makers, Innovators, and Survivors \u2014 based on motivation and resources.</p>' }
    ],

    '4.4': [
      { heading:'Personal Influence: Opinion Leaders and Word of Mouth', html:'<p><span class="term">Opinion leaders</span> exert direct or indirect social influence over others because they\u2019re seen as knowledgeable about particular products \u2014 about 10 percent of U.S. adults. <span class="term">Word of mouth</span> \u2014 influence spread through conversation \u2014 is considered the most powerful and authentic information source, with about 75 percent of brand conversations happening face-to-face. <span class="term">Influencer marketing</span> focuses on recruiting influencers to advocate brands, and popularity generated this way is called <span class="term">buzz</span>.</p>' },
      { heading:'Reference Groups and Brand Communities', html:'<p><span class="term">Reference groups</span> are people used as a basis for self-appraisal, especially influential for visible or luxury products. Types include an <span class="term">associative group</span> (belong to), a <span class="term">dissociative group</span> (want distance from), and an <span class="term">aspiration group</span> (want to join). A <span class="term">brand community</span> is a specialized group with structured relationships around a brand, like the Harley Owners Group. Companies track relationship health with the <span class="term">Net Promoter Score (NPS)</span> = % Promoters \u2212 % Detractors.</p>' },
      { heading:'Social Class and Family', html:'<p><span class="term">Social class</span> \u2014 relatively permanent divisions based on occupation, income source, and education \u2014 shapes lifestyle and media use. Family shapes behavior through <span class="term">consumer socialization</span> (how children learn to be consumers) and the <span class="term">family life cycle</span> \u2014 phases from young single through married and older stages, each with distinct buying patterns.</p><div class="chart-box"><svg viewBox="0 0 780 220" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow4b" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#98a2b3"/></marker></defs><g font-family="Public Sans, sans-serif" font-size="10"><rect x="10" y="90" width="110" height="50" rx="8" fill="#e2685f" opacity="0.85"/><text x="65" y="120" text-anchor="middle" fill="#1a0605" font-weight="700">Young single</text><rect x="150" y="90" width="130" height="50" rx="8" fill="#e2685f" opacity="0.85"/><text x="215" y="115" text-anchor="middle" fill="#1a0605" font-weight="700" font-size="9">Young married,</text><text x="215" y="127" text-anchor="middle" fill="#1a0605" font-weight="700" font-size="9">no children</text><rect x="310" y="90" width="130" height="50" rx="8" fill="#e2685f" opacity="0.85"/><text x="375" y="115" text-anchor="middle" fill="#1a0605" font-weight="700" font-size="9">Young married,</text><text x="375" y="127" text-anchor="middle" fill="#1a0605" font-weight="700" font-size="9">with children</text><rect x="470" y="90" width="140" height="50" rx="8" fill="#e2685f" opacity="0.85"/><text x="540" y="115" text-anchor="middle" fill="#1a0605" font-weight="700" font-size="9">Middle-aged married,</text><text x="540" y="127" text-anchor="middle" fill="#1a0605" font-weight="700" font-size="9">with/without children</text><rect x="640" y="90" width="130" height="50" rx="8" fill="#e2685f" opacity="0.85"/><text x="705" y="115" text-anchor="middle" fill="#1a0605" font-weight="700" font-size="9">Older married</text><text x="705" y="127" text-anchor="middle" fill="#1a0605" font-weight="700" font-size="9">or unmarried</text><line x1="123" y1="115" x2="147" y2="115" stroke="#98a2b3" stroke-width="2" marker-end="url(#arrow4b)"/><line x1="283" y1="115" x2="307" y2="115" stroke="#98a2b3" stroke-width="2" marker-end="url(#arrow4b)"/><line x1="443" y1="115" x2="467" y2="115" stroke="#98a2b3" stroke-width="2" marker-end="url(#arrow4b)"/><line x1="613" y1="115" x2="637" y2="115" stroke="#98a2b3" stroke-width="2" marker-end="url(#arrow4b)"/><text x="390" y="30" text-anchor="middle" fill="#98a2b3" font-size="10">Traditional flow (divorced/recycled flows also occur at each stage)</text></g></svg><div class="chart-caption">Recreated from Figure 4-7: family life cycle stages and the traditional flow between them.</div></div>' },
      { heading:'Culture and Subculture', html:'<p><span class="term">Culture</span> is the set of values, ideas, and attitudes learned and shared among members of a group; <span class="term">subcultures</span> are subgroups within it. The three largest U.S. racial/ethnic subcultures \u2014 Hispanic/Latino, Black American, and Asian American \u2014 together account for two in five U.S. consumers.</p><div class="example"><span class="ex-label">Textbook example</span>Goya Foods markets different recipes to Puerto Rican and Mexican consumers, while Volkswagen had to change its "Drivers Wanted" slogan after it translated into Spanish as "chauffeurs wanted."</div>' }
    ],

    '5.1': [
      { heading:'Organizational Buyers and the Three Markets', html:'<p>Understanding organizational markets and buying behavior is a necessary prerequisite for effective <span class="term">business-to-business marketing</span> \u2014 the marketing of products and services to companies, governments, or nonprofit organizations for use in creating products and services they can produce and market to others. <span class="term">Organizational buyers</span> are those manufacturers, wholesalers, retailers, service companies, nonprofit organizations, and government agencies that buy products and services for their own use or for resale. Organizational buyers include all buyers in a nation except ultimate consumers, and because they often buy raw materials and parts, process them, and resell the upgraded product several times before it reaches a final buyer, their total annual purchases are far greater than those of ultimate consumers \u2014 IBM alone buys over $300 billion in products and services each year for its own use or resale.</p><p>Organizational buyers divide into three markets: industrial, reseller, and government.</p>' },
      { heading:'Industrial, Reseller, and Government Markets in Detail', html:'<p><span class="term">Industrial firms</span> in some way reprocess a product or service they buy before selling it again to the next buyer \u2014 true of Corning Inc., which transforms materials into optical fiber, and even of a bank that takes money from depositors, reprocesses it, and "sells" it as loans. Companies that primarily sell physical goods represent 25 percent of the roughly 7.5 million firms in the industrial market; service companies represent the other 75 percent.</p><p><span class="term">Resellers</span> \u2014 wholesalers and retailers that buy physical products and resell them again without any reprocessing \u2014 make up the reseller market, with over 1 million retailers and 250,000 wholesalers in the United States. <span class="term">Government units</span>, the federal, state, and local agencies that buy goods and services for the constituents they serve, make up the government market, with over 90,000 such units in the U.S.</p><table class="data-table"><tr><th>Organizational market</th><th>Approximate size</th><th>Defining behavior</th></tr><tr><td>Industrial market</td><td>7.5 million firms</td><td>Reprocesses a product or service before reselling it</td></tr><tr><td>Reseller market</td><td>1 million+ retailers, 250,000 wholesalers</td><td>Resells physical products without reprocessing</td></tr><tr><td>Government market</td><td>90,000+ units</td><td>Buys goods and services for its constituents</td></tr></table><div class="chart-caption">Measuring the three organizational markets in the United States.</div><div class="example"><span class="ex-label">Textbook example</span>NASA is paying Lockheed Martin $29.5 billion through 2030 to develop the Orion Multi-Purpose Crew Vehicle to explore asteroids and Mars \u2014 a single government-market purchase measured in the billions of dollars. The <span class="term">NAICS</span> system provides common industry definitions across Canada, Mexico, and the United States to help measure the size of markets like these.</div>' }
    ],

    '5.2': [
      { heading:'Organizations Buy Differently Than People Do', html:'<p>In both consumer and organizational buying, the objective is to solve the buyer\u2019s problem, but the unique objectives and policies of an organization put special constraints on how it makes buying decisions. Key characteristics fall into four groups.</p><table class="data-table"><tr><th>Characteristic</th><th>Typical dimensions</th></tr><tr><td>Market characteristics</td><td>Demand is derived; few customers exist, and purchase orders are large</td></tr><tr><td>Product/service characteristics</td><td>Technical, specification-driven; heavy emphasis on delivery, technical assistance, postsale service</td></tr><tr><td>Buying process characteristics</td><td>Professional buyers, formal policies, multiple buying influences, negotiation, and widespread online buying</td></tr><tr><td>Marketing mix characteristics</td><td>Direct selling is the rule; promotion is technical; price is often negotiated</td></tr></table><div class="chart-caption">Recreated from Figure 5-1: key characteristics and dimensions of organizational buying behavior.</div>' },
      { heading:'Demand, Order Size, and the Number of Buyers', html:'<p>Consumer demand is affected by price, availability, and personal taste. By comparison, industrial demand is <span class="term">derived demand</span> \u2014 driven by, or derived from, demand for consumer products and services. The size of an organizational purchase is also typically far larger than a consumer purchase \u2014 a single purchase can amount to millions or billions of dollars, so most organizations place purchasing policies on buyers, such as requiring competitive bids above a certain dollar amount.</p><div class="example"><span class="ex-label">Textbook example</span>The Boeing Company charges about $115 million for its "average" 737 commercial jetliner, $373 million for its 777, and $293 million for its 787 \u2014 purchases so large that they typically require review and approval from a vice president or even the company president.</div><p>Firms marketing to organizations are also often restricted to far fewer buyers than consumer marketers: Gulfstream Aerospace can sell its business jets to only a few thousand organizations worldwide, while Goodyear sells original equipment tires to fewer than 10 car manufacturers.</p>' },
      { heading:'Organizational Buying Objectives and Criteria', html:'<p>Buying objectives for business firms usually center on increasing profits by reducing costs or increasing revenues; for nonprofits and government agencies, objectives usually center on meeting the needs of the groups they serve. Many companies have also broadened their buying objectives to include supplier diversity, such as buying from racial or ethnic minority- and women-owned suppliers, and environmental sustainability.</p><p>In making a purchase, the buying organization weighs <span class="term">organizational buying criteria</span> \u2014 the objective attributes of a supplier\u2019s products and the capabilities of the supplier itself.</p><div class="chart-box"><svg viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg"><g font-family="Public Sans, sans-serif" font-size="10"><text x="150" y="28" text-anchor="end" fill="#98a2b3">Performance</text><rect x="160" y="15" width="288.0" height="18" fill="#e0964f"/><text x="456.0" y="28" fill="#f3ede2">80%</text><text x="150" y="54" text-anchor="end" fill="#98a2b3">Technical support</text><rect x="160" y="41" width="244.8" height="18" fill="#e0964f"/><text x="412.8" y="54" fill="#f3ede2">68%</text><text x="150" y="80" text-anchor="end" fill="#98a2b3">Ease of use</text><rect x="160" y="67" width="241.2" height="18" fill="#e0964f"/><text x="409.2" y="80" fill="#f3ede2">67%</text><text x="150" y="106" text-anchor="end" fill="#98a2b3">Ease of setup</text><rect x="160" y="93" width="226.8" height="18" fill="#e0964f"/><text x="394.8" y="106" fill="#f3ede2">63%</text><text x="150" y="132" text-anchor="end" fill="#98a2b3">Complete solution</text><rect x="160" y="119" width="216.0" height="18" fill="#e0964f"/><text x="384.0" y="132" fill="#f3ede2">60%</text><text x="150" y="158" text-anchor="end" fill="#98a2b3">Ruggedness</text><rect x="160" y="145" width="201.6" height="18" fill="#e0964f"/><text x="369.6" y="158" fill="#f3ede2">56%</text><text x="150" y="184" text-anchor="end" fill="#98a2b3">Customization ability</text><rect x="160" y="171" width="190.8" height="18" fill="#e0964f"/><text x="358.8" y="184" fill="#f3ede2">53%</text><text x="150" y="210" text-anchor="end" fill="#98a2b3">Price</text><rect x="160" y="197" width="172.8" height="18" fill="#e0964f"/><text x="340.8" y="210" fill="#f3ede2">48%</text><text x="150" y="236" text-anchor="end" fill="#98a2b3">Integration expertise</text><rect x="160" y="223" width="151.2" height="18" fill="#e0964f"/><text x="319.2" y="236" fill="#f3ede2">42%</text><text x="150" y="262" text-anchor="end" fill="#98a2b3">Full tool set</text><rect x="160" y="249" width="151.2" height="18" fill="#e0964f"/><text x="319.2" y="262" fill="#f3ede2">42%</text><text x="150" y="288" text-anchor="end" fill="#98a2b3">Speed</text><rect x="160" y="275" width="136.8" height="18" fill="#e0964f"/><text x="304.8" y="288" fill="#f3ede2">38%</text></g></svg><div class="chart-caption">Recreated from Figure 5-2: product and supplier selection criteria for buying machine vision equipment \u2014 price ranks among the least frequently mentioned.</div></div><p>Many organizational buyers now practice <span class="term">supplier development</span>, the deliberate effort to build relationships that shape a supplier\u2019s products, services, and capabilities to fit the buyer\u2019s needs \u2014 Deere &amp; Company employs supplier-development engineers who work full-time with suppliers to improve efficiency and quality.</p>' },
      { heading:'Buyer-Seller Relationships and Supply Partnerships', html:'<p>Organizational buying is more likely than consumer buying to involve complex, extended negotiations over delivery schedules, price, and warranties. <span class="term">Reciprocity</span> is an industrial buying practice in which two organizations agree to purchase each other\u2019s products and services \u2014 a practice the U.S. Justice Department disapproves of because it restricts the free market. Long-term contracts are also common; buyer-seller relationships can evolve further into a <span class="term">supply partnership</span>, which exists when a buyer and its supplier adopt mutually beneficial objectives and procedures for lowering cost or increasing value.</p><div class="example"><span class="ex-label">Textbook example</span>Milsco Manufacturing has designed and manufactured Harley-Davidson motorcycle seats since 1934 \u2014 a classic, decades-long supply partnership. Many companies also now practice <span class="term">sustainable procurement</span>, integrating environmental considerations into every stage of the buying process, as Starbucks does by paying coffee farmers fairly and investing in the farming communities where its coffee is grown.</div>' }
    ],

    '5.3': [
      { heading:'The Organizational Buying Process', html:'<p><span class="term">Organizational buying behavior</span> is the decision-making process organizations use to establish the need for products and services and to identify, evaluate, and choose among alternative brands and suppliers. The same five stages that apply to a consumer purchase also apply to organizational purchases \u2014 but comparing the two columns below reveals key differences: more individuals get involved, supplier capability matters more, and postpurchase evaluation is far more formal.</p><table class="data-table"><tr><th>Stage</th><th>Consumer: smartphone for a student</th><th>Organizational: earbud headset for a smartphone</th></tr><tr><td>Problem recognition</td><td>Student wants a new smartphone</td><td>Marketing research and engineers decide to improve earbud headsets on new models</td></tr><tr><td>Information search</td><td>Personal experience, friends, ads, reviews</td><td>Design and production engineers draft specifications; purchasing identifies suppliers</td></tr><tr><td>Alternative evaluation</td><td>Compares phones on desired attributes at several stores</td><td>Purchasing and engineering assess facilities, capacity, quality control, and financial status</td></tr><tr><td>Purchase decision</td><td>Selects a brand, pays, leaves the store</td><td>Uses quality, price, delivery, and technical capability to select a supplier and award a contract</td></tr><tr><td>Postpurchase behavior</td><td>May return the phone if unsatisfactory</td><td>Evaluates suppliers with a formal vendor-rating system; drops suppliers that don\u2019t meet standards</td></tr></table><div class="chart-caption">Recreated from Figure 5-3: comparing the stages in a consumer and an organizational purchase decision process.</div>' },
      { heading:'The Buying Center: Who\u2019s Really Involved', html:'<p>For routine, low-dollar purchases, a single buyer often decides alone. For bigger decisions, a <span class="term">buying center</span> \u2014 a group of individuals who share common goals, risks, and knowledge important to a purchase \u2014 gets involved instead. For large multistore chain retailers like Target and 7-Eleven, this group is highly formalized as a <span class="term">buying committee</span>; most industrial firms and government units use informal groups instead. Researchers have identified five roles a person can play: <span class="term">users</span> (who actually use the product), <span class="term">influencers</span> (who help define specifications), buyers (who have formal authority to select suppliers and negotiate), <span class="term">deciders</span> (who have the power to approve the supplier), and <span class="term">gatekeepers</span> (who control the flow of information to the group). Typically 6 to 10 individuals make up a buying center, and the same person may play more than one role.</p>' },
      { heading:'Buying Situations and the Buying Center', html:'<p>The number of people in a buying center largely depends on the specific <span class="term">buy classes</span>, which range from a routine reorder to a completely new purchase.</p><table class="data-table"><tr><th>Buying center dimension</th><th>New buy</th><th>Straight rebuy</th><th>Modified rebuy</th></tr><tr><td>People involved</td><td>Many</td><td>One</td><td>Two to three</td></tr><tr><td>Decision time</td><td>Long</td><td>Short</td><td>Moderate</td></tr><tr><td>Problem definition</td><td>Uncertain</td><td>Well-defined</td><td>Minor modifications</td></tr><tr><td>Suppliers considered</td><td>New/present</td><td>Present</td><td>Present</td></tr></table><div class="chart-caption">Recreated from Figure 5-4: the buying situation affects buying center behavior in different ways.</div><p>In a <span class="term">new buy</span>, the organization is a first-time buyer, so the buying center enlarges to include everyone with a stake in the decision \u2014 BMW\u2019s multimillion-dollar cloud data system purchase from IBM is a new buy. In a <span class="term">straight rebuy</span>, the buyer reorders from the list of acceptable suppliers, probably without checking with users or influencers \u2014 office supplies are usually handled this way. In a <span class="term">modified rebuy</span>, the item is largely the same, but the buying center enlarges because someone wants to change the specifications, price, delivery schedule, or supplier.</p>' }
    ],

    '5.4': [
      { heading:'Why Online Buying Dominates B2B', html:'<p>Organizational buyers dwarf consumers in online transactions made, average transaction size, and overall purchase volume, accounting for about 70 percent of the global dollar value of all online transactions. Three reasons explain this: buyers depend on timely supplier information conveyed quickly online; digital technology substantially reduces the cost of a purchase transaction, such as General Electric cutting a transaction from $50\u2013$100 down to about $5; and online buying reduces marketing costs while broadening the potential customer base.</p>' },
      { heading:'E-Marketplaces: Virtual Organizational Markets', html:'<p><span class="term">E-marketplaces</span> are online trading communities \u2014 also called B2B exchanges or e-hubs \u2014 that bring together buyer and supplier organizations for the real-time exchange of information, money, products, and services. <span class="term">Independent e-marketplaces</span> act as a neutral third party, providing a centralized trading platform for a fee; examples include Amazon Business, PlasticsNet, Hospital Network.com, and TextileWeb. <span class="term">Private exchanges</span> instead link one large company to its own network of qualified suppliers and customers \u2014 Neogrid connects more than 250 retail customers with 80,000 suppliers, including Best Buy, Campbell Soup, Costco, and Walgreens.</p><div class="example"><span class="ex-label">Textbook example</span>eBay offers a trading platform for 6 million small businesses in the United States; 82 percent of small businesses using eBay report it helped their business grow, and 79 percent say it helped their business become more profitable.</div>' },
      { heading:'Online Auctions: Traditional vs. Reverse', html:'<p>In a <span class="term">traditional auction</span>, one seller lists an item and would-be buyers bid against each other, pushing the price up as more buyers participate. In a <span class="term">reverse auction</span>, one buyer communicates a need and would-be suppliers bid against each other, pushing the price down as more suppliers participate \u2014 the auction ends when a single bidder "wins" the business with the lowest price.</p><div class="chart-box"><svg viewBox="0 0 620 220" xmlns="http://www.w3.org/2000/svg"><g font-family="Public Sans, sans-serif" font-size="10"><text x="140" y="20" text-anchor="middle" fill="#f3ede2" font-weight="700">Traditional auction</text><line x1="40" y1="170" x2="240" y2="170" stroke="#5f6774"/><line x1="40" y1="170" x2="40" y2="40" stroke="#5f6774"/><text x="20" y="110" fill="#98a2b3" transform="rotate(-90 20 110)">Price</text><text x="140" y="190" text-anchor="middle" fill="#98a2b3">Number of buyers</text><polyline points="45,160 90,150 135,125 180,90 225,50" fill="none" stroke="#5b8def" stroke-width="2.5"/><text x="380" y="20" text-anchor="middle" fill="#f3ede2" font-weight="700">Reverse auction</text><line x1="380" y1="170" x2="580" y2="170" stroke="#5f6774"/><line x1="380" y1="170" x2="380" y2="40" stroke="#5f6774"/><text x="360" y="110" fill="#98a2b3" transform="rotate(-90 360 110)">Price</text><text x="480" y="190" text-anchor="middle" fill="#98a2b3">Number of sellers</text><polyline points="385,50 430,90 475,125 520,150 565,160" fill="none" stroke="#e0964f" stroke-width="2.5"/></g></svg><div class="chart-caption">Recreated from Figure 5-5: buyer and seller participants and price behavior differ by auction type \u2014 traditional auctions push price up, reverse auctions push price down.</div></div><div class="example"><span class="ex-label">Textbook example</span>Nike has used a reverse auction to have advertising agencies submit bids for the company\u2019s multimillion-dollar advertising media program, specifically to reduce cost.</div>' }
    ],

    '7.1': [
      { heading:'Why Marketing Research Exists', html:'<p><span class="term">Marketing research</span> is the process of defining a marketing problem and opportunity, systematically collecting and analyzing information, and recommending actions. Marketing decisions are rarely obvious, and a wrong one can be extremely costly, so marketers conduct research to reduce \u2014 not eliminate \u2014 the risk of a bad decision. Formally, a <span class="term">decision</span> is a conscious choice from among two or more alternatives, and <span class="term">decision making</span> is simply the act of consciously choosing among those alternatives. Marketing research exists to make that choice a more informed one.</p><div class="example"><span class="ex-label">Case in point</span>Movie studios face this problem constantly: two blockbusters can look similar on paper, yet one earns over $2 billion and another loses over $100 million. Studios reduce that risk with title testing, concept testing, and test screenings \u2014 for example, renaming "A Man Called Ove" to "A Man Called Otto" and cutting "Titanic" from four hours to 194 minutes after screening feedback.</div>' },
      { heading:'The Kind of Problems Research Has to Solve', html:'<p>Good marketing research is genuinely difficult, for a few reasons the chapter highlights directly. First, when a firm develops a product completely new to the marketplace, there\u2019s no way to simply ask consumers if they\u2019ll buy something they\u2019ve never seen or imagined. Second, understanding why consumers buy certain products often requires answers to personal questions people may be reluctant to reveal honestly. Third, people don\u2019t always remember or report their own past purchases and intentions accurately, which makes it hard for research to reconstruct the real influence of past marketing actions. Overcoming these three challenges is what makes marketing research a discipline in its own right, rather than just "asking people what they think."</p>' }
    ],

    '7.2': [
      { heading:'Five Steps From Problem to Action', html:'<p>Marketers and researchers have tried to improve decision outcomes by using a more formal, structured process. The chapter lays out a five-step marketing research approach that leads from a vague problem all the way to a specific marketing action \u2014 and it feeds lessons learned back into future research.</p><div class="chart-box"><svg viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow1" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#98a2b3"/></marker></defs><g font-family="Public Sans, sans-serif"><rect x="10" y="40" width="150" height="110" rx="10" fill="#5b8def" opacity="0.85"/><text x="85" y="70" text-anchor="middle" fill="#04070d" font-size="13" font-weight="700">Step 1</text><text x="85" y="90" text-anchor="middle" fill="#04070d" font-size="11">Define the</text><text x="85" y="104" text-anchor="middle" fill="#04070d" font-size="11">problem</text><text x="85" y="128" text-anchor="middle" fill="#04070d" font-size="9">Objectives,</text><text x="85" y="140" text-anchor="middle" fill="#04070d" font-size="9">actions</text><rect x="190" y="40" width="150" height="110" rx="10" fill="#cf6fb4" opacity="0.85"/><text x="265" y="70" text-anchor="middle" fill="#04070d" font-size="13" font-weight="700">Step 2</text><text x="265" y="90" text-anchor="middle" fill="#04070d" font-size="11">Develop the</text><text x="265" y="104" text-anchor="middle" fill="#04070d" font-size="11">research plan</text><text x="265" y="128" text-anchor="middle" fill="#04070d" font-size="9">Constraints,</text><text x="265" y="140" text-anchor="middle" fill="#04070d" font-size="9">data, methods</text><rect x="370" y="40" width="150" height="110" rx="10" fill="#e0964f" opacity="0.85"/><text x="445" y="70" text-anchor="middle" fill="#04070d" font-size="13" font-weight="700">Step 3</text><text x="445" y="90" text-anchor="middle" fill="#04070d" font-size="11">Collect relevant</text><text x="445" y="104" text-anchor="middle" fill="#04070d" font-size="11">information</text><text x="445" y="128" text-anchor="middle" fill="#04070d" font-size="9">Secondary +</text><text x="445" y="140" text-anchor="middle" fill="#04070d" font-size="9">primary data</text><rect x="550" y="40" width="150" height="110" rx="10" fill="#4fbf94" opacity="0.85"/><text x="625" y="70" text-anchor="middle" fill="#04070d" font-size="13" font-weight="700">Step 4</text><text x="625" y="90" text-anchor="middle" fill="#04070d" font-size="11">Develop</text><text x="625" y="104" text-anchor="middle" fill="#04070d" font-size="11">findings</text><text x="625" y="128" text-anchor="middle" fill="#04070d" font-size="9">Analyze +</text><text x="625" y="140" text-anchor="middle" fill="#04070d" font-size="9">present</text><rect x="730" y="40" width="150" height="110" rx="10" fill="#d3c24a" opacity="0.85"/><text x="805" y="70" text-anchor="middle" fill="#04070d" font-size="13" font-weight="700">Step 5</text><text x="805" y="90" text-anchor="middle" fill="#04070d" font-size="11">Take marketing</text><text x="805" y="104" text-anchor="middle" fill="#04070d" font-size="11">actions</text><text x="805" y="128" text-anchor="middle" fill="#04070d" font-size="9">Implement +</text><text x="805" y="140" text-anchor="middle" fill="#04070d" font-size="9">evaluate</text><line x1="163" y1="95" x2="187" y2="95" stroke="#98a2b3" stroke-width="2" marker-end="url(#arrow1)"/><line x1="343" y1="95" x2="367" y2="95" stroke="#98a2b3" stroke-width="2" marker-end="url(#arrow1)"/><line x1="523" y1="95" x2="547" y2="95" stroke="#98a2b3" stroke-width="2" marker-end="url(#arrow1)"/><line x1="703" y1="95" x2="727" y2="95" stroke="#98a2b3" stroke-width="2" marker-end="url(#arrow1)"/><path d="M805,150 L805,190 L85,190 L85,152" fill="none" stroke="#5f6774" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow1)"/><text x="445" y="205" text-anchor="middle" fill="#98a2b3" font-size="10">Feedback: lessons learned improve future research</text></g></svg><div class="chart-caption">Recreated from Figure 7-1: the five-step marketing research approach leading to marketing actions.</div></div>' },
      { heading:'Step 1: Define the Problem', html:'<p>Defining a problem precisely is harder than it sounds \u2014 too broad, and the problem becomes unresearchable; too narrow, and the results won\u2019t be very useful. Step 1 has two parts. First, the researcher sets <span class="term">research objectives</span>, the specific, measurable goals the decision maker wants the research to achieve. Second, the researcher identifies possible marketing actions by developing <span class="term">measures of success</span> \u2014 criteria used to evaluate proposed solutions \u2014 since different research outcomes should lead to different, clear-cut marketing actions.</p><div class="example"><span class="ex-label">Textbook example</span>For LEGO Group\u2019s SPIKE Prime robotics kit, the research objective was deciding which of two new kit designs to select for marketing. The measure of success was the total time spent with each design until a device that could do simple tricks was produced \u2014 leading directly to the action: market whichever kit produces an acceptable device in the least playing time.</div>' },
      { heading:'Step 2: Develop the Research Plan', html:'<p>The second step requires the researcher to (1) specify the <span class="term">constraints</span> on the research \u2014 restrictions like the time and money available \u2014 (2) identify exactly which data will lead to a clear marketing action, and (3) determine how to collect that data. In deciding how to collect data, researchers think in terms of concepts (ideas about products or services, often expressed as a <span class="term">new-product concept</span> \u2014 a picture or verbal description of a possible offering) and <span class="term">methods</span> (the approaches used to collect data to solve the problem). Two special methods are vital throughout marketing research: <span class="term">sampling</span>, selecting a representative group of customers or prospects and treating their answers as typical of the larger group, and <span class="term">statistical inference</span>, generalizing those sample results to the much larger group they represent.</p><div class="example"><span class="ex-label">Textbook example</span>LEGO Group\u2019s constraints for the SPIKE Prime decision were concrete: the decision had to be made in five weeks, using 10 teams of middle school students playing with the two alternative kits \u2014 a tight, specific research plan built directly around the research objective.</div>' }
    ],

    '7.3': [
      { heading:'Two Main Types of Marketing Information', html:'<p><span class="term">Data</span> are the facts and figures pertinent to a marketing project, and they divide into two main categories. <span class="term">Secondary data</span> are facts and figures that have already been recorded prior to the project at hand, while <span class="term">primary data</span> are facts and figures newly collected specifically for the project. Secondary data further splits into internal and external sources, and primary data further splits into observational data, questionnaire data, and other newer sources.</p><div class="chart-box"><svg viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg"><g font-family="Public Sans, sans-serif" font-size="12"><rect x="300" y="10" width="160" height="50" rx="9" fill="#e2685f" opacity=".85"/><text x="380" y="32" text-anchor="middle" fill="#1a0605" font-weight="700">Data</text><text x="380" y="48" text-anchor="middle" fill="#1a0605" font-size="9">Facts pertinent to the project</text><rect x="120" y="110" width="180" height="50" rx="9" fill="#cf6fb4" opacity=".85"/><text x="210" y="132" text-anchor="middle" fill="#04070d" font-weight="700">Secondary data</text><text x="210" y="148" text-anchor="middle" fill="#04070d" font-size="9">Already recorded</text><rect x="460" y="110" width="180" height="50" rx="9" fill="#5b8def" opacity=".85"/><text x="550" y="132" text-anchor="middle" fill="#04070d" font-weight="700">Primary data</text><text x="550" y="148" text-anchor="middle" fill="#04070d" font-size="9">Newly collected</text><rect x="30" y="210" width="150" height="50" rx="9" fill="#1c212a" stroke="#cf6fb4"/><text x="105" y="232" text-anchor="middle" fill="#f3ede2" font-size="11" font-weight="700">Internal</text><text x="105" y="248" text-anchor="middle" fill="#98a2b3" font-size="9">Sales, budgets</text><rect x="200" y="210" width="150" height="50" rx="9" fill="#1c212a" stroke="#cf6fb4"/><text x="275" y="232" text-anchor="middle" fill="#f3ede2" font-size="11" font-weight="700">External</text><text x="275" y="248" text-anchor="middle" fill="#98a2b3" font-size="9">Census, trade assoc.</text><rect x="390" y="210" width="150" height="50" rx="9" fill="#1c212a" stroke="#5b8def"/><text x="465" y="232" text-anchor="middle" fill="#f3ede2" font-size="11" font-weight="700">Observational</text><text x="465" y="248" text-anchor="middle" fill="#98a2b3" font-size="9">Watching people</text><rect x="560" y="210" width="150" height="50" rx="9" fill="#1c212a" stroke="#5b8def"/><text x="635" y="232" text-anchor="middle" fill="#f3ede2" font-size="11" font-weight="700">Questionnaire</text><text x="635" y="248" text-anchor="middle" fill="#98a2b3" font-size="9">Asking people</text><rect x="460" y="290" width="240" height="40" rx="9" fill="#1c212a" stroke="#5b8def"/><text x="580" y="315" text-anchor="middle" fill="#98a2b3" font-size="10">Other: social media, panels, experiments, data mining</text><line x1="380" y1="60" x2="210" y2="108" stroke="#98a2b3" stroke-width="1.5"/><line x1="380" y1="60" x2="550" y2="108" stroke="#98a2b3" stroke-width="1.5"/><line x1="210" y1="160" x2="105" y2="208" stroke="#98a2b3" stroke-width="1.5"/><line x1="210" y1="160" x2="275" y2="208" stroke="#98a2b3" stroke-width="1.5"/><line x1="550" y1="160" x2="465" y2="208" stroke="#98a2b3" stroke-width="1.5"/><line x1="550" y1="160" x2="635" y2="208" stroke="#98a2b3" stroke-width="1.5"/><line x1="550" y1="160" x2="580" y2="288" stroke="#98a2b3" stroke-width="1.5"/></g></svg><div class="chart-caption">Recreated from Figure 7-2: how the different kinds of marketing information fit together.</div></div>' },
      { heading:'Secondary Data: Internal and External', html:'<p><span class="term">Internal secondary data</span> are secondary data that originate from within the organization itself, split into <span class="term">marketing input data</span> (the effort expended to make sales, such as advertising expenditures and salesperson call reports) and <span class="term">marketing outcome data</span> (the results of that effort, such as sales broken down by rep, industry, or region). <span class="term">External secondary data</span> come from outside the organization \u2014 published reports from the U.S. Census Bureau, trade associations, and business periodicals are common sources.</p><div class="example"><span class="ex-label">Textbook example</span>The U.S. Census Bureau\u2019s Census 2020 (the 24th official U.S. population count) and its ongoing American Community Survey give marketers detailed household data \u2014 age, sex, race/ethnic background, income, occupation, education \u2014 without any firm having to collect a single original response.</div>' },
      { heading:'Weighing Secondary Data\u2019s Trade-offs', html:'<p>The general rule is to check secondary data first, then collect primary data only if needed. Secondary data\u2019s two big advantages are tremendous time savings, since the data already exist, and low cost, since much of it (like Census reports) is free or inexpensive. Its disadvantages are that it may be out of date \u2014 U.S. Census data is only collected in full every 10 years \u2014 and it may not be specific enough, since someone else collected it for a different original purpose.</p>' },
      { heading:'Newer Sources: Social Media and Metrics', html:'<p>Social media platforms like Instagram, X, and Facebook are increasingly used as secondary and primary data sources at once, letting marketers "mine" raw, real-time consumer-generated content rather than waiting on a formal survey. The trade-off is that the sample of people whose content gets mined may not be statistically representative of the broader marketplace. Companies increasingly track specific social metrics \u2014 conversation velocity, share of voice, and sentiment among them \u2014 to quantify how well a social program is working, as illustrated in the chapter\u2019s Carmex case study.</p>' }
    ],

    '7.4': [
      { heading:'Primary Data: Watching People', html:'<p>Observing and asking are the two principal ways to collect primary data. <span class="term">Observational data</span> are facts and figures obtained by watching how people actually behave, collected through mechanical (including electronic), personal, or neuromarketing methods. Observation is valuable precisely because it captures real behavior rather than a self-report of behavior \u2014 but it reveals what people do, not why they do it.</p>' },
      { heading:'Mechanical and Personal Observation', html:'<p>The best-known mechanical method is Nielsen\u2019s <span class="term">portable people meter</span>, a device worn or carried by each member of a panel household (in about 42,000 U.S. households) that automatically records which program is playing nearby. A single ratings point can mean $1.2 million in TV households and millions of dollars in ad revenue, which is why precision here matters so much.</p><div class="chart-box"><table class="data-table"><tr><th>Rank</th><th>Program</th><th>Network</th><th>Rating</th><th>Avg. viewers (000s)</th></tr><tr><td>1</td><td>NBC Sunday Night Football</td><td>NBC</td><td>5.3</td><td>16,286</td></tr><tr><td>2</td><td>NCIS</td><td>CBS</td><td>5.0</td><td>15,415</td></tr><tr><td>3</td><td>FBI</td><td>CBS</td><td>4.2</td><td>12,890</td></tr><tr><td>4</td><td>NFL Thursday Night Football</td><td>FOX</td><td>4.2</td><td>12,859</td></tr><tr><td>5</td><td>Blue Bloods</td><td>CBS</td><td>4.0</td><td>12,163</td></tr><tr><td>6</td><td>Chicago Fire</td><td>NBC</td><td>3.9</td><td>11,992</td></tr><tr><td>7</td><td>Chicago P.D.</td><td>NBC</td><td>3.7</td><td>11,519</td></tr><tr><td>8</td><td>Young Sheldon</td><td>CBS</td><td>3.7</td><td>11,407</td></tr><tr><td>9</td><td>Chicago Med</td><td>NBC</td><td>3.7</td><td>11,363</td></tr><tr><td>10</td><td>This Is Us</td><td>NBC</td><td>3.7</td><td>11,254</td></tr></table><div class="chart-caption">Recreated from Figure 7-3: Nielsen Top Television Program Ranking Report for network TV primetime households.</div></div><p>Personal observation methods include <span class="term">mystery shoppers</span> \u2014 researchers paid to shop at a company\u2019s own or a competitor\u2019s stores to check availability, pricing, and service \u2014 and <span class="term">ethnographic research</span>, a specialized approach in which trained observers watch subtle behavioral and emotional reactions as consumers use products in their natural environment, such as Best Buy researchers "shop-alonging" with customers in their homes to study fitness-equipment use.</p>' },
      { heading:'Neuromarketing: Studying the Brain Itself', html:'<p><span class="term">Neuromarketing</span> merges brain-scanning and other neuroscience technologies with marketing\u2019s interest in nonconscious consumer responses, often supplemented by eye tracking, biometric monitoring, and facial coding.</p><div class="example"><span class="ex-label">Textbook example</span>Based on neuromarketing findings, Campbell Soup Company changed most of its soup can labels: steam now rises from more vibrant images of soup, the "unemotional spoon" has disappeared, and the script logo is smaller and moved lower on the can.</div>' },
      { heading:'Primary Data: Asking People', html:'<p><span class="term">Questionnaire data</span> are facts and figures obtained by asking people about their attitudes, awareness, intentions, and behaviors, split into idea generation methods and idea evaluation methods. Idea generation typically starts with an <span class="term">individual interview</span> (a single researcher questioning one respondent, allowing valuable follow-up probing but at high cost) or a <span class="term">depth interview</span> (a type of individual interview using lengthy, free-flowing questions to probe underlying feelings). A faster, cheaper way to generate ideas is a <span class="term">focus group</span> \u2014 an informal session of 6 to 10 customers led by a moderator to discuss a firm\u2019s products or its competitors\u2019.</p><div class="example"><span class="ex-label">Textbook example</span>General Mills used depth interviews to learn that Hamburger Helper customers didn\u2019t think a half-pound of hamburger contained enough meat and disliked cooking noodles and hamburger separately \u2014 insight that led the company to redesign the product\u2019s meat and cooking instructions.</div>' },
      { heading:'Designing Good Survey Questions', html:'<p>Once ideas exist, idea evaluation methods test them on a larger, more representative sample. An <span class="term">open-ended question</span> lets respondents answer in their own words; a <span class="term">closed-end question</span> (or fixed-alternative question) asks respondents to pick from predetermined options. The simplest fixed-alternative format is a <span class="term">dichotomous question</span>, allowing only a "yes" or "no." Scaled questions include the <span class="term">semantic differential scale</span> (opposite one- or two-word meanings at each end) and the <span class="term">Likert scale</span>, on which respondents rate how much they agree or disagree with a statement.</p><div class="example"><span class="ex-label">Textbook example</span>Wendy\u2019s survey asked an open-ended question about what matters most when choosing a fast-food restaurant, a dichotomous yes/no question about recent visits, a semantic differential scale rating cleanliness, and a Likert-scale statement about taking family to fast food \u2014 all four formats in a single questionnaire.</div><p>Personal interview surveys allow flexibility but are costly; mail surveys are cheap but biased toward people with strong opinions; telephone surveys are efficient but easy to hang up on. A <span class="term">mall intercept interview</span> \u2014 a personal interview with shoppers visiting a mall \u2014 lowers the cost of home visits while still allowing visual aids like ads or products. Increasingly, researchers use online surveys, which are fast and cheap but can be blocked as "spam" or completed multiple times by the same respondent without safeguards.</p>' },
      { heading:'Panels and Experiments', html:'<p>Two special ways observation and questionnaires get combined are panels and experiments. A <span class="term">panel</span> is a sample of consumers or stores from which researchers take repeated measurements over time, useful for detecting behavior change \u2014 the NPD Group\u2019s Online Consumer Panel tracks purchases from nearly 2 million consumers worldwide. An <span class="term">experiment</span> involves manipulating factors under tightly controlled conditions to test cause and effect: the factor changed is the independent variable, or marketing driver (like price or promotion), and the resulting change is the dependent variable. Companies often test experiments in <span class="term">test markets</span> \u2014 small geographic areas used to evaluate a new marketing action before a full rollout.</p><div class="example"><span class="ex-label">Textbook example</span>McDonald\u2019s tested its delivery service in three test-market cities before expanding nationally, and separately tested Krispy Kreme doughnuts in nine of its Kentucky restaurants before deciding whether to roll the idea out further.</div><div class="chart-box"><svg viewBox="0 0 460 190" xmlns="http://www.w3.org/2000/svg"><g font-family="Public Sans, sans-serif" font-size="10"><text x="90" y="15" text-anchor="middle" fill="#f3ede2" font-size="11" font-weight="700">Annual sales (units, millions)</text><line x1="30" y1="150" x2="180" y2="150" stroke="#5f6774"/><rect x="35" y="36.9" width="24" height="113.1" fill="#5b8def"/><text x="47" y="30" text-anchor="middle" fill="#98a2b3">330</text><text x="47" y="164" text-anchor="middle" fill="#98a2b3">2020</text><rect x="80" y="35.1" width="24" height="114.9" fill="#5b8def"/><text x="92" y="28" text-anchor="middle" fill="#98a2b3">335</text><text x="92" y="164" text-anchor="middle" fill="#98a2b3">2021</text><rect x="125" y="34.1" width="24" height="115.9" fill="#5b8def"/><text x="137" y="27" text-anchor="middle" fill="#98a2b3">338</text><text x="137" y="164" text-anchor="middle" fill="#98a2b3">2022</text><rect x="170" y="35.5" width="24" height="114.5" fill="#5b8def"/><text x="182" y="28" text-anchor="middle" fill="#98a2b3">334</text><text x="182" y="164" text-anchor="middle" fill="#98a2b3">2023</text><text x="280" y="15" text-anchor="middle" fill="#f3ede2" font-size="11" font-weight="700">Avg. pizzas per household</text><line x1="240" y1="150" x2="390" y2="150" stroke="#5f6774"/><rect x="245" y="48" width="24" height="102" fill="#e0964f"/><text x="257" y="41" text-anchor="middle" fill="#98a2b3">3.4</text><text x="257" y="164" text-anchor="middle" fill="#98a2b3">2020</text><rect x="290" y="51" width="24" height="99" fill="#e0964f"/><text x="302" y="44" text-anchor="middle" fill="#98a2b3">3.3</text><text x="302" y="164" text-anchor="middle" fill="#98a2b3">2021</text><rect x="335" y="54" width="24" height="96" fill="#e0964f"/><text x="347" y="47" text-anchor="middle" fill="#98a2b3">3.2</text><text x="347" y="164" text-anchor="middle" fill="#98a2b3">2022</text><rect x="380" y="57" width="24" height="93" fill="#e0964f"/><text x="392" y="50" text-anchor="middle" fill="#98a2b3">3.1</text><text x="392" y="164" text-anchor="middle" fill="#98a2b3">2023</text></g></svg><div class="chart-caption">Recreated from Figure 7-6: Tony\u2019s Pizza dashboards \u2014 flat total sales, but declining average sales per household, revealed the real problem.</div></div><p>Reading the dashboards in order (annual sales, then per-household sales, then by household size, then by children\u2019s age) is exactly how the consultant in the chapter helped Tony\u2019s Pizza marketing manager Ter\u00e9 Carral discover that the real problem was concentrated in households with children ages 6 to 12.</p>' }
    ],

    '7.5': [
      { heading:'Big Data and the Intelligent Enterprise', html:'<p>We live in an era of data deluge. <span class="term">Big data</span> is a vague term generally used to describe large amounts of data collected from a variety of sources and analyzed with an increasingly sophisticated set of technologies. <span class="term">Information technology</span> includes all the computing resources that collect, store, and analyze this data. Businesses typically organize it into a <span class="term">data warehouse</span> \u2014 an organized collection of internal and external databases, often housed in the cloud \u2014 and increasingly apply <span class="term">artificial intelligence</span> platforms that reason and perform commonsense tasks, from guiding self-driving cars to generating purchase recommendations. The results of the analysis are typically shown through <span class="term">data visualization</span> \u2014 charts and graphics that make the findings usable.</p>' },
      { heading:'Data Analytics: Turning Data Into Answers', html:'<p><span class="term">Data analytics</span> consists of the tools used to organize, manipulate, and interpret data, typically to answer specific buying queries: who buys, how much, and why. Analysts also use these tools for sensitivity analysis, asking "what if" questions about how a hypothetical change in a marketing driver \u2014 like couponing \u2014 might affect sales.</p><div class="example"><span class="ex-label">Textbook example</span>A researcher might collect data to test the hypothesis that increasing couponing (the driver) during spring will increase first-time buyer trials (the result) \u2014 exactly the kind of buying query data analytics is built to answer.</div>' },
      { heading:'Data Mining: Finding Hidden Patterns', html:'<p><span class="term">Data mining</span> is the extraction of hidden predictive information from large databases, used to find statistical links between consumer purchasing patterns and marketing actions. Some patterns confirm common sense \u2014 peanut butter and grape jelly sell well together \u2014 but the most valuable discoveries are the ones nobody would have thought to test for directly.</p><div class="example"><span class="ex-label">Textbook example</span>Mining checkout scanner data revealed that men buying diapers in the evening also tended to buy a six-pack of beer. Supermarkets responded by placing diapers and beer near each other, with potato chips positioned between them, and increased sales of all three products.</div><p>Refinements in data mining now support <span class="term">predictive modeling</span> \u2014 statistical models built from a number of predictors, or variables, that estimate the likelihood of future consumer behavior, letting marketers foresee patterns rather than just explain past ones.</p>' }
    ],

    '7.6': [
      { heading:'Why Forecasts Matter', html:'<p>A <span class="term">sales forecast</span> is the total sales of a product a firm expects to sell during a specified future period, under specified environmental conditions and its own marketing efforts. Good forecasts are important because so much of a business \u2014 production schedules, staffing, budgets \u2014 depends on them. The chapter groups forecasting techniques into three families: judgments of the decision maker, surveys of knowledgeable groups, and statistical methods.</p>' },
      { heading:'Judgments of the Decision Maker', html:'<p>Roughly 99 percent of all sales forecasts are simply the judgment of the person who must act on the results \u2014 how many quarts of milk should I buy, how much cash should I withdraw? A <span class="term">direct forecast</span> estimates the value to be forecast without any intervening steps. A <span class="term">lost-horse forecast</span> starts with the last known value of the item, then adjusts the estimate up or down based on positive and negative factors that could affect it \u2014 the technique gets its name from how you\u2019d find a lost horse: go to where you last saw it, then consider which direction it likely went.</p><div class="example"><span class="ex-label">Textbook example</span>A New Balance marketing manager forecasting sales of its FuelCell SuperComp Trainer running shoe through 2026 would start from known 2023 sales, then weigh positive factors (strong performance reviews, wear-tester comments) against negative ones (increased competition, rising supply-chain costs) to build a lost-horse forecast.</div>' },
      { heading:'Surveys of Knowledgeable Groups', html:'<p>A <span class="term">survey of buyers\u2019 intentions forecast</span> asks prospective customers directly whether they\u2019re likely to buy the product in a future period \u2014 effective when there are relatively few prospective buyers, such as industrial products. A <span class="term">salesforce survey forecast</span> instead asks the firm\u2019s own salespeople to estimate sales, since they\u2019re in close contact with customers \u2014 though they can be unreliable if they paint too rosy a picture out of enthusiasm, or too grim a picture to lower their future sales quota.</p><div class="example"><span class="ex-label">Textbook example</span>Boeing surveys airlines directly to develop its sales forecasts and production schedules, since there are only a few hundred customers worldwide for its large commercial aircraft \u2014 a textbook case for a survey of buyers\u2019 intentions.</div>' },
      { heading:'Statistical Methods: Trend Extrapolation', html:'<p>The best-known statistical forecasting method is <span class="term">trend extrapolation</span>, which extends a pattern observed in past data into the future. When that pattern is a straight line, it\u2019s called linear trend extrapolation. Its strength is simplicity \u2014 draw the line, extend it \u2014 but its core assumption, that past relationships will keep holding true, can fail if conditions like competition change.</p><div class="chart-box"><svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg"><g font-family="Public Sans, sans-serif" font-size="10"><line x1="60" y1="260" x2="600" y2="260" stroke="#5f6774"/><line x1="60" y1="20" x2="60" y2="260" stroke="#5f6774"/><line x1="60" y1="191" x2="600" y2="191" stroke="#262c37"/><line x1="60" y1="123" x2="600" y2="123" stroke="#262c37"/><line x1="60" y1="54" x2="600" y2="54" stroke="#262c37"/><text x="50" y="264" text-anchor="end" fill="#98a2b3">0</text><text x="50" y="195" text-anchor="end" fill="#98a2b3">40</text><text x="50" y="127" text-anchor="end" fill="#98a2b3">80</text><text x="50" y="58" text-anchor="end" fill="#98a2b3">120</text><text x="60" y="278" fill="#98a2b3">2000</text><text x="140" y="278" fill="#98a2b3">2004</text><text x="230" y="278" fill="#98a2b3">2008</text><text x="320" y="278" fill="#98a2b3">2012</text><text x="410" y="278" fill="#98a2b3">2016</text><text x="500" y="278" fill="#98a2b3">2020</text><text x="585" y="278" fill="#98a2b3">2024</text><polyline points="60,191 105,178 150,166 195,154 240,140 262,130" fill="none" stroke="#5b8def" stroke-width="2.5"/><polyline points="262,130 330,109 397,89 465,68 532,47 600,27" fill="none" stroke="#98a2b3" stroke-width="2" stroke-dasharray="6,4"/><polyline points="262,130 330,118 397,109 465,104 532,101 600,97" fill="none" stroke="#e0964f" stroke-width="2.5"/><circle cx="262" cy="130" r="4" fill="#f3ede2"/><rect x="380" y="215" width="10" height="10" fill="#5b8def"/><text x="395" y="224" fill="#98a2b3">Actual (before forecast)</text><rect x="380" y="232" width="10" height="10" fill="#98a2b3"/><text x="395" y="241" fill="#98a2b3">Forecast (trend extrapolation)</text><rect x="380" y="249" width="10" height="10" fill="#e0964f"/><text x="395" y="258" fill="#98a2b3">Actual (after forecast made)</text></g></svg><div class="chart-caption">Illustrative recreation of Figure 7-7: a linear trend extrapolation forecast made in 2010 overshot actual results, largely due to increased competition. Values are simplified for illustration.</div></div><div class="formula"><span class="f-label">Worked example</span>Suppose a bakery\u2019s cake sales were $40,000, $46,000, $52,000, and $58,000 over four straight years \u2014 a steady $6,000 increase each year. Linear trend extrapolation simply continues that line: it would project about $64,000 next year and $70,000 the year after, assuming the same $6,000 yearly increase continues.</div>' }
    ]
  },

  chapterWrapUp: {
    ch9: { title:'Tying It All Together', html:'<p>Come back to Apple one more time. Its new-product machine works because every stage of this chapter\u2019s process reinforces the others: a closed-innovation strategy defines the role of each new product within Apple\u2019s broader objectives; ideas are generated and ruthlessly screened (Apple tested and rejected over 25 mouse prototypes before settling on one); products are classified and positioned carefully, from continuous innovations like a new iPhone color to genuinely discontinuous ones like CarPlay; and even Apple\u2019s failures \u2014 the Apple III, the Newton, the "Hockey Puck" Mouse \u2014 get folded back into the next round of idea generation, since the wildly successful iPhone was a direct result of lessons learned from an earlier failed music phone. New-product development isn\u2019t a single clever idea; it\u2019s a disciplined, repeatable process that turns even failures into future successes.</p>' },
    ch1: { title:'Tying It All Together', html:'<p>Come back to Bombas one more time. Its socks work as a business because every layer of this chapter lines up: the company discovered a real unmet need (comfortable socks, and a shortage of them at homeless shelters), built a marketing mix around that discovery (a genuinely better product, a fair price, word-of-mouth and video promotion, and wide retail placement), and used all of it to build lasting customer relationships rather than one-time sales. Layered on top is a market orientation and a societal marketing concept working together \u2014 Bombas keeps listening to what customers and Giving Partners need, and it has built social impact directly into its product line rather than bolting it on as an afterthought. That combination, more than any single tactic, is what separates durable brands from products that quietly disappear.</p>' },
    ch4: { title:'Tying It All Together', html:'<p>Return to the carmakers described at the start of this chapter, who discovered that women now make 62 percent of new-car buying decisions and influence 85 percent of them. Getting that right meant working through nearly everything in this chapter at once: recognizing that women and men move through the same five-stage purchase decision process but weigh problem recognition, evaluative criteria, and perceived risk differently; understanding that a car purchase is about as high-involvement and extended a problem-solving occasion as exists; designing around motivation, self-concept, and perceived risk (safety framed as surviving a crash, not just avoiding one); and recognizing reference groups and word of mouth as the deciding factor for many buyers, since recommendations from friends and relatives still matter more to women car shoppers than any single ad. Companies that treated all of this as one connected picture, rather than four separate topics, are the ones that actually captured that buying power.</p>' },
    ch5: { title:'Tying It All Together', html:'<p>Return to JCP Media\u2019s paper buyers from the start of this chapter. Purchasing over 100,000 tons of publication paper a year is organizational buying in miniature: a large, technical purchase driven by derived demand from JCPenney\u2019s own retail sales, evaluated against organizational buying criteria like supplier capability and sustainability certification rather than price alone, decided by a buying center that likely spans purchasing, marketing, and senior executives, and increasingly conducted through the same online tools \u2014 e-marketplaces and negotiated contracts \u2014 that organizations across every industry now rely on. None of this is visible to the shopper flipping through a JCPenney insert, but it is exactly the kind of decision this chapter is built to explain.</p>' },
    ch7: { title:'Tying It All Together', html:'<p>Come back to the Hollywood studios from the start of this chapter. Getting a $2 billion blockbuster instead of a box-office flop like <i>Tomorrowland</i> or <i>John Carter</i> means running the whole chapter\u2019s process at once: defining a precise research objective (which title, which ending?), building a research plan within real budget and time constraints, collecting both secondary data (past box-office patterns) and primary data (test screenings, title testing, tracking studies), mining that data for patterns a producer might never think to ask about directly, and finally taking a concrete marketing action \u2014 cutting four hours down to 194 minutes, or renaming a movie entirely. The five-step approach, the primary/secondary data distinction, and the shift toward big data and data mining are not separate topics; they are one continuous pipeline from a vague worry ("will this flop?") to a specific, evidence-backed decision.</p>' }
  },

    whoAmI: [

let STORAGE_OK = true;
let STORAGE_BACKEND = 'memory';
const MEMORY_STORE = {};
const LS_PREFIX = 'mktStudyApp:';
function lsAvailable(){
  try{
    const k = '__mkt_ls_test__';
    window.localStorage.setItem(k,'1');
    window.localStorage.removeItem(k);
    return true;
  }catch(e){ return false; }
}
async function storageGet(key){
  try{
    if (window.storage && window.storage.get){
      const r = await window.storage.get(key, false);
      STORAGE_BACKEND = 'claude'; STORAGE_OK = true;
      return r ? r.value : null;
    }
    throw new Error('no claude storage');
  }catch(e){
    if (lsAvailable()){
      STORAGE_BACKEND = 'localStorage'; STORAGE_OK = true;
      const v = window.localStorage.getItem(LS_PREFIX+key);
      return v !== null ? v : null;
    }
    STORAGE_BACKEND = 'memory'; STORAGE_OK = false;
    return MEMORY_STORE[key] !== undefined ? MEMORY_STORE[key] : null;
  }
}
async function storageSet(key, value){
  try{
    if (window.storage && window.storage.set){
      await window.storage.set(key, value, false);
      STORAGE_BACKEND = 'claude'; STORAGE_OK = true;
      return true;
    }
    throw new Error('no claude storage');
  }catch(e){
    if (lsAvailable()){
      try{
        window.localStorage.setItem(LS_PREFIX+key, value);
        STORAGE_BACKEND = 'localStorage'; STORAGE_OK = true;
        return true;
      }catch(e2){ /* fall through to memory */ }
    }
    STORAGE_BACKEND = 'memory'; STORAGE_OK = false;
    MEMORY_STORE[key] = value;
    return false;
  }
}

function defaultProgress(){
  return {
    xp: 0,
    streak: { days:0, lastStudyDate:null },
    studyLog: [],
    quizAttempts: [],
    flashcardStatus: {},
    srs: {},
    highlights: [],
    examHistory: [],
    badges: []
  };
}
let PROGRESS = defaultProgress();

async function loadProgress(){
  const raw = await storageGet('progress');
  if (raw){
    try{ PROGRESS = Object.assign(defaultProgress(), JSON.parse(raw)); }
    catch(e){ PROGRESS = defaultProgress(); }
  }
}
let saveTimer = null;
function persistProgress(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{ storageSet('progress', JSON.stringify(PROGRESS)); }, 250);
}

function addXp(n){ PROGRESS.xp += n; persistProgress(); }

function todayStr(){ return new Date().toISOString().slice(0,10); }
function logStudyMinutes(mins){
  const today = todayStr();
  PROGRESS.studyLog.push({ date: today, minutes: mins });
  const last = PROGRESS.streak.lastStudyDate;
  if (last !== today){
    if (last){
      const diff = (new Date(today) - new Date(last)) / 86400000;
      PROGRESS.streak.days = (diff <= 1.5) ? PROGRESS.streak.days + 1 : 1;
    } else {
      PROGRESS.streak.days = 1;
    }
    PROGRESS.streak.lastStudyDate = today;
  }
  addXp(Math.round(mins));
  checkBadges();
  persistProgress();
}

function recordQuizAttempt(a){
  PROGRESS.quizAttempts.push(Object.assign({ timestamp: Date.now() }, a));
  addXp(a.correct ? 8 : 2);
  checkBadges();
  persistProgress();
}

function setFlashcardStatus(conceptId, status){
  PROGRESS.flashcardStatus[conceptId] = status;
  checkBadges();
  persistProgress();
}

function rateActiveRecall(conceptId, rating){
  const now = Date.now();
  const prev = PROGRESS.srs[conceptId] || { interval:1, due: now, last: null };
  let interval;
  if (rating === 'didnt') interval = 1;
  else if (rating === 'almost') interval = Math.max(1, Math.round(prev.interval * 1.3));
  else if (rating === 'knew') interval = Math.max(2, Math.round(prev.interval * 2.2));
  else interval = Math.max(4, Math.round(prev.interval * 3.2));
  PROGRESS.srs[conceptId] = { interval, due: now + interval*86400000, last: rating };
  addXp(3);
  persistProgress();
}

function addHighlight(h){
  PROGRESS.highlights.push(Object.assign({ id:'hl-'+Date.now()+'-'+Math.floor(Math.random()*9999), ts: Date.now() }, h));
  persistProgress();
}
function deleteHighlight(id){
  PROGRESS.highlights = PROGRESS.highlights.filter(h => h.id !== id);
  persistProgress();
}

/* =========================================================================
   UTILITIES
   ========================================================================= */
function shuffle(arr){
  const a = arr.slice();
  for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function allConcepts(){ return SEED_CONTENT.concepts; }
function getConcept(id){ return SEED_CONTENT.concepts.find(c=>c.id===id); }
function getLO(code){ return SEED_CONTENT.learningObjectives.find(l=>l.code===code); }
function getChapter(id){ return SEED_CONTENT.chapters[id]; }
function conceptsForChapter(chId){ return SEED_CONTENT.concepts.filter(c=>c.chapterId===chId); }
function conceptsForLO(code){ return SEED_CONTENT.concepts.filter(c=>c.lo===code); }
function allLOs(){ return SEED_CONTENT.learningObjectives; }
function allChapters(){ return SEED_CONTENT.course.chapters.map(id=>SEED_CONTENT.chapters[id]); }

function loSlot(code){
  const n = parseInt(code.split('.')[1], 10);
  return ((n-1) % 5) + 1;
}
function loColorVar(code){ return 'var(--lo'+loSlot(code)+')'; }
function loTintVar(code){ return 'var(--lo'+loSlot(code)+'-tint)'; }

function conceptAccuracy(conceptId){
  const attempts = PROGRESS.quizAttempts.filter(a=>a.concept===conceptId);
  if (!attempts.length) return null;
  const correct = attempts.filter(a=>a.correct).length;
  return { correct, total: attempts.length, pct: Math.round(correct/attempts.length*100) };
}

function loMasteryPct(code){
  const concepts = conceptsForLO(code);
  if (!concepts.length) return 0;
  let total = 0;
  concepts.forEach(c=>{
    const acc = conceptAccuracy(c.id);
    const fc = PROGRESS.flashcardStatus[c.id];
    let score = 0;
    if (acc) score = Math.max(score, acc.pct);
    if (fc === 'know') score = Math.max(score, 85);
    if (fc === 'difficult') score = Math.max(score, 25);
    total += score;
  });
  return Math.round(total/concepts.length);
}
function loStatus(code){
  const pct = loMasteryPct(code);
  const attempts = PROGRESS.quizAttempts.filter(a=> getConcept(a.concept) && getConcept(a.concept).lo === code);
  if (!attempts.length && !Object.keys(PROGRESS.flashcardStatus).some(id=>getConcept(id) && getConcept(id).lo===code)) return 'Not Started';
  if (pct >= 80) return 'Mastered';
  if (pct >= 50) return 'Improving';
  return 'Learning';
}
function statusClass(status){
  return 'status-' + status.toLowerCase().replace(' ','');
}
function chapterMasteryPct(chId){
  const los = SEED_CONTENT.chapters[chId].learningObjectives.map(id=>SEED_CONTENT.learningObjectives.find(l=>l.id===id));
  if (!los.length) return 0;
  const sum = los.reduce((s,lo)=>s+loMasteryPct(lo.code),0);
  return Math.round(sum/los.length);
}
function masteryForCourse(){
  const los = allLOs();
  if (!los.length) return 0;
  return Math.round(los.reduce((s,lo)=>s+loMasteryPct(lo.code),0)/los.length);
}
function losMasteredCount(){ return allLOs().filter(lo=>loStatus(lo.code)==='Mastered').length; }
function quizAccuracyPct(){
  if (!PROGRESS.quizAttempts.length) return 0;
  const correct = PROGRESS.quizAttempts.filter(a=>a.correct).length;
  return Math.round(correct/PROGRESS.quizAttempts.length*100);
}
function weakConcepts(minAttempts){
  minAttempts = minAttempts || 2;
  const byConcept = {};
  PROGRESS.quizAttempts.forEach(a=>{
    byConcept[a.concept] = byConcept[a.concept] || {correct:0,total:0};
    byConcept[a.concept].total++;
    if (a.correct) byConcept[a.concept].correct++;
  });
  return Object.keys(byConcept)
    .filter(id => byConcept[id].total >= minAttempts)
    .map(id => ({ id, concept:getConcept(id), pct: Math.round(byConcept[id].correct/byConcept[id].total*100), total: byConcept[id].total }))
    .filter(x=>x.concept)
    .sort((a,b)=>a.pct-b.pct);
}
function dueActiveRecallConcepts(){
  const now = Date.now();
  const must = allConcepts().filter(c=>c.tier==='must_know');
  return must.map(c=>{
    const s = PROGRESS.srs[c.id];
    return { concept:c, due: s ? s.due : 0, isNew: !s };
  }).sort((a,b)=>{
    if (a.isNew && !b.isNew) return 1;
    if (!a.isNew && b.isNew) return -1;
    return a.due - b.due;
  }).filter(x=> x.isNew || x.due <= now || true);
}
function escapeHtml(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* =========================================================================
   CLICK-TO-DEFINE VOCABULARY TERMS
   ========================================================================= */
let TERM_INDEX = null;
function normalizeTermKey(s){
  return s.toLowerCase().replace(/[.,;:!?]+$/,'').trim();
}
const TERM_ALIASES = {
  'industrial firms': 'ch5-industrial-market',
  'resellers': 'ch5-reseller-market',
  'government units': 'ch5-government-market'
};
function buildTermIndex(){
  const idx = {};
  allConcepts().forEach(c=>{
    const full = normalizeTermKey(c.term);
    idx[full] = c.id;
    if (full.endsWith('s')) idx[full.slice(0,-1)] = c.id; else idx[full+'s'] = c.id;
    const paren = c.term.match(/^(.*?)\s*\(([^)]+)\)\s*$/);
    if (paren){
      idx[normalizeTermKey(paren[1])] = c.id;
      idx[normalizeTermKey(paren[2])] = c.id;
    }
  });
  Object.keys(TERM_ALIASES).forEach(k=> idx[k] = TERM_ALIASES[k]);
  return idx;
}
function wireClickableTerms(root){
  if (!TERM_INDEX) TERM_INDEX = buildTermIndex();
  const seen = new Set();
  root.querySelectorAll('span.term').forEach(span=>{
    const key = normalizeTermKey(span.textContent);
    const conceptId = TERM_INDEX[key];
    if (!conceptId) return;
    span.classList.add('term-hit');
    if (seen.has(conceptId)) span.classList.add('term-repeat');
    else seen.add(conceptId);
    span.dataset.concept = conceptId;
    span.onclick = ()=> openConceptModal(conceptId);
  });
}
function hlSwatch(key,label){
  return '<button class="hl-swatch hl-'+key+(APP.highlightColor===key?' active':'')+'" data-hl="'+key+'">'+label+'</button>';
}

function wireHighlighter(root){
  root.querySelectorAll('.hl-swatch').forEach(b=>{
    b.onclick = ()=>{
      APP.highlightColor = b.dataset.hl;
      root.querySelectorAll('.hl-swatch').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
    };
  });
  document.getElementById('hlClearBtn').onclick = ()=>{
    root.querySelectorAll('mark.hlx').forEach(m=>{
      const parent = m.parentNode;
      while (m.firstChild) parent.insertBefore(m.firstChild, m);
      parent.removeChild(m);
      parent.normalize();
    });
    PROGRESS.highlights = [];
    persistProgress();
  };

  document.addEventListener('mouseup', (e)=>{
    if (APP.mode !== 'study') return;
    if (!root.contains(e.target)) return;
    if (e.target.closest('.hl-toolbar') || e.target.closest('.glossary-table')) return;
    const sel = window.getSelection();
    if (!sel || sel.isCollapsed || sel.rangeCount===0) return;
    const range = sel.getRangeAt(0);
    if (!root.contains(range.commonAncestorContainer)) return;
    const loSectionEl = range.commonAncestorContainer.nodeType===1 ? range.commonAncestorContainer.closest('.lo-section') : range.commonAncestorContainer.parentElement.closest('.lo-section');
    const loCode = loSectionEl ? loSectionEl.id.replace('lo-section-','') : null;
    const text = range.toString();
    if (!text.trim()) return;
    try{
      const mark = document.createElement('mark');
      mark.className = 'hlx hlx-'+APP.highlightColor;
      mark.dataset.category = APP.highlightColor;
      mark.appendChild(range.extractContents());
      range.insertNode(mark);
      sel.removeAllRanges();
      addHighlight({ text: text, category: APP.highlightColor, lo: loCode });
      mark.onclick = ()=>{
        const parent = mark.parentNode;
        while (mark.firstChild) parent.insertBefore(mark.firstChild, mark);
        parent.removeChild(mark);
        parent.normalize();
      };
    }catch(err){}
  });
}
