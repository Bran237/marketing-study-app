      definition:'The filtering of exposure, comprehension, and retention of information based on a consumer\u2019s existing attitudes and beliefs.',
      plain:'The brain\u2019s habit of noticing, understanding, and remembering only the information that already fits what you believe \u2014 and tuning out the rest.',
      why:'It explains why the same ad can be effective for existing customers but invisible to everyone else, and why a poorly chosen product name can accidentally suggest the wrong thing to shoppers.',
      example:'Someone who already loves a particular sneaker brand is more likely to notice that brand\u2019s ads in their social feed and less likely to notice a competitor\u2019s.',
      textbookExample:'Toro\u2019s lightweight snow removal product, the Snow Pup, sold poorly because shoppers\u2019 selective comprehension led them to assume from the name that it was a toy \u2014 sales improved sharply once it was renamed Snow Master.',
      commonMistake:'Students often treat selective exposure, comprehension, and retention as one idea. They\u2019re three distinct filters: exposure is what you notice, comprehension is how you interpret it, and retention is what you remember afterward.',
      examQuestion:'Explain how selective comprehension caused Toro\u2019s original product name to hurt sales, and how renaming it addressed the problem.',
      mnemonic:null },

    { id:'ch4-perceived-risk', term:'Perceived risk', tier:'must_know', lo:'4.3', chapterId:'ch4', section:'4.3',
      definition:'The anxiety felt because a consumer cannot anticipate the outcomes of a purchase but believes there may be negative consequences.',
      plain:'That worried feeling that something could go wrong with a purchase \u2014 financially, physically, socially, or just in terms of it not working as expected.',
      why:'The higher the perceived risk, the more information a consumer will seek before buying, so marketers use guarantees, seals of approval, and free trials specifically to lower this anxiety.',
      example:'Someone hesitant to buy a used car online because they can\u2019t test-drive it first is experiencing perceived risk about the car\u2019s performance.',
      textbookExample:'Kia\u2019s 10-year, 100,000-mile powertrain warranty and the Good Housekeeping Seal of Approval are both strategies companies use specifically to reduce a shopper\u2019s perceived risk before they buy.',
      commonMistake:'Students sometimes think perceived risk only means financial risk. The chapter identifies several types, including physical risk (is it safe?), performance risk (will it work?), and psychosocial risk (what will my friends think?).',
      examQuestion:'Name two strategies companies use to reduce a consumer\u2019s perceived risk before a purchase, with an example of each.',
      mnemonic:null },

    { id:'ch4-brand-loyalty', term:'Brand loyalty', tier:'must_know', lo:'4.3', chapterId:'ch4', section:'4.3',
      definition:'A favorable attitude toward and consistent purchase of a single brand over time.',
      plain:'Sticking with the same brand purchase after purchase because past experience taught you it works well.',
      why:'Loyal customers cost less to keep than new customers cost to acquire, and they\u2019re less sensitive to a competitor\u2019s price cuts \u2014 which is why building brand loyalty is a core long-term marketing goal.',
      example:'Always buying the same brand of laundry detergent because it\u2019s always worked well, without comparing prices each time, is an everyday example of brand loyalty.',
      textbookExample:'There is a close link between habits and brand loyalty, though the incidence of brand loyalty has actually been declining in North America, Western Europe, and Japan in recent years.',
      commonMistake:'Students sometimes assume brand loyalty is permanent. In reality, it results from ongoing positive reinforcement and can erode if a company lets quality slip or a competitor offers a big enough incentive to switch.',
      examQuestion:'Explain the relationship between behavioral learning (drive, cue, response, reinforcement) and how brand loyalty develops over time.',
      mnemonic:null },

    { id:'ch4-reference-groups', term:'Reference groups', tier:'must_know', lo:'4.4', chapterId:'ch4', section:'4.4',
      definition:'People to whom an individual looks as a basis for self-appraisal or as a source of personal standards.',
      plain:'The people whose opinions and lifestyle you measure yourself against when deciding what\u2019s socially acceptable to buy or wear.',
      why:'Reference groups strongly shape purchases of visible or luxury products in ways private, unseen purchases never feel, so marketers targeting status-conscious buyers lean heavily on this influence.',
      example:'Choosing a particular brand of sneakers because it\u2019s what your friend group wears is your reference group shaping your purchase.',
      textbookExample:'Abercrombie & Fitch reportedly offered to pay a controversial reality-TV cast not to wear its clothing, specifically because it didn\u2019t want to be associated with a dissociative reference group its target customers wanted to avoid.',
      commonMistake:'Students often think reference groups must be groups you belong to. The chapter identifies three types \u2014 associative, dissociative, and aspiration \u2014 and you don\u2019t have to be a member for a group to influence you.',
      examQuestion:'Distinguish between an associative, a dissociative, and an aspiration reference group, with an example of each.',
      mnemonic:null },

    { id:'ch4-word-of-mouth', term:'Word of mouth', tier:'must_know', lo:'4.4', chapterId:'ch4', section:'4.4',
      definition:'The influencing of people during conversations, considered the most powerful and authentic information source for consumers.',
      plain:'People telling other people what they really think about a product \u2014 usually the most trusted source of all, because it comes from someone with nothing to gain.',
      why:'Because it comes from a trusted source rather than the company itself, word of mouth is often more persuasive than advertising \u2014 which is why companies now try to generate positive buzz rather than relying only on ads.',
      example:'Deciding to try a new restaurant because three different friends independently raved about it is word of mouth at work.',
      textbookExample:'About 75 percent of all consumer conversations about brands happen face-to-face, and roughly 67 percent of U.S. consumer product sales are directly linked to word-of-mouth activity among friends, family, and colleagues.',
      commonMistake:'Students sometimes think word of mouth is only positive. Negative word of mouth, like false rumors about contamination, can spread just as powerfully and is often harder for a company to control.',
      examQuestion:'Why do marketers consider word of mouth more persuasive than traditional advertising, and what is "influencer marketing" an attempt to do with this effect?',
      mnemonic:null },

    { id:'ch4-problem-recognition', term:'Problem recognition', tier:'supporting', lo:'4.1', chapterId:'ch4', section:'4.1',
      definition:'Perceiving a difference between a person\u2019s ideal and actual situation big enough to trigger a decision.' },
    { id:'ch4-internal-search', term:'Internal search', tier:'supporting', lo:'4.1', chapterId:'ch4', section:'4.1',
      definition:'Scanning memory for previous experience with a product or brand.' },
    { id:'ch4-external-search', term:'External search', tier:'supporting', lo:'4.1', chapterId:'ch4', section:'4.1',
      definition:'Seeking information outside personal memory when past experience is insufficient, perceived risk is high, or gathering information is cheap.' },
    { id:'ch4-personal-sources', term:'Personal sources', tier:'supporting', lo:'4.1', chapterId:'ch4', section:'4.1',
      definition:'Friends, relatives, and social networks used as information sources.' },
    { id:'ch4-public-sources', term:'Public sources', tier:'supporting', lo:'4.1', chapterId:'ch4', section:'4.1',
      definition:'Independent rating organizations, government agencies, and consumer media used as information sources.' },
    { id:'ch4-marketer-dominated-sources', term:'Marketer-dominated sources', tier:'supporting', lo:'4.1', chapterId:'ch4', section:'4.1',
      definition:'Advertising, company websites, salespeople, and point-of-purchase displays used as information sources.' },
    { id:'ch4-evaluative-criteria', term:'Evaluative criteria', tier:'supporting', lo:'4.1', chapterId:'ch4', section:'4.1',
      definition:'The objective and subjective attributes a consumer uses to compare brands.' },
    { id:'ch4-postpurchase-behavior', term:'Postpurchase behavior', tier:'supporting', lo:'4.1', chapterId:'ch4', section:'4.1',
      definition:'The stage in which a consumer compares a purchased product to expectations, leading to satisfaction or dissatisfaction.' },
    { id:'ch4-consumer-touchpoints', term:'Consumer touchpoints', tier:'supporting', lo:'4.1', chapterId:'ch4', section:'4.1',
      definition:'A brand\u2019s points of contact with a consumer before, during, and after a purchase.' },
    { id:'ch4-consumer-journey-map', term:'Consumer journey map', tier:'supporting', lo:'4.1', chapterId:'ch4', section:'4.1',
      definition:'A visual representation of all the touchpoints for a consumer who comes into contact with a company\u2019s products, services, or brands before, during, and after a purchase.' },
    { id:'ch4-limited-problem-solving', term:'Limited problem solving', tier:'supporting', lo:'4.2', chapterId:'ch4', section:'4.2',
      definition:'A moderate-involvement process where consumers seek some information or rely on a friend to evaluate a few alternatives.' },
    { id:'ch4-routine-problem-solving', term:'Routine problem solving', tier:'supporting', lo:'4.2', chapterId:'ch4', section:'4.2',
      definition:'A low-involvement, habitual purchase process with virtually no external search, typical of frequently bought items.' },
    { id:'ch4-situational-influences', term:'Situational influences', tier:'supporting', lo:'4.2', chapterId:'ch4', section:'4.2',
      definition:'Purchase task, social surroundings, physical surroundings, temporal effects, and antecedent states that affect the purchase decision process.' },
    { id:'ch4-antecedent-states', term:'Antecedent states', tier:'supporting', lo:'4.2', chapterId:'ch4', section:'4.2',
      definition:'A consumer\u2019s mood, cash on hand, or circumstances at the time that can influence purchase behavior and choice.' },
    { id:'ch4-personality', term:'Personality', tier:'supporting', lo:'4.3', chapterId:'ch4', section:'4.3',
      definition:'A person\u2019s consistent behaviors or responses to recurring situations.' },
    { id:'ch4-self-concept', term:'Self-concept', tier:'supporting', lo:'4.3', chapterId:'ch4', section:'4.3',
      definition:'The way people see themselves (actual self-concept) and the way they would like to be seen (ideal self-concept).' },
    { id:'ch4-perception', term:'Perception', tier:'supporting', lo:'4.3', chapterId:'ch4', section:'4.3',
      definition:'The process by which an individual selects, organizes, and interprets information to create a meaningful picture of the world.' },
    { id:'ch4-selective-exposure', term:'Selective exposure', tier:'supporting', lo:'4.3', chapterId:'ch4', section:'4.3',
      definition:'Paying attention to messages that are consistent with one\u2019s attitudes and beliefs, and ignoring inconsistent ones.' },
    { id:'ch4-selective-comprehension', term:'Selective comprehension', tier:'supporting', lo:'4.3', chapterId:'ch4', section:'4.3',
      definition:'Interpreting information so that it is consistent with a person\u2019s own attitudes and beliefs.' },
    { id:'ch4-selective-retention', term:'Selective retention', tier:'supporting', lo:'4.3', chapterId:'ch4', section:'4.3',
      definition:'The tendency not to remember all the information a person sees, reads, or hears, even minutes after exposure.' },
    { id:'ch4-subliminal-perception', term:'Subliminal perception', tier:'supporting', lo:'4.3', chapterId:'ch4', section:'4.3',
      definition:'Seeing or hearing messages without being consciously aware of them.' },
    { id:'ch4-learning', term:'Learning', tier:'supporting', lo:'4.3', chapterId:'ch4', section:'4.3',
      definition:'Behaviors that result from repeated experience and reasoning.' },
    { id:'ch4-behavioral-learning', term:'Behavioral learning', tier:'supporting', lo:'4.3', chapterId:'ch4', section:'4.3',
      definition:'The process of developing automatic responses to a situation through drive, cue, response, and reinforcement.' },
    { id:'ch4-stimulus-generalization', term:'Stimulus generalization', tier:'supporting', lo:'4.3', chapterId:'ch4', section:'4.3',
      definition:'When a response elicited by one stimulus is generalized to another, such as using the same brand name for different products.' },
    { id:'ch4-stimulus-discrimination', term:'Stimulus discrimination', tier:'supporting', lo:'4.3', chapterId:'ch4', section:'4.3',
      definition:'A person\u2019s ability to perceive differences among similar stimuli.' },
    { id:'ch4-cognitive-learning', term:'Cognitive learning', tier:'supporting', lo:'4.3', chapterId:'ch4', section:'4.3',
      definition:'Learning through thinking, reasoning, and mental problem solving without direct experience.' },
    { id:'ch4-attitude', term:'Attitude', tier:'supporting', lo:'4.3', chapterId:'ch4', section:'4.3',
      definition:'A learned predisposition to respond to an object or class of objects in a consistently favorable or unfavorable way.' },
    { id:'ch4-beliefs', term:'Beliefs', tier:'supporting', lo:'4.3', chapterId:'ch4', section:'4.3',
      definition:'A consumer\u2019s subjective perception of how a product or brand performs on different attributes.' },
    { id:'ch4-lifestyle', term:'Lifestyle', tier:'supporting', lo:'4.3', chapterId:'ch4', section:'4.3',
      definition:'A mode of living identified by how people spend their time and resources, what they consider important, and how they see themselves and the world.' },
    { id:'ch4-psychographics', term:'Psychographics', tier:'supporting', lo:'4.3', chapterId:'ch4', section:'4.3',
      definition:'Combining psychology, lifestyle, and demographics to uncover consumer motivations and segment consumers.' },
    { id:'ch4-vals', term:'VALS', tier:'supporting', lo:'4.3', chapterId:'ch4', section:'4.3',
      definition:'A framework that identifies eight consumer segments based on a person\u2019s primary motivation (ideals, achievement, self-expression) and resources.' },
    { id:'ch4-opinion-leaders', term:'Opinion leaders', tier:'supporting', lo:'4.4', chapterId:'ch4', section:'4.4',
      definition:'People who influence others\u2019 purchases through knowledge of or experience with particular products or services.' },
    { id:'ch4-influencer-marketing', term:'Influencer marketing', tier:'supporting', lo:'4.4', chapterId:'ch4', section:'4.4',
      definition:'The practice of identifying and recruiting influencers to advocate for a brand rather than only marketing to prospective buyers.' },
    { id:'ch4-buzz', term:'Buzz', tier:'supporting', lo:'4.4', chapterId:'ch4', section:'4.4',
      definition:'Popularity for a brand or product created through consumer word of mouth.' },
    { id:'ch4-associative-group', term:'Associative group', tier:'supporting', lo:'4.4', chapterId:'ch4', section:'4.4',
      definition:'A reference group a person actually belongs to.' },
    { id:'ch4-dissociative-group', term:'Dissociative group', tier:'supporting', lo:'4.4', chapterId:'ch4', section:'4.4',
      definition:'A reference group a person wishes to distance from.' },
    { id:'ch4-aspiration-group', term:'Aspiration group', tier:'supporting', lo:'4.4', chapterId:'ch4', section:'4.4',
      definition:'A reference group a person wishes to be identified with.' },
    { id:'ch4-brand-community', term:'Brand community', tier:'supporting', lo:'4.4', chapterId:'ch4', section:'4.4',
      definition:'A specialized group of consumers with structured relationships around a particular brand.' },
    { id:'ch4-net-promoter-score', term:'Net Promoter Score (NPS)', tier:'supporting', lo:'4.4', chapterId:'ch4', section:'4.4',
      definition:'A metric calculated as the percentage of promoters minus the percentage of detractors, measuring likelihood of customer recommendation.',
      formula:'NPS = % Promoters \u2212 % Detractors  (range: \u2212100 to +100)' },
    { id:'ch4-social-class', term:'Social class', tier:'supporting', lo:'4.4', chapterId:'ch4', section:'4.4',
      definition:'Relatively permanent, homogeneous divisions in society based on occupation, income source, and education.' },
    { id:'ch4-consumer-socialization', term:'Consumer socialization', tier:'supporting', lo:'4.4', chapterId:'ch4', section:'4.4',
      definition:'The process by which people acquire the skills, knowledge, and attitudes necessary to function as consumers.' },
    { id:'ch4-family-life-cycle', term:'Family life cycle', tier:'supporting', lo:'4.4', chapterId:'ch4', section:'4.4',
      definition:'The distinct phases a family progresses through from formation to retirement, each bringing identifiable purchasing behaviors.' },
    { id:'ch4-culture', term:'Culture', tier:'supporting', lo:'4.4', chapterId:'ch4', section:'4.4',
      definition:'The set of values, ideas, and attitudes that are learned and shared among the members of a group.' },
    { id:'ch4-subculture', term:'Subculture', tier:'supporting', lo:'4.4', chapterId:'ch4', section:'4.4',
      definition:'A subgroup within a larger national culture that shares its own distinct values, ideas, and attitudes.' },

    { id:'ch5-business-to-business-marketing', term:'Business-to-business marketing', tier:'must_know', lo:'5.1', chapterId:'ch5', section:'5.1',
      definition:'The marketing of products and services to companies, governments, or nonprofit organizations for use in the creation of products and services that they can produce and market to others.',
      plain:'Selling to other organizations instead of selling directly to individual shoppers.',
      why:'Over half of all U.S. business school graduates take jobs in firms that engage in business marketing, so understanding organizational buyers and their buying behavior is essential to a marketing career, not just a niche topic.',
      example:'A company that sells industrial-strength cleaning supplies to hotel chains, rather than to individual households, is engaged in business-to-business marketing.',
      textbookExample:'JCP Media, Inc. purchases over 100,000 tons of publication paper annually from about 10 companies worldwide to supply JCPenney\u2019s newspaper inserts and direct-mail pieces \u2014 a decision handled by professional buyers working within budget constraints, not an individual shopper.',
      commonMistake:'Students sometimes think B2B marketing is a small, specialized niche. In reality, organizational buyers\u2019 total annual purchases are far greater than those of ultimate consumers, since raw materials and parts get bought, processed, and resold multiple times before reaching a final consumer.',
      examQuestion:'Explain why the total annual purchases of organizational buyers are greater than those of ultimate consumers, using an example of a raw material moving through several buyers.',
      mnemonic:null },

    { id:'ch5-derived-demand', term:'Derived demand', tier:'must_know', lo:'5.2', chapterId:'ch5', section:'5.2',
      definition:'Demand for industrial products and services that is driven by, or derived from, demand for consumer products and services.',
      plain:'Businesses don\u2019t buy raw materials and equipment because they want them for their own sake \u2014 they buy them because consumers want the finished products those materials go into.',
      why:'Because industrial demand depends on end-consumer demand rather than a business buyer\u2019s own tastes, it can shift suddenly and dramatically whenever consumer demand changes \u2014 marketers who sell to organizations need to track consumer trends, not just their direct customer\u2019s preferences.',
      example:'A company that makes cardboard boxes sees its own sales rise and fall based on how much online shopping consumers are doing, not based on the box maker\u2019s own preferences.',
      textbookExample:'The demand for Weyerhaeuser\u2019s pulp and paper products is based on consumer demand for newspapers, FedEx packages, and disposable diapers; Whirlpool buys parts for washers and dryers based on anticipated future consumer demand, not current demand.',
      commonMistake:'Students sometimes think derived demand means demand is smaller or less important. It just means the demand\u2019s origin is indirect \u2014 it can still represent billions of dollars and can be highly volatile since it depends on forecasts of future consumer behavior.',
      examQuestion:'Explain why Whirlpool\u2019s demand for washer and dryer parts is described as "derived demand," and what this implies about how far in advance Whirlpool must place orders.',
      mnemonic:null },

    { id:'ch5-organizational-buying-criteria', term:'Organizational buying criteria', tier:'must_know', lo:'5.2', chapterId:'ch5', section:'5.2',
      definition:'The objective attributes of a potential supplier\u2019s products and services and the capabilities of the supplier itself that an organizational buyer weighs when making a purchase.',
      plain:'The specific checklist of things a business buyer judges a potential supplier against before deciding who to buy from.',
      why:'Suppliers that meet or exceed these criteria create customer value for organizational buyers, so understanding exactly which criteria matter most to a target buyer is critical for winning and keeping business accounts.',
      example:'A restaurant chain choosing a new produce supplier might weigh delivery reliability and freshness guarantees more heavily than price alone.',
      textbookExample:'When choosing among machine vision system products and suppliers, buyers rank performance (80%), technical support (68%), and ease of use (67%) far above price (48%) \u2014 showing price is often among the least frequently mentioned criteria.',
      commonMistake:'Students often assume price is always the most important organizational buying criterion. Research on real buying decisions, like the machine vision example, frequently shows factors like performance and technical support ranked well above price.',
      examQuestion:'Using the machine vision equipment example, explain why price ranked lower than performance and technical support among organizational buyers\u2019 selection criteria.',
      mnemonic:null },

    { id:'ch5-supply-partnership', term:'Supply partnership', tier:'must_know', lo:'5.2', chapterId:'ch5', section:'5.2',
      definition:'A relationship that exists when a buyer and its supplier adopt mutually beneficial objectives, policies, and procedures for the purpose of lowering the cost or increasing the value of products and services delivered to the ultimate consumer.',
      plain:'A long-term, deeply collaborative relationship between a buyer and supplier, where both sides work together as partners rather than negotiating at arm\u2019s length every time.',
      why:'Supply partnerships can lower costs and increase value for everyone down the supply chain, including the ultimate consumer, and represent the deepest kind of buyer-seller relationship a supplier can build.',
      example:'A bakery that works directly with a flour mill to co-develop a custom flour blend, sharing sales forecasts and quality data, has moved beyond a simple purchase agreement into a supply partnership.',
      textbookExample:'Milsco Manufacturing has designed and manufactured Harley-Davidson motorcycle seats since 1934 \u2014 a decades-long supply partnership built on shared objectives rather than a series of one-off purchase orders.',
      commonMistake:'Students sometimes confuse a supply partnership with a simple long-term contract. A long-term contract just extends the purchase agreement over time; a supply partnership specifically requires mutually beneficial objectives and shared procedures.',
      examQuestion:'Explain the difference between a long-term contract and a supply partnership, using the Harley-Davidson and Milsco Manufacturing relationship as an example.',
      mnemonic:null },

    { id:'ch5-buying-center', term:'Buying center', tier:'must_know', lo:'5.3', chapterId:'ch5', section:'5.3',
      definition:'A group of people in an organization who participate in the buying decision-making process and share common goals, risks, and knowledge important to a purchase decision.',
      plain:'The informal or formal team of people inside a company who all have a say in a big purchase decision, even if they don\u2019t all have the same job title.',
      why:'Understanding who is actually in the buying center \u2014 not just who holds the purchasing manager title \u2014 is essential for marketers, since selling only to the official buyer while ignoring influential engineers or end users can lose the sale.',
      example:'When a hospital buys new patient-monitoring equipment, the buying center might include nurses (users), a biomedical engineer (influencer), and a hospital administrator (decider), not just the purchasing department.',
      textbookExample:'For most large multistore chain retailers, such as Target and 7-Eleven, the buying center is highly formalized and called a buying committee, while most industrial firms and government units use informal groups or meetings to arrive at buying decisions.',
      commonMistake:'Students often assume the buying center is always a single, official department. In reality it\u2019s typically 6 to 10 individuals from different functional areas, and its makeup changes depending on the specific item being purchased.',
      examQuestion:'List the four questions a marketer should ask to understand a target organization\u2019s buying center, and explain why the answers might differ for a routine purchase versus a major new equipment purchase.',
      mnemonic:null },

    { id:'ch5-buy-classes', term:'Buy classes', tier:'must_know', lo:'5.3', chapterId:'ch5', section:'5.3',
      definition:'The three types of buying situations \u2014 new buy, straight rebuy, and modified rebuy \u2014 that describe how much effort and how many people are typically involved in an organizational purchase.',
      plain:'A way of classifying how routine or how brand-new a business purchase is, which determines how many people get involved in deciding and how long it takes.',
      why:'The buy class largely determines how the buying center behaves, so marketers tailor their sales approach very differently depending on which buy class they\u2019re selling into.',
      example:'A company ordering its usual monthly shipment of printer paper is in a very different buy class than the same company evaluating an entirely new piece of manufacturing equipment for the first time.',
      textbookExample:'BMW\u2019s recent purchase of a multimillion-dollar cloud-based data management system from IBM represents a new buy \u2014 involving many people, a long decision time, and greater risk \u2014 while reordering standard office supplies is typically handled as a straight rebuy by a single buyer.',
      commonMistake:'Students sometimes think a modified rebuy is just a smaller version of a new buy. It\u2019s actually its own distinct middle category \u2014 the product is largely the same as a past purchase, but a specific change requires enlarging the buying center.',
      examQuestion:'Explain how the number of people involved, the decision time, and the suppliers considered differ across a new buy, a straight rebuy, and a modified rebuy.',
      mnemonic:null },

    { id:'ch5-new-buy', term:'New buy', tier:'must_know', lo:'5.3', chapterId:'ch5', section:'5.3',
      definition:'A buying situation in which the organization is a first-time buyer of a product or service, typically involving many people in the buying center, a long decision time, and greater risk.',
      plain:'The buying situation where a company is purchasing something it has genuinely never bought before, so almost everyone potentially affected gets pulled into the decision.',
      why:'Because the risk and uncertainty are highest in a new buy, this is where a new supplier has the best chance of breaking into a relationship with an organization that previously bought exclusively from a competitor.',
      example:'A small clinic buying its very first electronic health records system, with no prior experience to fall back on, is in a new buy situation.',
      textbookExample:'BMW\u2019s purchase of a multimillion-dollar cloud-based data management system from IBM is described as a new buy, since BMW had a stake in getting this unprecedented decision right and needed to involve many people from across the organization.',
      commonMistake:'Students sometimes think "new buy" just means a first purchase from a particular supplier. It actually means the organization has never bought this type of product or service before at all \u2014 switching suppliers for something you already buy regularly is usually a modified rebuy.',
      examQuestion:'Why does a new buy situation typically involve more people and take longer than a straight rebuy?',
      mnemonic:null },

    { id:'ch5-straight-rebuy', term:'Straight rebuy', tier:'must_know', lo:'5.3', chapterId:'ch5', section:'5.3',
      definition:'A buying situation in which the buyer or purchasing manager reorders an existing product or service from the list of acceptable suppliers, typically without input from other buying center members.',
      plain:'Just reordering the same thing from the same supplier as always, with almost no discussion needed.',
      why:'Straight rebuys represent the vast majority of organizational purchases by volume, and because they\u2019re low-effort and low-risk for the buyer, they\u2019re also the hardest purchases for a new competing supplier to break into.',
      example:'A restaurant manager reordering the same brand of napkins from the same distributor every month, without comparing other options, is a straight rebuy.',
      textbookExample:'Office supplies and maintenance services are usually obtained as straight rebuys, reordered by the buyer or purchasing manager probably without even checking with users or influencers from other departments.',
      commonMistake:'Students sometimes think straight rebuys never change suppliers. If the users, influencers, or deciders want to change the price, delivery schedule, or supplier, the situation becomes a modified rebuy instead.',
      examQuestion:'What has to change for a straight rebuy to become a modified rebuy instead?',
      mnemonic:null },

    { id:'ch5-e-marketplaces', term:'E-marketplaces', tier:'must_know', lo:'5.4', chapterId:'ch5', section:'5.4',
      definition:'Online trading communities that bring together buyer and supplier organizations to enable the real-time exchange of information, money, products, and services.',
      plain:'Online hubs where many business buyers and many business sellers meet to trade with each other, similar to how a physical marketplace brings vendors and shoppers together.',
      why:'E-marketplaces can dramatically cut the cost of finding suppliers and completing purchases, which is part of why organizational buyers now account for about 70 percent of the global dollar value of all online transactions.',
      example:'A small manufacturer looking for a new supplier of packaging materials might search an industry-specific e-marketplace instead of cold-calling individual suppliers one at a time.',
      textbookExample:'Independent e-marketplaces like Amazon Business, PlasticsNet, Hospital Network.com, and TextileWeb act as neutral third parties charging a fee, while private exchanges like Neogrid connect large companies such as Best Buy, Campbell Soup, and Walgreens directly with their own qualified suppliers.',
      commonMistake:'Students often conflate all e-marketplaces as identical. The chapter distinguishes independent e-marketplaces (neutral third parties open to many buyers and sellers) from private exchanges (owned by one company to link it with its own specific network).',
      examQuestion:'Explain the difference between an independent e-marketplace and a private exchange, with an example of each.',
      mnemonic:null },

    { id:'ch5-reverse-auction', term:'Reverse auction', tier:'must_know', lo:'5.4', chapterId:'ch5', section:'5.4',
      definition:'An online auction in which a buyer communicates a need for a product or service and would-be suppliers are invited to bid against each other, with the winning bid being the lowest price.',
      plain:'An auction that runs backwards from what most people picture \u2014 instead of buyers competing to offer the highest price, sellers compete to offer the lowest price to win the business.',
      why:'Reverse auctions let organizational buyers capture real cost savings by pitting suppliers against each other on price, which is why buyers tend to favor them even though suppliers are often more cautious about participating.',
      example:'A school district needing a new bus maintenance contract might post the job and let several repair companies bid the price down until only the lowest bidder remains.',
      textbookExample:'Nike has used a reverse auction to have advertising agencies submit competing bids for the company\u2019s multimillion-dollar advertising media program specifically to reduce cost.',
      commonMistake:'Students often mix up traditional and reverse auctions. In a traditional auction, one seller and many buyers push the price up; in a reverse auction, one buyer and many sellers push the price down \u2014 the direction of price pressure is exactly opposite.',
      examQuestion:'Explain why suppliers are often more cautious about participating in reverse auctions than buyers are, even though both are online auction formats.',
      mnemonic:'Reverse auction = price reverses direction: it goes DOWN, not up.' },

    { id:'ch5-organizational-buyers', term:'Organizational buyers', tier:'supporting', lo:'5.1', chapterId:'ch5', section:'5.1',
      definition:'Those manufacturers, wholesalers, retailers, service companies, nonprofit organizations, and government agencies that buy products and services for their own use or for resale.' },
    { id:'ch5-industrial-market', term:'Industrial market', tier:'supporting', lo:'5.1', chapterId:'ch5', section:'5.1',
      definition:'The organizational market made up of about 7.5 million firms that in some way reprocess a product or service before reselling it to the next buyer.' },
    { id:'ch5-reseller-market', term:'Reseller market', tier:'supporting', lo:'5.1', chapterId:'ch5', section:'5.1',
      definition:'The organizational market made up of over 1 million retailers and 250,000 wholesalers that buy physical products and resell them again without any reprocessing.' },
    { id:'ch5-government-market', term:'Government market', tier:'supporting', lo:'5.1', chapterId:'ch5', section:'5.1',
      definition:'The organizational market made up of over 90,000 federal, state, and local government units that buy goods and services for the constituents they serve.' },
    { id:'ch5-naics', term:'NAICS', tier:'supporting', lo:'5.1', chapterId:'ch5', section:'5.1',
      definition:'The North American Industry Classification System, which provides common industry definitions for Canada, Mexico, and the United States to help measure the size of organizational markets.' },
    { id:'ch5-organizational-buying-behavior', term:'Organizational buying behavior', tier:'supporting', lo:'5.3', chapterId:'ch5', section:'5.3',
      definition:'The decision-making process that organizations use to establish the need for products and services and identify, evaluate, and choose among alternative brands and suppliers.' },
    { id:'ch5-vendors', term:'Vendors', tier:'supporting', lo:'5.2', chapterId:'ch5', section:'5.2',
      definition:'Suppliers from whom an organization\u2019s buying function gathers information about products, services, prices, and terms.' },
    { id:'ch5-sustainable-procurement', term:'Sustainable procurement', tier:'supporting', lo:'5.2', chapterId:'ch5', section:'5.2',
      definition:'An approach that aims to integrate environmental considerations into all stages of an organization\u2019s buying process to reduce the negative impact on human health and the environment.' },
    { id:'ch5-supplier-development', term:'Supplier development', tier:'supporting', lo:'5.2', chapterId:'ch5', section:'5.2',
      definition:'The deliberate effort by organizational buyers to build relationships that shape suppliers\u2019 products, services, and capabilities to fit the needs of the buyer and its customers.' },
    { id:'ch5-reciprocity', term:'Reciprocity', tier:'supporting', lo:'5.2', chapterId:'ch5', section:'5.2',
      definition:'An industrial buying practice in which two organizations agree to purchase each other\u2019s products and services.' },
    { id:'ch5-buying-committee', term:'Buying committee', tier:'supporting', lo:'5.3', chapterId:'ch5', section:'5.3',
      definition:'A highly formalized buying center used especially by large multistore chain retailers to make purchasing decisions.' },
    { id:'ch5-users', term:'Users', tier:'supporting', lo:'5.3', chapterId:'ch5', section:'5.3',
      definition:'The people in an organization who actually use the product or service being purchased.' },
    { id:'ch5-influencers', term:'Influencers', tier:'supporting', lo:'5.3', chapterId:'ch5', section:'5.3',
      definition:'People in a buying center who affect the buying decision, usually by helping define the specifications for what is bought.' },
    { id:'ch5-buyers-role', term:'Buyers (buying center role)', tier:'supporting', lo:'5.3', chapterId:'ch5', section:'5.3',
      definition:'People in a buying center who have formal authority and responsibility to select the supplier and negotiate the terms of the contract.' },
    { id:'ch5-deciders', term:'Deciders', tier:'supporting', lo:'5.3', chapterId:'ch5', section:'5.3',
      definition:'People in a buying center who have the formal or informal power to select or approve the supplier that receives the contract.' },
    { id:'ch5-gatekeepers', term:'Gatekeepers', tier:'supporting', lo:'5.3', chapterId:'ch5', section:'5.3',
      definition:'People in a buying center who control the flow of information to other members of the group.' },
    { id:'ch5-modified-rebuy', term:'Modified rebuy', tier:'supporting', lo:'5.3', chapterId:'ch5', section:'5.3',
      definition:'A buying situation in which the item purchased is largely the same as a past purchase, but users, influencers, or deciders want to change the product specifications, price, delivery schedule, or supplier.' },
    { id:'ch5-b2b-exchanges', term:'B2B exchanges', tier:'supporting', lo:'5.4', chapterId:'ch5', section:'5.4',
      definition:'Another name for e-marketplaces, the online trading communities that connect business buyers and sellers; also called e-hubs.' },
    { id:'ch5-independent-e-marketplaces', term:'Independent e-marketplaces', tier:'supporting', lo:'5.4', chapterId:'ch5', section:'5.4',
      definition:'E-marketplaces that act as a neutral third party, providing an internet technology trading platform and a centralized market that enables exchanges between buyers and sellers for a fee.' },
    { id:'ch5-private-exchanges', term:'Private exchanges', tier:'supporting', lo:'5.4', chapterId:'ch5', section:'5.4',
      definition:'E-marketplaces that link one large company with its own network of qualified suppliers and customers, representing the interests of their owner rather than acting as a neutral third party.' },
    { id:'ch5-traditional-auction', term:'Traditional auction', tier:'supporting', lo:'5.4', chapterId:'ch5', section:'5.4',
      definition:'An online auction in which a seller puts up an item for sale and would-be buyers bid against each other, with the winning bid being the highest price.' },

    { id:'ch7-marketing-research', term:'Marketing research', tier:'must_know', lo:'7.1', chapterId:'ch7', section:'7.1',
      definition:'The process of defining a marketing problem and opportunity, systematically collecting and analyzing information, and recommending actions.',
      plain:'It\u2019s the structured way marketers answer a specific question \u2014 not guessing, but following a process to gather real evidence before making a decision.',
      why:'Marketing decisions are risky and expensive. Research doesn\u2019t guarantee a right answer, but it reduces the odds of a costly mistake by grounding decisions in evidence instead of assumptions.',
      example:'Before choosing between two flavors for a new sports drink, a small company might survey 200 people in a mall instead of just picking its founder\u2019s favorite flavor.',
      textbookExample:'Movie studios use marketing research \u2014 including title testing, concept testing, and test screenings \u2014 to reduce the risk of box-office flops; changing "A Man Called Ove" to "A Man Called Otto" for U.S. audiences is one real example.',
      commonMistake:'Students often think marketing research means only surveys. In reality it covers the entire process \u2014 defining the problem, planning, collecting data (secondary or primary, including observation and experiments), analyzing it, and recommending action \u2014 not just the data-collection step.',
      examQuestion:'Why do studios test different titles for the same movie before its release, and what is this process called?',
      mnemonic:'Marketing research = Ask before you Act.' },

    { id:'ch7-data', term:'Data', tier:'supporting', lo:'7.3', chapterId:'ch7', section:'7.3',
      definition:'The facts and figures pertinent to a marketing project, divided into secondary data and primary data.' },
    { id:'ch7-secondary-data', term:'Secondary data', tier:'must_know', lo:'7.3', chapterId:'ch7', section:'7.3',
      definition:'Facts and figures that have already been recorded prior to the project at hand.',
      plain:'Data that already exists somewhere \u2014 someone already collected it for another reason, and you\u2019re just reusing it.',
      why:'It\u2019s almost always faster and cheaper than collecting new data yourself, so smart researchers check secondary sources first before spending money on primary research.',
      example:'A local bakery deciding where to open a second location could pull free U.S. Census data on neighborhood income and population instead of running its own survey.',
      textbookExample:'Marketers use the U.S. Census Bureau\u2019s Census 2020 and the American Community Survey to learn about age, income, and household characteristics of consumers without conducting any original research.',
      commonMistake:'Students sometimes assume secondary data is automatically worse than primary data. It\u2019s not \u2014 it\u2019s just collected for a different original purpose, which can make it outdated or not specific enough, but it is often more detailed and far cheaper to obtain.',
      examQuestion:'What are the advantages and disadvantages of using secondary data compared to primary data?',
      mnemonic:'Secondary = Someone else already did it.' },

    { id:'ch7-primary-data', term:'Primary data', tier:'must_know', lo:'7.3', chapterId:'ch7', section:'7.3',
      definition:'Facts and figures that are newly collected for the project at hand.',
      plain:'Data you go out and gather yourself, specifically to answer your current question.',
      why:'When no existing data can answer your specific question, primary data is the only way to get an exact, up-to-date answer \u2014 even though it costs more time and money.',
      example:'A coffee shop testing two new drink names might hand out a short in-store survey asking customers which name they prefer.',
      textbookExample:'LEGO Group had 10 teams of middle school students actually play with two SPIKE Prime kit designs and measured how long it took each team to build a working robot \u2014 that timed observation is primary data collected specifically for that decision.',
      commonMistake:'Students often think "primary" means "more important." It actually just means newly collected for this specific project \u2014 it\u2019s not inherently better than secondary data, just more current and specific, and usually more expensive.',
      examQuestion:'LEGO Group wants to know exactly how long it takes 10 teams of students to build two competing robot kits. Is this primary or secondary data, and why?',
      mnemonic:'Primary = Personally gathered, right now.' },

    { id:'ch7-observational-data', term:'Observational data', tier:'must_know', lo:'7.4', chapterId:'ch7', section:'7.4',
      definition:'Data obtained by watching how people actually behave, collected through mechanical, personal, or neuromarketing methods.',
      plain:'Instead of asking people what they do, you just watch them do it.',
      why:'What people say they do and what they actually do are often different \u2014 observation captures real behavior without relying on people\u2019s memory or honesty.',
      example:'A grocery store manager might quietly watch which shelf height customers reach for most often instead of asking them to guess.',
      textbookExample:'Nielsen\u2019s portable people meter is worn or carried by panel members in about 42,000 U.S. households, automatically recording exactly which TV programs are playing nearby \u2014 no self-reporting required.',
      commonMistake:'Students sometimes think observation can explain why people behave a certain way. The textbook is explicit that observation reveals what people do but cannot easily reveal why \u2014 that requires asking questions instead.',
      examQuestion:'Explain one advantage and one disadvantage of using observational data instead of asking consumers questions directly.',
      mnemonic:null },

    { id:'ch7-questionnaire-data', term:'Questionnaire data', tier:'must_know', lo:'7.4', chapterId:'ch7', section:'7.4',
      definition:'Facts and figures obtained by asking people about their attitudes, awareness, intentions, and behaviors.',
      plain:'Data you get by directly asking people questions, either to generate new ideas or to evaluate existing ones.',
      why:'Some information \u2014 like attitudes, intentions, or the reasons behind a purchase \u2014 can only be discovered by asking, since it can\u2019t be directly observed.',
      example:'A gym might text past members a short survey asking why they canceled their membership.',
      textbookExample:'Wendy\u2019s used a questionnaire with open-ended, dichotomous, semantic-differential-scale, and Likert-scale questions to learn what fast-food customers valued most.',
      commonMistake:'Students often confuse idea generation methods (like focus groups, used early to discover new ideas) with idea evaluation methods (like large-sample surveys, used later to test those ideas).',
      examQuestion:'A company wants to test consumer reactions to three already-designed logo options using a large, representative sample. Should it use an idea generation method or an idea evaluation method?',
      mnemonic:null },

    { id:'ch7-focus-group', term:'Focus group', tier:'must_know', lo:'7.4', chapterId:'ch7', section:'7.4',
      definition:'An informal session of 6 to 10 present, past, or prospective customers led by a moderator to discuss a firm\u2019s products or those of its competitors.',
      plain:'A small group discussion, guided by a moderator, where people talk through their honest reactions to a product or idea.',
      why:'It\u2019s a fast, relatively cheap way to generate fresh ideas and hear the specific language and reasoning customers use \u2014 often before a company commits to a large, expensive survey.',
      example:'A streaming service might invite eight subscribers to a video call to react to three potential redesigns of its home screen.',
      textbookExample:'Marketing instructors and students in focus groups both recommended providing textbook answers to end-of-chapter Learning Review questions directly in the SmartBook version \u2014 a suggestion the publisher actually followed.',
      commonMistake:'Students sometimes assume focus group results can be generalized to the whole market like a large survey can. Because focus groups use a small, informal sample, they\u2019re best used to generate ideas, not confirm how the whole market will react.',
      examQuestion:'Why might a company run a focus group before designing a large-scale questionnaire, rather than the other way around?',
      mnemonic:null },

    { id:'ch7-experiment', term:'Experiment', tier:'must_know', lo:'7.4', chapterId:'ch7', section:'7.4',
      definition:'A method that involves manipulating factors under tightly controlled conditions to test cause and effect.',
      plain:'You deliberately change one thing (like a price or an ad) and hold everything else constant, so you can see exactly what effect that one change causes.',
      why:'Experiments are the best tool marketers have for proving cause and effect \u2014 that a specific marketing action actually caused a specific change in behavior \u2014 rather than just noticing two things happened around the same time.',
      example:'A coffee shop could raise the price of one drink at only one of its five locations for a month to see exactly how much sales drop.',
      textbookExample:'McDonald\u2019s tested its delivery service in three geographic test markets before expanding it, and separately tested selling Krispy Kreme doughnuts in nine of its Kentucky restaurants before a wider rollout.',
      commonMistake:'Students often forget that outside factors, like a competitor\u2019s own price change happening at the same time, can distort an experiment\u2019s results \u2014 a good researcher has to identify and try to control for these.',
      examQuestion:'In marketing experiments, what is a "dependent variable" and what are "marketing drivers," and how does a test market help study them?',
      mnemonic:'Experiment = Experimentally change ONE thing.' },

    { id:'ch7-neuromarketing', term:'Neuromarketing', tier:'must_know', lo:'7.4', chapterId:'ch7', section:'7.4',
      definition:'A field of study that merges brain-scanning and other neuroscience technologies with marketing\u2019s interest in understanding consumers\u2019 nonconscious responses.',
      plain:'Using tools that study brain activity, eye movement, or biometric signals to see how people really react to marketing, beneath what they\u2019d consciously say.',
      why:'People aren\u2019t always able to accurately explain why they like or dislike something \u2014 neuromarketing tries to bypass that limitation by measuring the brain\u2019s actual response directly.',
      example:'A snack brand might use eye-tracking glasses to see exactly which part of a cereal box shoppers look at first on the shelf.',
      textbookExample:'Based on neuromarketing studies of its soup labels, Campbell Soup Company changed most of its can designs \u2014 showing steam rising from more vibrant images, removing the "unemotional spoon," and shrinking and repositioning its logo.',
      commonMistake:'Students sometimes think neuromarketing replaces traditional research entirely. The textbook frames it as one additional observational tool, often used alongside eye tracking, biometric monitoring, and facial coding \u2014 not a total replacement for surveys or focus groups.',
      examQuestion:'How did neuromarketing research change the physical design of Campbell\u2019s soup can labels?',
      mnemonic:null },

    { id:'ch7-big-data', term:'Big data', tier:'must_know', lo:'7.5', chapterId:'ch7', section:'7.5',
      definition:'A vague term generally used to describe large amounts of data collected from a variety of sources and analyzed with an increasingly sophisticated set of technologies.',
      plain:'An enormous, messy pile of data coming in from many different places at once \u2014 too much for a person to make sense of without special tools.',
      why:'Today\u2019s marketers aren\u2019t short on data; they\u2019re often overwhelmed by it. The challenge has shifted from collecting data to turning huge amounts of it into something useful.',
      example:'A national coffee chain might combine mobile app orders, loyalty card swipes, and social media mentions from every store into one enormous pool of data.',
      textbookExample:'The textbook notes that tools like Apache\u2019s Hadoop and Google\u2019s Cloud Bigtable exist specifically to store and analyze the kind of enormous, varied datasets that make up big data.',
      commonMistake:'Students often use "big data" and "data analytics" interchangeably. Big data is the raw material \u2014 the huge collected dataset itself \u2014 while data analytics is the set of tools used to interpret it.',
      examQuestion:'What specific challenge does big data create for marketing managers, according to the chapter?',
      mnemonic:null },

    { id:'ch7-data-analytics', term:'Data analytics', tier:'must_know', lo:'7.5', chapterId:'ch7', section:'7.5',
      definition:'Tools used to organize, manipulate, and interpret data, often to answer specific buying queries such as who buys, how much, and why.',
      plain:'The process of asking a big pile of data specific questions and turning the answers into charts, tables, or insights a manager can actually act on.',
      why:'Collecting massive amounts of data is worthless if no one can turn it into a clear, specific answer \u2014 data analytics is the step that makes big data usable for real decisions.',
      example:'A gym chain might use data analytics to find out which membership tier its Tuesday-evening yoga attendees are most likely to buy.',
      textbookExample:'In an intelligent enterprise platform, marketing researchers use analytical tools to organize data stored in a data warehouse and present results as tables and graphics that answer questions like "who buys?" and "how much?"',
      commonMistake:'Students sometimes think data analytics only produces charts. The textbook emphasizes it also supports sensitivity analysis \u2014 asking "what if" questions about how changing a price or promotion driver might affect sales.',
      examQuestion:'Describe how a marketing researcher might use data analytics to answer the question "why do customers buy our product?"',
      mnemonic:null },

    { id:'ch7-data-mining', term:'Data mining', tier:'must_know', lo:'7.5', chapterId:'ch7', section:'7.5',
      definition:'The extraction of hidden predictive information from large databases to find statistical links between consumer purchasing patterns and marketing actions.',
      plain:'Digging through a giant database to find surprising, non-obvious patterns that no one specifically went looking for.',
      why:'Some of the most valuable insights aren\u2019t the ones you already suspected \u2014 data mining can surface unexpected connections a manager would never think to test directly.',
      example:'An online bookstore\u2019s data-mining software might notice that customers who buy cookbooks also tend to buy kitchen timers, even though no one had connected the two products before.',
      textbookExample:'Supermarkets mining checkout scanner data discovered that men buying diapers in the evening also tended to buy a six-pack of beer, so retailers placed diapers and beer near each other \u2014 with potato chips in between \u2014 and increased sales of all three items.',
      commonMistake:'Students often confuse data mining with predictive modeling. Data mining finds the hidden pattern in past data; predictive modeling then uses statistical models built from that mining to forecast future outcomes.',
      examQuestion:'Explain the famous "diapers and beer" example and what it demonstrates about data mining.',
      mnemonic:'Data mining = Digging for hidden gems in the data.' },

    { id:'ch7-sales-forecast', term:'Sales forecast', tier:'must_know', lo:'7.6', chapterId:'ch7', section:'7.6',
      definition:'The total sales of a product that a firm expects to sell during a specified future time period under specified environmental conditions and its own marketing efforts.',
      plain:'A prediction of how much of a product a company will actually sell in the future, assuming certain conditions hold.',
      why:'Almost every part of a business \u2014 production schedules, staffing, budgets \u2014 depends on a reasonably accurate estimate of future sales, which is why forecasting is a key goal of many marketing research studies.',
      example:'A local bakery might forecast it will sell 500 birthday cakes next quarter based on this year\u2019s trend and an upcoming local festival.',
      textbookExample:'Betty Crocker might develop a sales forecast of 4 million cases of cake mix for U.S. consumers in 2025, assuming consumer dessert preferences stay constant and competitors don\u2019t sharply change prices.',
      commonMistake:'Students often think there\u2019s one "correct" forecasting method. The textbook presents three different approaches \u2014 judgments of the decision maker, surveys of knowledgeable groups, and statistical methods \u2014 because no single method works best in every situation.',
      examQuestion:'Name and briefly describe the three main approaches to developing a sales forecast.',
      mnemonic:'Judge it, Ask it, or Crunch it.' },

    { id:'ch7-decision', term:'Decision', tier:'supporting', lo:'7.2', chapterId:'ch7', section:'7.2',
      definition:'A conscious choice from among two or more alternatives.' },
    { id:'ch7-decision-making', term:'Decision making', tier:'supporting', lo:'7.2', chapterId:'ch7', section:'7.2',
      definition:'The act of consciously choosing from among alternatives.' },
    { id:'ch7-research-objectives', term:'Research objectives', tier:'supporting', lo:'7.2', chapterId:'ch7', section:'7.2',
      definition:'Specific, measurable goals the decision maker seeks to achieve in conducting the marketing research.' },
    { id:'ch7-measures-of-success', term:'Measures of success', tier:'supporting', lo:'7.2', chapterId:'ch7', section:'7.2',
      definition:'Criteria or standards used in evaluating proposed solutions to the problem.' },
    { id:'ch7-constraints', term:'Constraints', tier:'supporting', lo:'7.2', chapterId:'ch7', section:'7.2',
      definition:'The restrictions placed on potential solutions to a problem, such as limits on time and money.' },
    { id:'ch7-internal-secondary-data', term:'Internal secondary data', tier:'supporting', lo:'7.3', chapterId:'ch7', section:'7.3',
      definition:'Secondary data that originates from within the organization needing the research, such as sales reports, budgets, and customer communications.' },
    { id:'ch7-external-secondary-data', term:'External secondary data', tier:'supporting', lo:'7.3', chapterId:'ch7', section:'7.3',
      definition:'Secondary data that comes from outside the organization needing the research, such as U.S. Census reports, trade association studies, and business periodicals.' },
    { id:'ch7-marketing-input-data', term:'Marketing input data', tier:'supporting', lo:'7.3', chapterId:'ch7', section:'7.3',
      definition:'Internal secondary data related to the effort expended to make sales, such as advertising expenditures and salesperson call reports.' },
    { id:'ch7-marketing-outcome-data', term:'Marketing outcome data', tier:'supporting', lo:'7.3', chapterId:'ch7', section:'7.3',
      definition:'Internal secondary data related to the results of marketing efforts, such as sales figures broken down by representative, industry, or region.' },
    { id:'ch7-new-product-concept', term:'New-product concept', tier:'supporting', lo:'7.3', chapterId:'ch7', section:'7.3',
      definition:'A picture or verbal description of a product or service a firm might offer for sale, used to gauge consumer reactions.' },
    { id:'ch7-methods', term:'Methods', tier:'supporting', lo:'7.3', chapterId:'ch7', section:'7.3',
      definition:'The approaches that can be used to collect data to solve all or part of a research problem.' },
    { id:'ch7-sampling', term:'Sampling', tier:'supporting', lo:'7.3', chapterId:'ch7', section:'7.3',
      definition:'Selecting a representative group of distributors, customers, or prospects and asking them questions, treating their answers as typical of the larger group.' },
    { id:'ch7-statistical-inference', term:'Statistical inference', tier:'supporting', lo:'7.3', chapterId:'ch7', section:'7.3',
      definition:'Generalizing the results from a sample to a much larger group of distributors, customers, or prospects.' },
    { id:'ch7-portable-people-meter', term:'Portable people meter', tier:'supporting', lo:'7.4', chapterId:'ch7', section:'7.4',
      definition:'A mechanical observational device worn or carried by panel members that automatically records which TV program is being watched.' },
    { id:'ch7-mystery-shopper', term:'Mystery shopper', tier:'supporting', lo:'7.4', chapterId:'ch7', section:'7.4',
      definition:'A researcher paid by a company to shop at its own or a competitor\u2019s stores to evaluate product availability, pricing, and customer service.' },
    { id:'ch7-ethnographic-research', term:'Ethnographic research', tier:'supporting', lo:'7.4', chapterId:'ch7', section:'7.4',
      definition:'A specialized observational approach in which trained observers seek to discover subtle behavioral and emotional reactions as consumers encounter products in their natural use environment.',
      example:'Best Buy researchers "shop-alonged" with customers in their homes to see how they actually used fitness equipment alongside consumer electronics.' },
    { id:'ch7-panel', term:'Panel', tier:'supporting', lo:'7.4', chapterId:'ch7', section:'7.4',
      definition:'A sample of consumers or stores from which researchers take repeated measurements over time.',
      example:'The NPD Group tracks purchases from a panel of nearly 2 million consumers worldwide to see how buying habits shift over time.' },
    { id:'ch7-test-markets', term:'Test markets', tier:'supporting', lo:'7.4', chapterId:'ch7', section:'7.4',
      definition:'A small geographic area where a company offers a product for sale to evaluate a potential marketing action before a wider rollout.' },
    { id:'ch7-individual-interview', term:'Individual interview', tier:'supporting', lo:'7.4', chapterId:'ch7', section:'7.4',
      definition:'A single researcher asking questions of one respondent, allowing follow-up probing but at high cost.' },
    { id:'ch7-depth-interview', term:'Depth interview', tier:'supporting', lo:'7.4', chapterId:'ch7', section:'7.4',
      definition:'A type of individual interview involving lengthy, free-flowing questions to probe underlying ideas and feelings.' },
    { id:'ch7-open-ended-question', term:'Open-ended question', tier:'supporting', lo:'7.4', chapterId:'ch7', section:'7.4',
      definition:'A question that allows respondents to express opinions, ideas, or behaviors in their own words, without predetermined answer choices.' },
    { id:'ch7-closed-end-question', term:'Closed-end question', tier:'supporting', lo:'7.4', chapterId:'ch7', section:'7.4',
      definition:'A fixed-alternative question requiring respondents to select one or more predetermined response options.' },
    { id:'ch7-dichotomous-question', term:'Dichotomous question', tier:'supporting', lo:'7.4', chapterId:'ch7', section:'7.4',
      definition:'The simplest form of a fixed-alternative question, allowing only a "yes" or "no" response.' },
    { id:'ch7-semantic-differential-scale', term:'Semantic differential scale', tier:'supporting', lo:'7.4', chapterId:'ch7', section:'7.4',
      definition:'A scale with three or more choices where the two opposite ends have one- or two-word opposite meanings.' },
    { id:'ch7-likert-scale', term:'Likert scale', tier:'supporting', lo:'7.4', chapterId:'ch7', section:'7.4',
      definition:'A scale on which respondents indicate the extent to which they agree or disagree with a statement.',
      example:'Asking survey respondents to rate "Adults like to take their families to fast-food restaurants" from Strongly Agree to Strongly Disagree is a Likert-scale question.' },
    { id:'ch7-mall-intercept-interview', term:'Mall intercept interview', tier:'supporting', lo:'7.4', chapterId:'ch7', section:'7.4',
      definition:'A personal interview conducted with consumers visiting a shopping center, reducing the cost of home visits while allowing visual aids like ads or products.' },
    { id:'ch7-information-technology', term:'Information technology', tier:'supporting', lo:'7.5', chapterId:'ch7', section:'7.5',
      definition:'All of the computing resources that collect, store, and analyze data in an organization.' },
    { id:'ch7-data-visualization', term:'Data visualization', tier:'supporting', lo:'7.5', chapterId:'ch7', section:'7.5',
      definition:'The presentation of the results of a data analysis in visual form, such as charts and graphs.' },
    { id:'ch7-data-warehouse', term:'Data warehouse', tier:'supporting', lo:'7.5', chapterId:'ch7', section:'7.5',
      definition:'The organized collection of databases, from internal and external sources, used to store and manage a firm\u2019s data, often housed in the cloud.' },
    { id:'ch7-artificial-intelligence', term:'Artificial intelligence', tier:'supporting', lo:'7.5', chapterId:'ch7', section:'7.5',
      definition:'Platforms that undertake reasoning and commonsense tasks to allow computers to behave intelligently, such as guiding self-driving cars or making purchase recommendations.' },
    { id:'ch7-predictive-modeling', term:'Predictive modeling', tier:'supporting', lo:'7.5', chapterId:'ch7', section:'7.5',
      definition:'A refinement of data mining that uses statistical models built from predictors, or variables, to foretell future consumer behavior.' },
    { id:'ch7-direct-forecast', term:'Direct forecast', tier:'supporting', lo:'7.6', chapterId:'ch7', section:'7.6',
      definition:'A judgmental sales forecast that estimates the value to be forecast without any intervening steps.' },
    { id:'ch7-lost-horse-forecast', term:'Lost-horse forecast', tier:'supporting', lo:'7.6', chapterId:'ch7', section:'7.6',
      definition:'A judgmental forecast that starts with the last known value of an item, then adjusts based on positive and negative factors that could affect it.' },
    { id:'ch7-survey-buyers-intentions', term:'Survey of buyers\u2019 intentions forecast', tier:'supporting', lo:'7.6', chapterId:'ch7', section:'7.6',
      definition:'A sales forecast based on asking prospective customers if they are likely to buy the product during a future time period.' },
    { id:'ch7-salesforce-survey-forecast', term:'Salesforce survey forecast', tier:'supporting', lo:'7.6', chapterId:'ch7', section:'7.6',
      definition:'A sales forecast based on estimates from the firm\u2019s own salespeople, who are close to customers but can be biased forecasters.' },
    { id:'ch7-trend-extrapolation', term:'Trend extrapolation', tier:'supporting', lo:'7.6', chapterId:'ch7', section:'7.6',
      definition:'A statistical forecasting method that extends a pattern observed in past data into the future.',
      plain:'Drawing a straight line through past data points and extending that line forward in time to predict future values.',
      example:'If a plant shop\u2019s houseplant sales have grown by about 50 plants every month for a year, trend extrapolation would predict roughly the same 50-plant monthly increase going forward.',
      formula:'Next period\u2019s forecast = Last known value + (Average period-over-period change)' }
  ],

  caseStudies: [
    { id:'ch9-cs-apple-npd', title:'Apple: The World-Class New-Product Machine', lo:'9.1', tier:'must_know', chapterId:'ch9',
      summary:'Apple\u2019s new-product successes \u2014 the Apple II, Macintosh, iPod, iPhone, iPad, CarPlay, Apple Watch, AirPods, and more \u2014 revolutionized five industries. But Apple has also stumbled: the Apple III and Lisa, the Newton PDA, the Macintosh Portable, and the "Hockey Puck" Mouse were all discontinued failures, and even the wildly successful iPhone grew directly out of lessons learned from a failed original 2005 music phone.',
      whyItMatters:'It shows that new-product development is a genuine challenge even for the most admired companies in the world \u2014 and that studying failures carefully can directly produce a company\u2019s next big success.' },
    { id:'ch9-cs-crapola', title:'Crapola! Granola\u2019s Product Line', lo:'9.2', tier:'must_know', chapterId:'ch9',
      summary:'Brainstorm Bakery\u2019s Crapola! granola line started as an edgy party joke between owners Brian and Andrea Strom, combining CRanberry and APple granOLA. The company has since extended the product line into flavors like "Number Two" and "Colon-ial Times," sold through Walmart, regional retailers, and online at crapola.us.',
      whyItMatters:'It\u2019s a real, memorable example of how a single product idea grows into a full product line, and how product line extensions let a small company gain retail distribution efficiencies without needing entirely new suppliers.' },
    { id:'ch9-cs-feature-bloat-fatigue', title:'Feature Bloat and Feature Fatigue', lo:'9.4', tier:'must_know', chapterId:'ch9',
      summary:'Research shows that while consumers say they want more product features, the added "feature bloat" actually leads to consumer overwhelm. University of Maryland researchers found that consumers weigh capability more heavily before a purchase and usability more heavily after \u2014 so they often pick overly complex products that leave them dissatisfied once they start actually using them, a phenomenon called "feature fatigue."',
      whyItMatters:'It directly challenges the common assumption that more features always mean a better, more successful product \u2014 useful for understanding why some highly capable products still fail to build loyal, satisfied repeat customers.' },
    { id:'ch9-cs-kold', title:'Kold by Keurig Dr Pepper: Failing to Satisfy Critical Factors', lo:'9.4', tier:'must_know', chapterId:'ch9',
      summary:'Kold, a countertop soda machine that let users make chilled, carbonated Coca-Cola, Dr Pepper, and other beverages at home, tasted great but failed on nearly every other critical factor: it was too large to fit on most kitchen countertops, took too long to produce a drink, and was priced at $370 with an additional $1.25 cost per 8-ounce drink.',
      whyItMatters:'It demonstrates that even a product with excellent core quality (great-tasting drinks) can still fail if it doesn\u2019t satisfy other factors, like size, speed, and price, that consumers consider critical.' },
    { id:'ch9-cs-google-glass', title:'Was Google Glass Half Full or Half Empty?', lo:'9.5', tier:'must_know', chapterId:'ch9',
      summary:'Google sold its Google Glass prototype, a $1,500 pair of augmented-reality eyeglasses, to 8,000 "Glass Explorers" before the finished product was ready \u2014 and the public quickly judged the unfinished prototype as the real thing. Beyond short battery life and poor video quality, incomplete concept testing meant Google never fully understood how consumers would perceive the device, and wearers were mocked as "Glassholes" and banned from clubs and theaters over privacy concerns.',
      whyItMatters:'It\u2019s a cautionary tale about skipping or rushing the screening and evaluation stage \u2014 especially concept testing \u2014 and about releasing an unfinished prototype to the public before it\u2019s ready.' },
    { id:'ch9-cs-boeing-bk-commercialization', title:'Commercialization Disasters: Boeing 787 and Burger King Fries', lo:'9.5', tier:'supporting', chapterId:'ch9',
      summary:'Boeing\u2019s 787 Dreamliner promised 20 percent better fuel efficiency but suffered carbon-fiber wing production problems, a "high-tech skin" that failed to dissipate lightning, and lithium-ion battery fires that grounded the entire fleet. Separately, Burger King spent millions developing a new french fry to compete with McDonald\u2019s, plus a "Satisfries" version marketed on nutrition, but discontinued Satisfries because it failed to communicate a meaningful point of difference and cost more than regular fries.',
      whyItMatters:'Both examples show that even well-funded, carefully developed products can still fail dramatically at the final, most expensive stage of commercialization.' },

    { id:'ch1-cs-bombas', title:'Bombas: Marketing with a Mission', lo:'1.1', tier:'must_know', chapterId:'ch1',
      summary:'Bombas co-founders Randy Goldberg and David Heath learned that socks were the most-requested item at homeless shelters, then spent years researching and testing prototypes to design a seamless-toe, cushioned sock before building a "One Purchased = One Donated" brand around it, growing to over $250 million in annual sales.',
      whyItMatters:'It shows that a strong marketing program starts with genuinely researching and satisfying a real need, not just with clever advertising \u2014 the mission and the product had to come first.' },
    { id:'ch1-cs-dominos-exchange', title:'Four Requirements in Action: Ordering from Domino\u2019s', lo:'1.1', tier:'supporting', chapterId:'ch1',
      summary:'A late-night craving for pizza (an unsatisfied need) meets a local Domino\u2019s owner who wants to sell pizza (another unsatisfied need); both have the desire and ability to act, a phone app or storefront lets them communicate, and money changes hands for food \u2014 completing an exchange, sometimes via Domino\u2019s self-driving delivery robot, Nuro.',
      whyItMatters:'It walks through all four conditions required for any marketing exchange to occur, using an everyday, relatable transaction.' },
    { id:'ch1-cs-showstoppers', title:'Spotting "Showstoppers": Ray-Ban, Zevia, and Stitch Fix', lo:'1.2', tier:'must_know', chapterId:'ch1',
      summary:'Ray-Ban Stories smart glasses risk the same price and "nerdy look" showstoppers that doomed Google Glass; Zevia\u2019s stevia-sweetened soda risks an aftertaste complaint; and Stitch Fix\u2019s styling subscription faces 400 to 600 competing subscription services and subscriber fatigue \u2014 three real products with real benefits, each facing a specific factor that could sink it.',
      whyItMatters:'It shows that even a product with a genuine consumer benefit can still fail if marketers don\u2019t identify and address its specific "showstopper" before launch.' },
    { id:'ch1-cs-value-strategies', title:'Three Value Strategies: Target, Starbucks, Nordstrom', lo:'1.4', tier:'must_know', chapterId:'ch1',
      summary:'Target competes on best price ("Expect more, pay less"), Starbucks competes on best product ("inspire and nurture the human spirit" one cup at a time), and Nordstrom competes on best service (delivering the best possible shopping experience) \u2014 three different, successful approaches to delivering customer value.',
      whyItMatters:'It demonstrates that a firm doesn\u2019t need to win on every dimension of value at once \u2014 picking one clear value strategy and living it consistently can build a highly successful brand.' },
    { id:'ch1-cs-3m-postit', title:'3M\u2019s Post-it\u00ae Flag Highlighter and Pen', lo:'1.3', tier:'must_know', chapterId:'ch1',
      summary:'3M inventor David Windorski hired four college students to observe how students really studied, discovering they highlighted passages and then marked pages with Post-it Notes or Flags. He combined a highlighter with a built-in Post-it Flag dispenser, then built two separate marketing programs \u2014 one targeting college students through campus bookstores, another targeting office workers through office-supply wholesalers with a companion Post-it Flag Pen.',
      whyItMatters:'It\u2019s a complete, real example of the marketing mix and target market working together: the same underlying product idea led to two different marketing programs for two different target markets.' },
    { id:'ch1-cs-trader-joes', title:'Market Orientation in Practice: Trader Joe\u2019s', lo:'1.5', tier:'supporting', chapterId:'ch1',
      summary:'Trader Joe\u2019s keeps prices low largely through private-label products rather than national brands, stocks unusual and affordable items unavailable elsewhere, and trains staff to "engage" with shoppers directly \u2014 while deliberately choosing not to sell online, arguing its products work best as part of the full in-store experience.',
      whyItMatters:'It shows what a genuine, consistently applied market orientation looks like in practice, beyond just running customer surveys.' },

    { id:'ch4-cs-women-car-buyers', title:'Enlightened Carmakers and Women Car Buyers', lo:'4.1', tier:'must_know', chapterId:'ch4',
      summary:'Women make 62 percent of new-car buying decisions and influence 85 percent of them, yet women and men weigh problem recognition, evaluative criteria, and perceived risk differently \u2014 women view safety as surviving a crash rather than just avoiding one, and shop three dealerships on average versus two for men.',
      whyItMatters:'It shows that the same five-stage purchase decision process can play out very differently depending on who is buying, which is why understanding a specific target market\u2019s decision process matters as much as understanding the stages themselves.' },
    { id:'ch4-cs-smartphone-comparison', title:'Choosing a 5G Smartphone', lo:'4.1', tier:'supporting', chapterId:'ch4',
      summary:'A shopper comparing a Google Pixel 7, OnePlus Nord N200, Motorola Moto G Power, and Samsung Galaxy A32 on price, display, audio quality, durability, camera quality, and battery life uses those evaluative criteria to narrow the full market down to a small consideration set.',
      whyItMatters:'It\u2019s a clean, concrete walkthrough of how evaluative criteria turn a crowded product category into a short, manageable consideration set.' },
    { id:'ch4-cs-apple-journey', title:'Apple\u2019s Consumer Journey Map', lo:'4.1', tier:'supporting', chapterId:'ch4',
      summary:'Apple touches consumers through advertising and social media before a purchase, through its website, Genius Bar staff, and store design during a purchase, and through its loyalty program and technical support afterward \u2014 mapped as one continuous consumer journey across all three phases.',
      whyItMatters:'It shows how a single poorly designed touchpoint, like a hard-to-navigate website, can become a "pain point" that costs a sale anywhere along an otherwise strong customer journey.' },
    { id:'ch4-cs-snow-pup', title:'Toro\u2019s Snow Pup Becomes Snow Master', lo:'4.3', tier:'must_know', chapterId:'ch4',
